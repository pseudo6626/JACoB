name: Publish or update a JACoB Community Tab
description: Upload the submission file generated by JACoB. No code or registry editing required.
title: "[Community Tab] "
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a Community Tab
        Use **Tab Manager → Share** in JACoB to prepare your submission first.

        JACoB creates a `.jacobsubmit.json` file containing the tab HTML and all registry metadata. Upload that file below and submit this form. GitHub will use your account as the maintainer identity for new tabs and remixes, and will verify maintainer access for updates.

        **The uploaded tab will be public.** Do not submit passwords, private API keys, personal information, or anything else that should not be published.
  - type: upload
    id: submission
    attributes:
      label: JACoB submission file
      description: Upload the `.jacobsubmit.json` file created by JACoB.
    validations:
      required: true
      accept: ".json"
  - type: checkboxes
    id: public-confirmation
    attributes:
      label: Public submission
      options:
        - label: I understand that this tab and its source HTML will be public if accepted into Community Tabs.
          required: true
