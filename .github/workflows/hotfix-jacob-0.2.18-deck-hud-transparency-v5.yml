name: Hotfix JACoB 0.2.18 Deck HUD Transparency + Decky Setup v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxfixes-dev libxcomposite-dev \
            libpipewire-0.3-dev libwayland-dev \
            flatpak flatpak-builder
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Apply Deck HUD transparency and Decky setup patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"{label}: source anchor not found")

          # Decky HUD renderer: only request Gamescope composition while a
          # visible HUD surface exists, and make that surface explicitly clear.
          p = Path("packaging/decky/JACoB-HUD/src/index.tsx")
          s = p.read_text(encoding="utf-8")

          replacement = r'''type NamedScene = [string, Scene];

          function HUDSurface({scenes}:{scenes:NamedScene[]}){
            useUIComposition(UIComposition.Notification);
            const vp=useViewport();

            return <div aria-hidden="true" style={{
              position:"fixed",
              left:0,
              top:0,
              width:"100vw",
              height:"100vh",
              pointerEvents:"none",
              zIndex:2147483000,
              overflow:"hidden",
              background:"transparent",
              backgroundColor:"transparent"
            }}>
              <svg
                viewBox={`0 0 ${vp.w} ${vp.h}`}
                preserveAspectRatio="none"
                aria-hidden="true"
                fill="none"
                style={{
                  position:"absolute",
                  left:0,
                  top:0,
                  width:"100%",
                  height:"100%",
                  display:"block",
                  pointerEvents:"none",
                  overflow:"visible",
                  background:"transparent",
                  backgroundColor:"transparent"
                }}
              >
                {scenes.map(([name,scene])=>
                  <g key={name} opacity={scene.opacity??1}>
                    {(scene.items||[]).map((item,idx)=>
                      renderItem(item,scene,`${name}:${idx}`,vp)
                    )}
                  </g>
                )}
              </svg>
            </div>;
          }

          function HUDOverlay(){
            const snap=useSnapshot();
            const scenes=useMemo(
              ()=>Object.entries(snap.layers||{})
                .sort((a,b)=>(a[1].z||0)-(b[1].z||0)) as NamedScene[],
              [snap]
            );
            const active=!!snap.connected && !!snap.visible && scenes.length>0;
            if(!active) return null;
            return <HUDSurface scenes={scenes}/>;
          }

          function Content(){'''

          pattern = re.compile(
              r'function HUDOverlay\(\)\{.*?\n\}\n\nfunction Content\(\)\{',
              re.S,
          )
          if pattern.search(s):
              s = pattern.sub(replacement, s, count=1)
          elif "function HUDSurface(" not in s:
              raise SystemExit("Deck HUD renderer: source anchor not found")

          p.write_text(s, encoding="utf-8")

          # Force installed Decky payload refresh.
          p = Path("packaging/decky/JACoB-HUD/package.json")
          pkg = json.loads(p.read_text(encoding="utf-8"))
          pkg["version"] = "0.1.4"
          p.write_text(json.dumps(pkg, indent=2) + "\n", encoding="utf-8")

          # Decky first-run handling. Do not silently execute a privileged
          # third-party installer; offer the official Decky page instead.
          p = Path("packaging/flatpak/jacob-flatpak-launch")
          s = p.read_text(encoding="utf-8")

          old = '''else
            printf '[%s] Decky Loader not detected; HUD bridge retained at %s.\\n' "$(date -Is)" "$HOST_DECKY_DIR" >> "$LOG_FILE"
          fi
          '''
          new = '''else
            printf '[%s] Decky Loader not detected; HUD bridge retained at %s.\\n' "$(date -Is)" "$HOST_DECKY_DIR" >> "$LOG_FILE"

            if [[ "${1:-}" != "--service-only" ]]; then
              DECKY_GUIDE_STAMP="$HOST_DIR/.decky-install-guidance-shown"
              DECKY_URL="https://github.com/SteamDeckHomebrew/decky-loader"

              if [[ ! -f "$DECKY_GUIDE_STAMP" ]]; then
                printf '[%s] Decky is required for JACoB in-game HUD rendering. Opening official installation guidance.\\n' "$(date -Is)" >> "$LOG_FILE"

                if flatpak-spawn --host sh -lc 'command -v kdialog >/dev/null 2>&1'; then
                  if flatpak-spawn --host kdialog \
                    --title "JACoB Steam Deck Setup" \
                    --yesno "JACoB is installed, but Decky Loader is required for JACoB HUD overlays in Gaming Mode. Open the official Decky installation page now?"; then
                    flatpak-spawn --host xdg-open "$DECKY_URL" >/dev/null 2>&1 || true
                  fi
                else
                  flatpak-spawn --host xdg-open "$DECKY_URL" >/dev/null 2>&1 || true
                fi

                printf '%s\\n' "$(date -Is)" > "$DECKY_GUIDE_STAMP"
              fi
            fi
          fi
          '''
          s = replace_once(s, old, new, "Decky first-run guidance")
          p.write_text(s, encoding="utf-8")

          # README: remove obsolete helper-script instructions.
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          readme_new = '''Steam Deck users should install the `JACoB-<version>-SteamDeck.flatpak` release asset in Desktop Mode and launch **JACoB Steam Deck Setup** once. The setup installs the native host payload and integrates JACoB with Elite's Steam launch options. **Decky Loader is required only for JACoB's in-game HUD renderer**; if Decky is missing, setup directs the user to the official Decky installation page. Full step-by-step instructions are in [`docs/INSTALLATION.md`](docs/INSTALLATION.md).

          '''
          readme_pattern = re.compile(
              r'Steamdeck users should download both the linux version.*?\n\n',
              re.S | re.I,
          )
          if readme_pattern.search(s):
              s = readme_pattern.sub(readme_new, s, count=1)
          elif "Decky Loader is required only for JACoB" not in s:
              raise SystemExit("README Steam Deck install paragraph not found")
          p.write_text(s, encoding="utf-8")

          # Installation guide: document the actual Decky dependency and the
          # current Gamescope/PipeWire + Decky renderer architecture.
          p = Path("docs/INSTALLATION.md")
          s = p.read_text(encoding="utf-8")
          docs_new = '''After setup, launch Elite Dangerous normally from Gaming Mode. JACoB starts with Elite and its browser UI can be selected as the second window through the Steam window switcher.

          The Flatpak is only the installer/bootstrap. The actual JACoB core runs natively on the Steam Deck host so Gamescope capture, Linux input, journal/status access and the in-app updater are not trapped inside a Flatpak sandbox.

          ### Decky Loader requirement for HUD overlays

          JACoB's normal web UI, journal/status tools, input bridge, Game View, Vision and OCR do not require Decky Loader. **The in-game HUD overlay does.** JACoB ships its own Decky HUD bridge, but Decky Loader must be installed so Steam's Gaming Mode UI can load that bridge.

          JACoB Steam Deck Setup checks for Decky. If Decky is missing, it offers to open the official Decky Loader page. To install Decky manually:

          1. Switch the Steam Deck to **Desktop Mode**.
          2. Open the official [Decky Loader repository](https://github.com/SteamDeckHomebrew/decky-loader).
          3. Download the official `decky_installer.desktop` installer. If Firefox saves it as `decky_installer.desktop.download`, rename it to `decky_installer.desktop`.
          4. Move the installer to the Desktop and double-click it.
          5. Authorize the installer when prompted and choose **Latest Release**.
          6. Return to Gaming Mode.
          7. Launch **JACoB Steam Deck Setup** once more. JACoB copies its bundled HUD bridge into Decky's plugin directory and requests a Decky reload. A reboot also loads the bridge if the reload is declined.

          Decky is maintained by the SteamDeckHomebrew project and is separate from JACoB. JACoB does not silently pipe a remote privileged installer into a shell.

          ### Steam Deck capture and HUD

          The full Linux build is compiled natively on Linux with CGO enabled. Game View, Vision and OCR use JACoB's Elite-only Gamescope/PipeWire capture path. The capture helper identifies Elite Dangerous (Steam app `359320`) and does not fall back to monitor or desktop capture.

          The HUD uses the bundled JACoB Decky renderer and Steam's CEF/Gamescope notification composition layer. The renderer consumes the same HUD2 `OverlayScene` contract as Windows. The HUD layer is composited after the Elite frame, so JACoB Vision does not ingest JACoB's own overlay.

          OCR is capability-checked separately and uses the bundled Tesseract runtime in the Steam Deck package.
          '''
          docs_pattern = re.compile(
              r'After setup, launch Elite Dangerous normally from Gaming Mode\..*?OCR remains platform-dependent and should be capability-checked separately\.\n',
              re.S,
          )
          if docs_pattern.search(s):
              s = docs_pattern.sub(docs_new, s, count=1)
          elif "### Decky Loader requirement for HUD overlays" not in s:
              raise SystemExit("Steam Deck installation guide anchor not found")
          p.write_text(s, encoding="utf-8")
          PY

          grep -Fq 'function HUDSurface' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'backgroundColor:"transparent"' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq '"version": "0.1.4"' packaging/decky/JACoB-HUD/package.json
          grep -Fq 'Decky Loader requirement for HUD overlays' docs/INSTALLATION.md
          grep -Fq 'Decky Loader is required only for JACoB' README.md
          bash -n packaging/flatpak/jacob-flatpak-launch
          git diff --check

      - name: Build Decky HUD renderer
        working-directory: packaging/decky/JACoB-HUD
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build
          test -s dist/index.js

      - name: Stage Decky production payload for Flatpak
        run: |
          set -euo pipefail
          rm -rf packaging/flatpak/JACoB-HUD
          mkdir -p packaging/flatpak/JACoB-HUD
          cp packaging/decky/JACoB-HUD/plugin.json packaging/flatpak/JACoB-HUD/
          cp packaging/decky/JACoB-HUD/package.json packaging/flatpak/JACoB-HUD/
          cp -a packaging/decky/JACoB-HUD/dist packaging/flatpak/JACoB-HUD/

          test -s packaging/flatpak/JACoB-HUD/dist/index.js
          grep -Fq '"version": "0.1.4"' packaging/flatpak/JACoB-HUD/package.json
          grep -Fq 'transparent' packaging/flatpak/JACoB-HUD/dist/index.js

      - name: Prepare bundled OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'

          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )
          test -x packaging/flatpak/tesseract-appdir/AppRun

      - name: Test Linux repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-v5-windows.exe ./cmd/jacob

      - name: Build replacement Steam Deck Flatpak
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          mkdir -p dist

          grep -Fq 'Version    = "0.2.18-alpha"' internal/buildinfo/version.go
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            "dist/JACoB-$v-SteamDeck.flatpak" \
            com.pseudosci.JACoB \
            stable

          test -s "dist/JACoB-$v-SteamDeck.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-HUD-TRANSPARENCY-V5-SHA256.txt

      - name: Commit tested hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf packaging/decky/JACoB-HUD/node_modules
          rm -rf packaging/decky/JACoB-HUD/dist
          rm -f packaging/decky/JACoB-HUD/pnpm-lock.yaml

          rm -rf packaging/flatpak/tesseract-appdir
          rm -f packaging/flatpak/JACoB
          rm -f packaging/flatpak/jacob-icon-256.png
          rm -f packaging/flatpak/VERSION

          git add \
            README.md \
            docs/INSTALLATION.md \
            packaging/decky/JACoB-HUD/src/index.tsx \
            packaging/decky/JACoB-HUD/package.json \
            packaging/flatpak/JACoB-HUD \
            packaging/flatpak/jacob-flatpak-launch

          if git diff --cached --quiet; then
            echo "Deck HUD transparency/Decky setup hotfix already present."
          else
            git commit -m "Fix Deck HUD transparency and Decky setup guidance"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jacob-0.2.18-deck-hud-transparency-v5
          path: |
            dist/JACoB-0.2.18-alpha-SteamDeck.flatpak
            dist/STEAMDECK-HUD-TRANSPARENCY-V5-SHA256.txt

      - name: Upload replacement Deck release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          tag="v$v"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-TRANSPARENCY-V5-SHA256.txt" \
              --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-TRANSPARENCY-V5-SHA256.txt" \
              --target "$(git rev-parse HEAD)" \
              --draft \
              --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck HUD transparency + Decky setup guidance hotfix."
          fi
