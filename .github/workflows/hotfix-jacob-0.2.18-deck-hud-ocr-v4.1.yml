          gofmt -w internal/vision/ocr_linux.go

      - name: Rebuild passive Decky HUD runtime
        working-directory: packaging/decky/JACoB-HUD
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build
          test -s dist/index.js

          rm -rf ../../flatpak/JACoB-HUD
          mkdir -p ../../flatpak/JACoB-HUD
          cp plugin.json package.json ../../flatpak/JACoB-HUD/
          cp -a dist ../../flatpak/JACoB-HUD/

          # Production renderer is intentionally passive. Steam CEF talks
          # directly to the JACoB loopback endpoint.
          test ! -e ../../flatpak/JACoB-HUD/main.py

      - name: Add OCR TSV regression test
        run: |
          set -euo pipefail
          cat > internal/vision/ocr_tsv_linux_test.go <<'EOF'
          //go:build linux

          package vision

          import "testing"

          func TestParseTesseractTSVAcceptsDecimalConfidence(t *testing.T) {
            data := []byte(
              "level\tpage_num\tblock_num\tpar_num\tline_num\tword_num\tleft\ttop\twidth\theight\tconf\ttext\n" +
              "5\t1\t1\t1\t1\t1\t10\t20\t60\t18\t96.437218\tTEST\n",
            )
            got := parseTesseractTSV(data, 200, 100)
            if got.Text != "TEST" {
              t.Fatalf("expected TEST, got %q", got.Text)
            }
            if len(got.Lines) != 1 || len(got.Lines[0].Words) != 1 {
              t.Fatalf("expected one recognized word, got %#v", got.Lines)
            }
          }
          EOF
          gofmt -w internal/vision/ocr_tsv_linux_test.go

      - name: Validate HUD runtime contract
        run: |
          set -euo pipefail

          test -s packaging/flatpak/JACoB-HUD/plugin.json
          test -s packaging/flatpak/JACoB-HUD/package.json
          test -s packaging/flatpak/JACoB-HUD/dist/index.js
          test ! -e packaging/flatpak/JACoB-HUD/main.py

          grep -Fq 'HUD_URL="http://127.0.0.1:6626/api/deck/hud/state"' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'void hudTransportLoop()' packaging/decky/JACoB-HUD/src/index.tsx
          ! grep -Fq 'addEventListener' packaging/decky/JACoB-HUD/src/index.tsx
          ! grep -Fq 'jacob_hud_snapshot' packaging/decky/JACoB-HUD/src/index.tsx

          python - <<'PY'
          import json
          from pathlib import Path
          pkg=json.loads(Path("packaging/flatpak/JACoB-HUD/package.json").read_text())
          assert pkg["version"] == "0.1.3"
          PY

          grep -Fq '!packaging/flatpak/JACoB-HUD/dist/index.js' .gitignore

          # git check-ignore -v returns success even when the matching pattern is
          # a negation rule (!path), so -v cannot be used as the ignored/not-
          # ignored assertion. Quiet mode returns 1 for an actually unignored
          # path, which is what we want here.
          if git check-ignore -q packaging/flatpak/JACoB-HUD/dist/index.js; then
            echo "ERROR: Decky runtime is still ignored by Git"
            git check-ignore -v packaging/flatpak/JACoB-HUD/dist/index.js || true
            exit 1
          fi

          # Also prove Git sees the generated runtime as addable/untracked.
          git status --short --untracked-files=all -- packaging/flatpak/JACoB-HUD/dist/index.js

      - name: Validate OCR parser fix
        run: |
          set -euo pipefail
          grep -Fq 'for i := 1; i <= 9; i++' internal/vision/ocr_linux.go
          grep -Fq 'Column 10 is confidence' internal/vision/ocr_linux.go
          git diff --check

      - name: Test Linux repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/vision
          go test ./internal/platform
          go test ./internal/spatial
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-hotfix-v4-windows.exe ./cmd/jacob
          go build -trimpath -o /tmp/JACoB-Setup-hotfix-v4-windows.exe ./cmd/installer

      - name: Build Linux core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          v='0.2.18-alpha'
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          ldd "dist/JACoB-$v-linux-amd64" | tee /tmp/core-ldd.txt
          ! grep -q 'not found' /tmp/core-ldd.txt

      - name: Prepare OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
          # Preserve the repository's existing pinned OCR artifact verification
          # by deriving the expected hash from the current workflow/source when
          # this placeholder is replaced below.
          true

          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )

      - name: Build Deck Flatpak before commit
        run: |
          set -euo pipefail
          v='0.2.18-alpha'

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          test -s packaging/flatpak/JACoB-HUD/dist/index.js
          test -s packaging/flatpak/JACoB-HUD/package.json
          test ! -e packaging/flatpak/JACoB-HUD/main.py

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          test -s "dist/JACoB-$v-SteamDeck.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-HUD-OCR-V4-SHA256.txt

      - name: Commit tested v4 hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf packaging/decky/JACoB-HUD/node_modules
          rm -rf packaging/decky/JACoB-HUD/dist
          rm -f packaging/decky/JACoB-HUD/pnpm-lock.yaml

          git add \
            .gitignore \
            internal/vision/ocr_linux.go \
            internal/vision/ocr_tsv_linux_test.go \
            packaging/decky/JACoB-HUD/src/index.tsx \
            packaging/decky/JACoB-HUD/package.json \
            packaging/flatpak/JACoB-HUD/plugin.json \
            packaging/flatpak/JACoB-HUD/package.json

          # dist/ is globally ignored in this repo, so explicitly force the one
          # generated Decky runtime that must ship with source builds.
          git add -f packaging/flatpak/JACoB-HUD/dist/index.js

          if git ls-files --error-unmatch packaging/flatpak/JACoB-HUD/main.py >/dev/null 2>&1; then
            git rm packaging/flatpak/JACoB-HUD/main.py
          fi

          if git diff --cached --quiet; then
            echo "HUD/OCR v4 hotfix already present."
          else
            git commit -m "Fix Deck OCR TSV parsing and direct HUD transport"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Upload replacement Deck release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          tag="v$v"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-OCR-V4-SHA256.txt" \
              --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-OCR-V4-SHA256.txt" \
              --target "$(git rev-parse HEAD)" \
              --draft --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck direct CEF HUD transport + OCR TSV parser fix."
          fi
