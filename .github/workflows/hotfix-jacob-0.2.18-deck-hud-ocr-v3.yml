          gofmt -w internal/vision/ocr_linux.go

      - name: Rebuild complete Decky plugin payload
        working-directory: packaging/decky/JACoB-HUD
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build

          test -s plugin.json
          test -s package.json
          test -s main.py
          test -s dist/index.js
          python -m py_compile main.py

          rm -rf ../../flatpak/JACoB-HUD
          mkdir -p ../../flatpak/JACoB-HUD
          cp plugin.json package.json main.py ../../flatpak/JACoB-HUD/
          cp -a dist ../../flatpak/JACoB-HUD/

      - name: Validate Decky production layout
        run: |
          set -euo pipefail

          test -s packaging/flatpak/JACoB-HUD/plugin.json
          test -s packaging/flatpak/JACoB-HUD/package.json
          test -s packaging/flatpak/JACoB-HUD/main.py
          test -s packaging/flatpak/JACoB-HUD/dist/index.js

          python - <<'PY'
          import json
          from pathlib import Path

          plugin = json.loads(Path("packaging/flatpak/JACoB-HUD/plugin.json").read_text())
          package = json.loads(Path("packaging/flatpak/JACoB-HUD/package.json").read_text())

          assert plugin["name"] == "JACoB HUD Bridge"
          assert plugin["api_version"] == 1
          assert "version" not in plugin
          assert package["name"] == "jacob-hud-bridge"
          assert package["version"] == "0.1.2"
          PY

      - name: Validate adaptive Linux OCR
        run: |
          set -euo pipefail
          grep -Fq 'psm6 -> psm11 -> light-text-binary/psm11' internal/vision/ocr_linux.go
          grep -Fq 'linuxOCRLightTextVariant' internal/vision/ocr_linux.go
          grep -Fq 'otsuThreshold(gray)' internal/vision/ocr_linux.go
          git diff --check

      - name: Add OCR unit coverage
        run: |
          set -euo pipefail
          cat > internal/vision/ocr_lighttext_linux_test.go <<'EOF'
          //go:build linux

          package vision

          import (
            "image"
            "image/color"
            "testing"
          )

          func TestLinuxOCRLightTextVariant(t *testing.T) {
            img := image.NewRGBA(image.Rect(0, 0, 100, 50))
            for y := 0; y < 50; y++ {
              for x := 0; x < 100; x++ {
                img.SetRGBA(x, y, color.RGBA{R: 8, G: 8, B: 8, A: 255})
              }
            }

            for y := 15; y < 35; y++ {
              for x := 25; x < 30; x++ {
                img.SetRGBA(x, y, color.RGBA{R: 240, G: 240, B: 240, A: 255})
              }
            }

            out := linuxOCRLightTextVariant(img)
            g, ok := out.(*image.Gray)
            if !ok {
              t.Fatalf("expected *image.Gray, got %T", out)
            }
            if got := g.GrayAt(27, 25).Y; got > 32 {
              t.Fatalf("bright text should become dark ink, got %d", got)
            }
            if got := g.GrayAt(5, 5).Y; got < 223 {
              t.Fatalf("dark background should become white, got %d", got)
            }
          }
          EOF
          gofmt -w internal/vision/ocr_lighttext_linux_test.go

      - name: Test Linux repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/vision
          go test ./internal/platform
          go test ./internal/spatial
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-hotfix-v3-windows.exe ./cmd/jacob
          go build -trimpath -o /tmp/JACoB-Setup-hotfix-v3-windows.exe ./cmd/installer

      - name: Build Linux core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          v='0.2.18-alpha'
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          ldd "dist/JACoB-$v-linux-amd64" | tee /tmp/core-ldd.txt
          ! grep -q 'not found' /tmp/core-ldd.txt

      - name: Prepare OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'

          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )

      - name: Build Deck Flatpak before commit
        run: |
          set -euo pipefail
          v='0.2.18-alpha'

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          test -s packaging/flatpak/JACoB-HUD/package.json

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          test -s "dist/JACoB-$v-SteamDeck.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-HUD-OCR-V3-SHA256.txt

      - name: Commit tested hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf packaging/decky/JACoB-HUD/node_modules
          rm -rf packaging/decky/JACoB-HUD/dist
          rm -f packaging/decky/JACoB-HUD/pnpm-lock.yaml

          git add \
            internal/vision/ocr_linux.go \
            internal/vision/ocr_lighttext_linux_test.go \
            packaging/decky/JACoB-HUD/plugin.json \
            packaging/decky/JACoB-HUD/package.json \
            packaging/flatpak/JACoB-HUD

          if git diff --cached --quiet; then
            echo "HUD/OCR v3 hotfix already present."
          else
            git commit -m "Fix Deck HUD package and white-text OCR"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Upload replacement Deck release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          tag="v$v"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-OCR-V3-SHA256.txt" \
              --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-OCR-V3-SHA256.txt" \
              --target "$(git rev-parse HEAD)" \
              --draft --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck Decky package + adaptive white-text OCR hotfix."
          fi
