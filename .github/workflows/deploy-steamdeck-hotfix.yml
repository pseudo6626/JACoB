name: Deploy Steam Deck 0.2.17 Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-steamdeck-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply Steam Deck hotfix
        shell: bash
        run: |
          cat > /tmp/apply-steamdeck-hotfix.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path.cwd()
          
          
          def read(rel):
              p = ROOT / rel
              if not p.exists():
                  raise SystemExit(f"Missing expected file: {rel}")
              return p.read_text(encoding="utf-8")
          
          
          def write(rel, text):
              p = ROOT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8", newline="\n")
          
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 0:
                  if new in text:
                      return text, False
                  raise SystemExit(f"Hotfix anchor not found: {label}")
              if count != 1:
                  raise SystemExit(f"Hotfix anchor was not unique ({count} matches): {label}")
              return text.replace(old, new, 1), True
          
          
          changed = []
          
          # ---------------------------------------------------------------------------
          # HUD: stop competing with Mangoapp for Gamescope's single external-overlay
          # slot. Present JACoB as a transparent, non-input secondary Steam-game window.
          # ---------------------------------------------------------------------------
          rel = "internal/platform/overlay_linux.go"
          s = read(rel)
          
          s, c = replace_once(
              s,
              """    attr.background_pixel = 0;\n    attr.override_redirect = True;\n    int w = DisplayWidth(d, screen);\n    int h = DisplayHeight(d, screen);\n    Window win = XCreateWindow(d, root, 0, 0, w, h, 0, 32, InputOutput, vi.visual,\n        CWColormap | CWBorderPixel | CWBackPixel | CWOverrideRedirect, &attr);\n""",
              """    attr.background_pixel = 0;\n    int w = DisplayWidth(d, screen);\n    int h = DisplayHeight(d, screen);\n    Window win = XCreateWindow(d, root, 0, 0, w, h, 0, 32, InputOutput, vi.visual,\n        CWColormap | CWBorderPixel | CWBackPixel, &attr);\n""",
              "overlay managed-window creation",
          )
          if c:
              changed.append(rel)
          
          old_props = """    XStoreName(d, win, \"JACoB HUD\");\n\n    Atom ext = XInternAtom(d, \"GAMESCOPE_EXTERNAL_OVERLAY\", False);\n    unsigned long one = 1;\n    XChangeProperty(d, win, ext, XA_CARDINAL, 32, PropModeReplace, (unsigned char*)&one, 1);\n    Atom opacity = XInternAtom(d, \"_NET_WM_WINDOW_OPACITY\", False);\n    unsigned long opaque = 0xffffffffUL;\n    XChangeProperty(d, win, opacity, XA_CARDINAL, 32, PropModeReplace, (unsigned char*)&opaque, 1);\n\n"""
          new_props = """    XStoreName(d, win, \"JACoB HUD\");\n\n    // Gamescope's external-overlay slot is owned by Mangoapp on Steam Deck.\n    // Tag this as a secondary Elite window instead; embedded Gamescope stacks\n    // STEAM_GAME windows above the main game and can composite our ARGB pixels.\n    unsigned long elite_app = 359320UL;\n    Atom steam_game = XInternAtom(d, \"STEAM_GAME\", False);\n    XChangeProperty(d, win, steam_game, XA_CARDINAL, 32, PropModeReplace, (unsigned char*)&elite_app, 1);\n\n    unsigned long pid = (unsigned long)getpid();\n    Atom pid_atom = XInternAtom(d, \"_NET_WM_PID\", False);\n    XChangeProperty(d, win, pid_atom, XA_CARDINAL, 32, PropModeReplace, (unsigned char*)&pid, 1);\n\n    XClassHint class_hint;\n    class_hint.res_name = \"jacob-hud\";\n    class_hint.res_class = \"JACoB\";\n    XSetClassHint(d, win, &class_hint);\n\n    XWMHints *wmh = XAllocWMHints();\n    if (wmh) {\n        wmh->flags = InputHint;\n        wmh->input = False;\n        XSetWMHints(d, win, wmh);\n        XFree(wmh);\n    }\n\n    // Keep the old Gamescope external-overlay path available for non-Deck\n    // experiments, but never request it by default on SteamOS.\n    const char *external = getenv(\"JACOB_GAMESCOPE_EXTERNAL_OVERLAY\");\n    if (external && strcmp(external, \"1\") == 0) {\n        Atom ext = XInternAtom(d, \"GAMESCOPE_EXTERNAL_OVERLAY\", False);\n        unsigned long one = 1;\n        XChangeProperty(d, win, ext, XA_CARDINAL, 32, PropModeReplace, (unsigned char*)&one, 1);\n    }\n\n    Atom opacity = XInternAtom(d, \"_NET_WM_WINDOW_OPACITY\", False);\n    unsigned long opaque = 0xffffffffUL;\n    XChangeProperty(d, win, opacity, XA_CARDINAL, 32, PropModeReplace, (unsigned char*)&opaque, 1);\n    XSync(d, False);\n\n"""
          # unistd is needed for getpid.
          if "#include <unistd.h>" not in s:
              s, c2 = replace_once(s, "#include <string.h>\n", "#include <string.h>\n#include <unistd.h>\n", "overlay getpid include")
              if c2 and rel not in changed:
                  changed.append(rel)
          s, c = replace_once(s, old_props, new_props, "overlay Gamescope window properties")
          if c and rel not in changed:
              changed.append(rel)
          
          s, c = replace_once(
              s,
              'func (o *linuxOverlay) Name() string    { return "linux-x11-gamescope-external-overlay" }',
              'func (o *linuxOverlay) Name() string    { return "linux-x11-gamescope-steam-window-overlay" }',
              "overlay driver name",
          )
          if c and rel not in changed:
              changed.append(rel)
          
          s, c = replace_once(
              s,
              'note := "Designed for Steam Deck Gaming Mode/Gamescope via GAMESCOPE_EXTERNAL_OVERLAY; also works on many composited X11 desktops."',
              'note := "X11 HUD surface created as a transparent secondary Elite Steam window. Gamescope compositor visibility cannot be confirmed from the client; JACoB reports only local surface state."',
              "overlay diagnostic note",
          )
          if c and rel not in changed:
              changed.append(rel)
          write(rel, s)
          
          # ---------------------------------------------------------------------------
          # Native Gamescope/X11 focus probe. This avoids depending on xprop/xdotool and
          # also falls back to XGetInputFocus when Gamescope root properties are sparse.
          # ---------------------------------------------------------------------------
          focus_cgo = r'''//go:build linux && cgo
          
          package platform
          
          /*
          #cgo LDFLAGS: -lX11
          #include <X11/Xlib.h>
          #include <X11/Xatom.h>
          #include <stdlib.h>
          
          static int jacob_focus_read_u32(Display *d, Window w, const char *name, unsigned long *out) {
              if (!d || !name || !out) return 0;
              Atom prop = XInternAtom(d, name, True);
              if (prop == None) return 0;
              Atom actual = None;
              int format = 0;
              unsigned long nitems = 0, bytes_after = 0;
              unsigned char *data = NULL;
              int rc = XGetWindowProperty(d, w, prop, 0, 1, False, AnyPropertyType,
                  &actual, &format, &nitems, &bytes_after, &data);
              if (rc != Success || !data || nitems < 1 || format != 32) {
                  if (data) XFree(data);
                  return 0;
              }
              *out = *((unsigned long*)data);
              XFree(data);
              return 1;
          }
          
          static int jacob_focus_x11_available(void) {
              Display *d = XOpenDisplay(NULL);
              if (!d) return 0;
              XCloseDisplay(d);
              return 1;
          }
          
          static int jacob_focus_probe(unsigned long *app_id, unsigned long *steam_game, unsigned long *pid, unsigned long *window_id) {
              if (!app_id || !steam_game || !pid || !window_id) return 0;
              *app_id = 0;
              *steam_game = 0;
              *pid = 0;
              *window_id = 0;
          
              Display *d = XOpenDisplay(NULL);
              if (!d) return 0;
              Window root = DefaultRootWindow(d);
              Window candidate = 0;
              unsigned long value = 0;
          
              if (jacob_focus_read_u32(d, root, "GAMESCOPE_FOCUSED_APP", &value)) {
                  *app_id = value;
              }
          
              value = 0;
              if (jacob_focus_read_u32(d, root, "GAMESCOPE_FOCUSED_WINDOW", &value)) {
                  candidate = (Window)value;
              }
              if (!candidate) {
                  value = 0;
                  if (jacob_focus_read_u32(d, root, "_NET_ACTIVE_WINDOW", &value)) {
                      candidate = (Window)value;
                  }
              }
              if (!candidate) {
                  Window focus = None;
                  int revert = RevertToNone;
                  XGetInputFocus(d, &focus, &revert);
                  if (focus != None && focus != PointerRoot) candidate = focus;
              }
          
              // Wine/Proton can put focus on a child. Walk toward the root until we find
              // the Steam app id or process id published by the top-level client.
              Window cur = candidate;
              for (int depth = 0; cur && cur != root && depth < 12; depth++) {
                  if (!*steam_game) {
                      value = 0;
                      if (jacob_focus_read_u32(d, cur, "STEAM_GAME", &value)) *steam_game = value;
                  }
                  if (!*pid) {
                      value = 0;
                      if (jacob_focus_read_u32(d, cur, "_NET_WM_PID", &value)) *pid = value;
                  }
                  if (*steam_game && *pid) break;
          
                  Window rr = 0, parent = 0, *children = NULL;
                  unsigned int nchildren = 0;
                  if (!XQueryTree(d, cur, &rr, &parent, &children, &nchildren)) break;
                  if (children) XFree(children);
                  if (!parent || parent == cur) break;
                  cur = parent;
              }
          
              *window_id = (unsigned long)candidate;
              XCloseDisplay(d);
              return (*app_id || *steam_game || *pid || *window_id) ? 1 : 0;
          }
          */
          import "C"
          
          func linuxNativeFocusAvailable() bool {
              return C.jacob_focus_x11_available() != 0
          }
          
          // linuxNativeEliteFocus returns (resolved, elite). resolved=true means the
          // compositor/X11 focus could be identified strongly enough that callers must
          // honor the result, including a negative result when another app has focus.
          func linuxNativeFocusProbe() (resolved bool, elite bool, window uintptr) {
              var appID, steamGame, pid, win C.ulong
              if C.jacob_focus_probe(&appID, &steamGame, &pid, &win) == 0 {
                  return false, false, 0
              }
              window = uintptr(win)
              if appID != 0 {
                  return true, uint64(appID) == 359320, window
              }
              if steamGame != 0 {
                  return true, uint64(steamGame) == 359320, window
              }
              if pid != 0 {
                  return true, linuxPIDTreeIsElite(int(pid)), window
              }
              return false, false, window
          }
          
          func linuxNativeEliteFocus() (bool, bool) {
              resolved, elite, _ := linuxNativeFocusProbe()
              return resolved, elite
          }
          
          func linuxNativeEliteWindow() (uintptr, bool) {
              resolved, elite, window := linuxNativeFocusProbe()
              return window, resolved && elite && window != 0
          }
          '''
          focus_nocgo = '''//go:build linux && !cgo
          
          package platform
          
          func linuxNativeFocusAvailable() bool { return false }
          func linuxNativeEliteFocus() (bool, bool) { return false, false }
          func linuxNativeEliteWindow() (uintptr, bool) { return 0, false }
          '''
          
          for rel2, content in [
              ("internal/platform/focus_linux_x11.go", focus_cgo),
              ("internal/platform/focus_linux_nocgo.go", focus_nocgo),
          ]:
              old = (ROOT / rel2).read_text(encoding="utf-8") if (ROOT / rel2).exists() else None
              if old != content:
                  write(rel2, content)
                  changed.append(rel2)
          
          # ---------------------------------------------------------------------------
          # Input verifier: native X11/Gamescope first; keep CLI fallbacks for other
          # Linux environments. A native negative result remains fail-closed.
          # ---------------------------------------------------------------------------
          rel = "internal/platform/input_linux.go"
          s = read(rel)
          old_available = '''func (l *linuxInput) Available() bool {
          	fd, err := syscall.Open("/dev/uinput", syscall.O_WRONLY|syscall.O_NONBLOCK, 0)
          	if err != nil {
          		return false
          	}
          	_ = syscall.Close(fd)
          	_, xdotoolErr := exec.LookPath("xdotool")
          	_, xpropErr := exec.LookPath("xprop")
          	return xdotoolErr == nil || xpropErr == nil
          }
          '''
          new_available = '''func (l *linuxInput) Available() bool {
          	fd, err := syscall.Open("/dev/uinput", syscall.O_WRONLY|syscall.O_NONBLOCK, 0)
          	if err != nil {
          		return false
          	}
          	_ = syscall.Close(fd)
          	if linuxNativeFocusAvailable() {
          		return true
          	}
          	_, xdotoolErr := exec.LookPath("xdotool")
          	_, xpropErr := exec.LookPath("xprop")
          	return xdotoolErr == nil || xpropErr == nil
          }
          '''
          s, c = replace_once(s, old_available, new_available, "Linux input availability")
          if c:
              changed.append(rel)
          
          needle = '''func verifyLinuxEliteForeground() error {
          	ctx, cancel := context.WithTimeout(context.Background(), 900*time.Millisecond)
          	defer cancel()
          '''
          replacement = '''func verifyLinuxEliteForeground() error {
          	if resolved, elite := linuxNativeEliteFocus(); resolved {
          		if elite {
          			return nil
          		}
          		return fmt.Errorf("Elite Dangerous is not the foreground Gamescope/X11 app; Linux input was blocked for safety")
          	}
          
          	ctx, cancel := context.WithTimeout(context.Background(), 900*time.Millisecond)
          	defer cancel()
          '''
          s, c = replace_once(s, needle, replacement, "native Linux focus verifier")
          if c and rel not in changed:
              changed.append(rel)
          write(rel, s)
          
          # ---------------------------------------------------------------------------
          # Vision/Game View: share the stronger native focus resolver before falling
          # back to the backend's original Gamescope-property lookup.
          # ---------------------------------------------------------------------------
          rel = "internal/platform/capture_linux_x11.go"
          s = read(rel)
          needle = '''func verifiedLinuxEliteWindowX11() (uintptr, error) {
          	var win, pid, appID C.ulong
          '''
          replacement = '''func verifiedLinuxEliteWindowX11() (uintptr, error) {
          	if win, ok := linuxNativeEliteWindow(); ok {
          		return win, nil
          	}
          
          	var win, pid, appID C.ulong
          '''
          s, c = replace_once(s, needle, replacement, "Vision native focus resolver")
          if c:
              changed.append(rel)
          write(rel, s)
          
          # ---------------------------------------------------------------------------
          # Flatpak packaging: skip debug splitting of the prebuilt Go ELF. This avoids
          # flatpak-builder calling eu-strip on the runner image.
          # ---------------------------------------------------------------------------
          rel = "packaging/flatpak/com.pseudosci.JACoB.yml"
          s = read(rel)
          if "no-debuginfo: true" not in s:
              s, c = replace_once(
                  s,
                  "command: jacob-flatpak-launch\n\nfinish-args:\n",
                  "command: jacob-flatpak-launch\n\nbuild-options:\n  no-debuginfo: true\n\nfinish-args:\n",
                  "Flatpak no-debuginfo",
              )
              if c:
                  changed.append(rel)
          write(rel, s)
          
          # ---------------------------------------------------------------------------
          # Steam launcher: mark JACoB's launch context for diagnostics/future routing.
          # The focus verifier itself still requires compositor/X11 foreground proof.
          # ---------------------------------------------------------------------------
          rel = "packaging/flatpak/jacob-steam-integrate"
          s = read(rel)
          s, c = replace_once(s, 'HOOK_STAMP="$HOST_DIR/.steam-hook-v2"', 'HOOK_STAMP="$HOST_DIR/.steam-hook-v3"', "Steam hook stamp")
          if c:
              changed.append(rel)
          s, c = replace_once(
              s,
              '  JACOB_OPEN_BROWSER=1 "$JACOB_BIN" >/dev/null 2>&1 &',
              '  JACOB_OPEN_BROWSER=1 JACOB_STEAM_APP_ID=359320 "$JACOB_BIN" >/dev/null 2>&1 &',
              "Steam launch context sentinel",
          )
          if c and rel not in changed:
              changed.append(rel)
          write(rel, s)
          
          # Release notes: append once.
          rel = "RELEASE-NOTES-0.2.17-alpha.md"
          if (ROOT / rel).exists():
              s = read(rel)
              marker = "## Steam Deck field hotfix"
              if marker not in s:
                  s = s.rstrip() + """\n\n## Steam Deck field hotfix\n\n- HUD windows now use Gamescope's normal secondary `STEAM_GAME=359320` window path instead of competing with Mangoapp for the single `GAMESCOPE_EXTERNAL_OVERLAY` slot.\n- Linux input focus verification now has a native X11/Gamescope probe, including `XGetInputFocus` fallback for Proton child windows, while still failing closed when another app is positively focused.\n- Steam Deck launcher marks the JACoB process with the Elite app id for diagnostics.\n- Flatpak packaging disables unnecessary debug-symbol splitting of the prebuilt Go executable.\n"""
                  write(rel, s)
                  changed.append(rel)
          
          print("Steam Deck hotfix applied.")
          if changed:
              for item in dict.fromkeys(changed):
                  print(f"  changed: {item}")
          else:
              print("  no changes needed; hotfix already present")
          PY
          python3 /tmp/apply-steamdeck-hotfix.py

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libx11-dev libxfixes-dev
          gofmt -w \
            internal/platform/overlay_linux.go \
            internal/platform/input_linux.go \
            internal/platform/focus_linux_x11.go \
            internal/platform/focus_linux_nocgo.go \
            internal/platform/capture_linux_x11.go
          git diff --check
          CGO_ENABLED=1 go test ./...

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-steamdeck-hotfix.yml || true
          if git diff --quiet && git diff --cached --quiet; then
            echo "Hotfix already deployed."
            exit 0
          fi
          git add -A
          git commit -m "Fix Steam Deck HUD and foreground detection"
          git push origin HEAD:main
