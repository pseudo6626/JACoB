name: JACoB 0.2.14 Complete SDK11 Bootstrap

on:
  push:
    paths:
      - .github/workflows/JACoB-0.2.14-Complete-SDK11-Bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Detect SDK11 baseline
        id: baseline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = Get-Content internal/buildinfo/version.go -Raw
          $app = Get-Content internal/webui/assets/app.js -Raw
          $spatial = (Test-Path 'internal/spatial/mapper.go') -and ($app -match 'spatial:Object\.freeze')
          $utilities = (Test-Path 'internal/galaxy/galaxy.go') -and (Test-Path 'internal/webfetch/scheduler.go') -and ($app -match 'fetchQueued') -and ($app -match 'video:Object\.freeze') -and ($app -match 'close:')
          if (-not $spatial -and $version -notmatch '0\.2\.13-alpha') {
            throw 'Complete SDK11 bootstrap expects either the 0.2.13-alpha / SDK10 baseline or an existing 0.2.14 spatial SDK11 baseline.'
          }
          "spatial=$($spatial.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "utilities=$($utilities.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Spatial already present: $spatial"
          Write-Host "Utilities already present: $utilities"

