      - name: Validate scripts and Deck backend
        run: |
          set -euo pipefail
          bash -n packaging/flatpak/jacob-flatpak-launch
          bash -n packaging/flatpak/jacob-steam-integrate
          grep -Fq 'GAMESCOPE_FOCUSED_APP_GFX' internal/platform/focus_linux_x11.go
          grep -Fq 'linux-x11-gamescope-steam-window-overlay' internal/platform/overlay_linux.go
          grep -Fq 'PACKAGED_HASH=' packaging/flatpak/jacob-flatpak-launch
          grep -Fq '.steam-hook-v4' packaging/flatpak/jacob-steam-integrate

      - name: Test Linux
        env:
          CGO_ENABLED: '1'
        run: go test ./...

      - name: Build Deck verification binary
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/JACoB-deck-check ./cmd/jacob
          ldd /tmp/JACoB-deck-check
          ! ldd /tmp/JACoB-deck-check | grep -q 'not found'
          strings /tmp/JACoB-deck-check | grep -Fq 'linux-x11-gamescope-steam-window-overlay'
          strings /tmp/JACoB-deck-check | grep -Fq 'GAMESCOPE_FOCUSED_APP_GFX'

      - name: Commit tested patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/focus_linux_x11.go packaging/flatpak/jacob-flatpak-launch packaging/flatpak/jacob-steam-integrate
          if git diff --cached --quiet; then
            echo "Patch is already present."
          else
            git commit -m "Fix Steam Deck focus, launcher, and payload refresh"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Start rebuilt 0.2.17 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-releases.yml             --ref "${{ github.event.repository.default_branch }}"             -f version=0.2.17-alpha             -f create_draft_release=true
