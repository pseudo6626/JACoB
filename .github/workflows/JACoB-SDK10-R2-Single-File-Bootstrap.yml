          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne "1a44c94ab03b9fade5ab1a0f4659e8e186fe88d3c3bbeab9ec229ec21d1cd09a") { throw "Embedded SDK 10 R2 payload checksum mismatch: $got" }
