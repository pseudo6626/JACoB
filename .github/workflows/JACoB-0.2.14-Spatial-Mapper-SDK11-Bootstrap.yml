      - name: Format Go sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gofmt -w internal/vision/tracker.go internal/vision/tracker_test.go internal/spatial/mapper.go internal/spatial/mapper_test.go internal/core/server.go internal/buildinfo/version.go

      - name: Validate source anchors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = Get-Content internal/buildinfo/version.go -Raw
          if ($version -notmatch '0\.2\.14-alpha') { throw '0.2.14 version bump missing' }
          if ($version -notmatch 'SDK11') { throw 'SDK11 display bump missing' }
          $server = Get-Content internal/core/server.go -Raw
          if ($server -notmatch '"apiVersion": 11') { throw 'core API version 11 missing' }
          if ($server -notmatch 'case "spatial\.update"') { throw 'spatial RPC surface missing' }
          $app = Get-Content internal/webui/assets/app.js -Raw
          if ($app -notmatch 'api:Object\.freeze\(\{version:11\}\)') { throw 'tab SDK version 11 missing' }
          if ($app -notmatch 'spatial:Object\.freeze') { throw 'Elite.spatial SDK object missing' }

      - name: Check web SDK syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check internal/webui/assets/app.js

      - name: Run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...

      - name: Build Windows binaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-windows.ps1

      - name: Check patch cleanliness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git status --short

      - name: Upload validation binaries
        uses: actions/upload-artifact@v6
        with:
          name: JACoB-0.2.14-spatial-sdk11-windows
          path: |
            dist/JACoB.exe
            dist/JACoB-no-capture.exe
          if-no-files-found: error

      - name: Commit validated Spatial Mapper patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/vision/tracker.go internal/vision/tracker_test.go internal/spatial/mapper.go internal/spatial/mapper_test.go internal/core/server.go internal/buildinfo/version.go internal/webui/assets/app.js examples/spatial-sdk11-diagnostics.html RELEASE-NOTES-0.2.14-alpha.md
          if (git diff --cached --quiet) {
            Write-Host 'No changes to commit.'
            exit 0
          }
          git commit -m 'JACoB 0.2.14-alpha Spatial Mapper SDK11'
          git push origin HEAD:$env:GITHUB_REF_NAME
