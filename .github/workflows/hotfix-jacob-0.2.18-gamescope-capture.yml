          text = path.read_text(encoding="utf-8")

          old = 'func newCaptureDriver() CaptureDriver { return &linuxCapture{} }'
          new = 'func newCaptureDriver() CaptureDriver { return newLinuxCaptureDriver() }'

          if old not in text:
              if new in text:
                  print("Linux capture mux already installed.")
              else:
                  raise SystemExit("newCaptureDriver source anchor not found")
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          gofmt -w \
            internal/platform/capture_linux_x11.go \
            internal/platform/capture_linux_gamescope.go

      - name: Validate privacy and Gamescope contract
        run: |
          set -euo pipefail
          git diff --check

          grep -Fq 'linux-gamescope-base-plane-v1' internal/platform/capture_linux_gamescope.go
          grep -Fq '"take_screenshot", "3suu"' internal/platform/capture_linux_gamescope.go
          grep -Fq 'type 1 = base_plane_only' internal/platform/capture_linux_gamescope.go
          grep -Fq 'linuxGamescopeEliteDirectlyFocused' internal/platform/capture_linux_gamescope.go
          grep -Fq 'focus changed during Gamescope capture' internal/platform/capture_linux_gamescope.go
          grep -Fq 'idle/saver UI' internal/platform/capture_linux_gamescope.go
          grep -Fq 'temporaryFilesOnly' internal/platform/capture_linux_gamescope.go
          grep -Fq 'os.Remove(path)' internal/platform/capture_linux_gamescope.go
          grep -Fq 'libwayland-client.so.0' internal/platform/capture_linux_gamescope.go
          grep -Fq 'return newLinuxCaptureDriver()' internal/platform/capture_linux_x11.go

          # Production capture must use the protocol directly, not shell out to
          # gamescopectl or generic desktop screenshot utilities.
          ! grep -Fq 'exec.Command' internal/platform/capture_linux_gamescope.go
          ! grep -Fq 'gamescopectl screenshot' internal/platform/capture_linux_gamescope.go
          ! grep -Fq 'grim ' internal/platform/capture_linux_gamescope.go
          ! grep -Fq 'gnome-screenshot' internal/platform/capture_linux_gamescope.go

      - name: Test Linux platform and Vision
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision ./internal/spatial
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-gamescope-regression.exe ./cmd/jacob
          go build -trimpath -o /tmp/JACoB-Setup-gamescope-regression.exe ./cmd/installer

      - name: Build and inspect Deck core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/JACoB-0.2.18-gamescope-capture ./cmd/jacob

          ldd /tmp/JACoB-0.2.18-gamescope-capture | tee /tmp/jacob-gamescope-ldd.txt
          ! grep -q 'not found' /tmp/jacob-gamescope-ldd.txt

          strings /tmp/JACoB-0.2.18-gamescope-capture | grep -Fq 'linux-gamescope-base-plane-v1'
          strings /tmp/JACoB-0.2.18-gamescope-capture | grep -Fq 'libwayland-client.so.0'
          strings /tmp/JACoB-0.2.18-gamescope-capture | grep -Fq 'gamescope_control'
          strings /tmp/JACoB-0.2.18-gamescope-capture | grep -Fq 'base_plane_only'

      - name: Commit tested Gamescope capture backend
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            internal/platform/capture_linux_gamescope.go \
            internal/platform/capture_linux_x11.go

          if git diff --cached --quiet; then
            echo "Gamescope capture backend already present."
          else
            git commit -m "Use Gamescope base-plane capture on Steam Deck"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Build replacement Steam Deck Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          v='0.2.18-alpha'
          mkdir -p dist

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'

          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf \
            packaging/flatpak/tesseract-appdir \
            packaging/flatpak/squashfs-root

          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )

          packaging/flatpak/tesseract-appdir/AppRun --version
          packaging/flatpak/tesseract-appdir/AppRun --list-langs | grep -Fxq eng

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          rm -rf flatpak-build flatpak-repo

          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            "dist/JACoB-$v-SteamDeck.flatpak" \
            com.pseudosci.JACoB stable

          sha256sum \
            "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-GAMESCOPE-CAPTURE-SHA256.txt

          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-GAMESCOPE-CAPTURE-SHA256.txt" \
              --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-GAMESCOPE-CAPTURE-SHA256.txt" \
              --target "$(git rev-parse HEAD)" \
              --draft \
              --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck Gamescope base-plane capture test build."
          fi

          echo "Replacement Steam Deck asset uploaded to draft release $tag"
