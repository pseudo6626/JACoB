name: Prepare JACoB 0.2.12 SDK 10 candidate

on:
  workflow_dispatch:
    inputs:
      commit_candidate:
        description: Commit the validated SDK 10 source changes back to this branch
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sdk10:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply SDK 10 source update
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = ""
          $zip = Join-Path $env:RUNNER_TEMP "jacob-sdk10-bundle.zip"
          $dir = Join-Path $env:RUNNER_TEMP "jacob-sdk10-bundle"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          python (Join-Path $dir "apply-sdk10.py")

      - name: Format and validate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          gofmt -w internal/vision internal/platform/capture_windows.go internal/platform/capture_windows_disabled.go internal/platform/window_geometry_windows.go internal/core/server.go internal/buildinfo/version.go cmd/installer/main.go
          go test ./...
          go test -tags "norecorder,nocapture" ./...
          node --check internal/webui/assets/app.js
          python -m json.tool docs/schemas/vision-inspect-request.schema.json > $null

      - name: Build candidate artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = "0.2.12-alpha"
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"
          $env:GOOS="linux"
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          $env:GOOS="windows"
          go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob
          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try {
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue
          }

      - name: Package source update and checksums
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = "0.2.12-alpha"
          git add -N .
          git diff --binary --output="dist/JACoB-$v-SDK10-source.patch"
          $changed = @(git diff --name-only)
          $stage = Join-Path $env:RUNNER_TEMP "jacob-sdk10-source"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($f in $changed) {
            if (-not (Test-Path $f -PathType Leaf)) { continue }
            $dest = Join-Path $stage $f
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item $f $dest
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/JACoB-$v-SDK10-source-update.zip" -Force
          Copy-Item "RELEASE-NOTES-$v.md" "dist/RELEASE-NOTES-$v.md"
          $hashFiles = Get-ChildItem dist -File | Where-Object { $_.Name -notlike '*.sha256' }
          $lines = foreach ($f in $hashFiles) {
            $h=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File "dist/SHA256SUMS.txt" -Encoding ascii
          git status --short | Out-File "dist/SOURCE-STATUS.txt" -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: JACoB-0.2.12-alpha-SDK10-candidate
          if-no-files-found: error
          path: |
            dist/JACoB-0.2.12-alpha-win-x64.exe
            dist/JACoB-0.2.12-alpha-win-x64-portable.exe
            dist/JACoB-0.2.12-alpha-win-x64-no-capture.exe
            dist/JACoB-0.2.12-alpha-linux-amd64
            dist/JACoB-0.2.12-alpha-SDK10-source.patch
            dist/JACoB-0.2.12-alpha-SDK10-source-update.zip
            dist/RELEASE-NOTES-0.2.12-alpha.md
            dist/SHA256SUMS.txt
            dist/SOURCE-STATUS.txt

      - name: Commit validated candidate
        if: ${{ inputs.commit_candidate }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/sdk10-bootstrap.yml
          git add -A
          git commit -m "JACoB 0.2.12-alpha SDK 10 Vision and No Capture"
          git push origin "HEAD:${{ github.ref_name }}"
