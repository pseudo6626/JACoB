name: Apply JACoB 0.2.19 SDK15 clipboard + quick pair v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sdk15-clipboard-quickpair-apply-v4.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Materialize reviewed patch
        shell: bash
        env:
          CLIPBOARD_PATCH_B64: 
          QUICKPAIR_GO_B64: 
          QUICKPAIR_TEST_B64: 
          MODIFIER_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import base64, os, pathlib
          pathlib.Path('/tmp/native-clipboard.patch').write_bytes(base64.b64decode(os.environ['CLIPBOARD_PATCH_B64']))
          pathlib.Path('/tmp/quickpair.go').write_bytes(base64.b64decode(os.environ['QUICKPAIR_GO_B64']))
          pathlib.Path('/tmp/quickpair_test.go').write_bytes(base64.b64decode(os.environ['QUICKPAIR_TEST_B64']))
          pathlib.Path('/tmp/apply_sdk15.py').write_bytes(base64.b64decode(os.environ['MODIFIER_B64']))
          PY2
      - name: Apply SDK 15 source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/native-clipboard.patch
          git apply /tmp/native-clipboard.patch
          python3 /tmp/apply_sdk15.py
          gofmt -w internal/clipboard/*.go internal/core/clipboard.go internal/core/clipboard_test.go internal/core/quickpair.go internal/core/quickpair_test.go internal/core/server.go internal/core/platform_info.go cmd/installer/main.go internal/buildinfo/version.go
          go mod tidy
      - name: Validate Go and cross-build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test ./...
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/jacob-clipboard-win.test.exe ./internal/clipboard
          GOOS=windows GOARCH=amd64 go build -o /tmp/JACoB-win-x64.exe ./cmd/jacob
          GOOS=linux GOARCH=amd64 go build -o /tmp/JACoB-linux-amd64 ./cmd/jacob
      - name: Validate browser SDK
        shell: bash
        run: |
          set -euo pipefail
          node --check internal/webui/assets/app.js
          node --test internal/webui/clipboard.test.cjs
      - name: Validate patch cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'Version    = "0.2.19-alpha"' internal/buildinfo/version.go
          grep -Fq 'version:15' internal/webui/assets/app.js
          grep -Fq 'clipboard:Object.freeze' internal/webui/assets/app.js
          grep -Fq 'mux.HandleFunc("/q/", s.handleQuickPair)' internal/core/server.go
          grep -Fq 'SCAN TO PAIR JACoB' internal/core/quickpair.go
          grep -Fq 'quickPairReadyTimeout = 2 * time.Minute' internal/core/quickpair.go
      - name: Commit tested update
        shell: bash
        run: |
          set -euo pipefail
          # The default GITHUB_TOKEN can update repository contents but cannot
          # modify workflow files. Keep .github/workflows byte-for-byte unchanged.
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'Add SDK 15 native clipboard and one-scan startup pairing'
          git push origin HEAD:main
