      - name: Format Go sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $goFiles = @(
            'internal/core/server.go',
            'internal/buildinfo/version.go',
            'internal/vision/tracker.go',
            'internal/vision/tracker_test.go'
          )
          foreach ($dir in @('internal/spatial','internal/galaxy','internal/catalog','internal/webfetch','internal/tabstate')) {
            if (Test-Path $dir) {
              $goFiles += @(Get-ChildItem $dir -Filter '*.go' | ForEach-Object { $_.FullName })
            }
          }
          & gofmt -w $goFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete SDK11 surface
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = Get-Content internal/buildinfo/version.go -Raw
          if ($version -notmatch '0\.2\.14-alpha') { throw '0.2.14 version missing' }
          if ($version -notmatch 'SDK11') { throw 'SDK11 display version missing' }
          foreach ($path in @(
            'internal/spatial/mapper.go',
            'internal/galaxy/galaxy.go',
            'internal/catalog/catalog.go',
            'internal/webfetch/scheduler.go',
            'internal/tabstate/atomic.go'
          )) { if (-not (Test-Path $path)) { throw "SDK11 file missing: $path" } }
          $server = Get-Content internal/core/server.go -Raw
          foreach ($needle in @(
            '"apiVersion": 11',
            'case "spatial.update"',
            'case "galaxy.decodeAddress"',
            'case "galaxy.boxelHierarchy"',
            'case "catalog.system.get"',
            'case "net.fetchQueued"',
            'case "net.fetchBatch"',
            'case "tabstate.cas"',
            'case "tabstate.batch"'
          )) { if ($server -notmatch [regex]::Escape($needle)) { throw "Core SDK11 surface missing: $needle" } }
          $app = Get-Content internal/webui/assets/app.js -Raw
          foreach ($pattern in @(
            'api:Object\.freeze\(\{version:11\}\)',
            'spatial:Object\.freeze',
            'galaxy:Object\.freeze',
            'catalog:Object\.freeze',
            'fetchQueued',
            'fetchBatch',
            'update:async',
            'batch:operations=>',
            'video:Object\.freeze'
          )) { if ($app -notmatch $pattern) { throw "Tab SDK11 surface missing: $pattern" } }
          if ($app -notmatch 'close:') { throw 'Elite.video.close missing' }

      - name: Check web SDK syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check internal/webui/assets/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full test suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows validation binaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch cleanliness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --short

      - name: Upload complete SDK11 validation binaries
        uses: actions/upload-artifact@v6
        with:
          name: JACoB-0.2.14-complete-sdk11-windows
          path: |
            dist/JACoB.exe
            dist/JACoB-no-capture.exe
          if-no-files-found: error

      - name: Commit validated complete SDK11 update
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/vision internal/spatial internal/galaxy internal/catalog internal/webfetch internal/tabstate internal/core/server.go internal/buildinfo/version.go internal/webui/assets/app.js examples docs/SDK11-UTILITY-ADDITIONS.md cmd/installer/payload/Documentation/SDK11-Utility-Additions.md cmd/installer/payload/SDK11-Utility-Diagnostics.html RELEASE-NOTES-0.2.14-alpha.md
          if (git diff --cached --quiet) {
            Write-Host 'Complete SDK11 state already present; nothing to commit.'
            exit 0
          }
          git commit -m 'JACoB 0.2.14-alpha complete SDK11 update'
          git push origin HEAD:$env:GITHUB_REF_NAME
