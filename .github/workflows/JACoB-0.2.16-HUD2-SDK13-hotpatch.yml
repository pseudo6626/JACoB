name: JACoB 0.2.16 HUD2 SDK13 Hotpatch

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit the validated SDK13 source changes back to this branch
        required: true
        type: boolean
        default: true
      create_draft_release:
        description: Create or update draft v0.2.16-alpha with the built assets
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  hud2:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply version-guarded HUD2 payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess, sys
          BASELINE = {
              'internal/platform/overlay.go': 'dcfcbc4c9b0a41c22c9547fbf4e682de70b6a18b',
              'internal/platform/overlay_windows.go': 'c97d4d16a19ba835127831f1f81b4b3402d5fec9',
              'internal/webui/assets/app.js': '8b2369c5b79fc5eb9637d72657b92136b1875772',
              'internal/buildinfo/version.go': '55bf9c8b8fff49cce21f76d9c753bd6bb819a4be',
          }
          PAYLOAD = {
              'internal/platform/overlay.go': ('', '86dc1e5d968f4e6eff78e48d7199dfc1e0eb13c2643e48d2ee145743a5f74a14'),
              'internal/platform/overlay_windows.go': ('', 'bc98c0f1bccdf9821392c828cd3cba8b98b51b7db9dddce8a2ca9fd97af2bcf5'),
              'internal/platform/overlay_test.go': ('', '62620a73f2207a6f54fb32a40fe77320a8eb7348c8119ba34dca3318550b61b7'),
              'internal/buildinfo/version.go': ('', '0f0e46d3ba5deea5a2265bf074a41c8b69dd8bfd09c62416128f35a0857ddf23'),
              'examples/hud-studio-tab.html': ('', 'be747937b91e7deedb9ffcd15d4015ea26d5381dd4915756ac792cd998cc5d45'),
              'cmd/installer/payload/HUD-Studio.html': ('', 'be747937b91e7deedb9ffcd15d4015ea26d5381dd4915756ac792cd998cc5d45'),
              'docs/HUD2-SDK13.md': ('', '887d282358d4443fff01379f8bdfcba18d60081f44310f8efb2d8b55f4885ae0'),
              'cmd/installer/payload/Documentation/JACoB-HUD2-SDK13.md': ('', '887d282358d4443fff01379f8bdfcba18d60081f44310f8efb2d8b55f4885ae0'),
              'RELEASE-NOTES-0.2.16-alpha.md': ('', 'ccb3b1805cde9d761dff7ad458eed251d4c6129bde82b67f46a4bce942ff28bc'),
          }
          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()
          def write_payload():
              for rel,(encoded,want) in PAYLOAD.items():
                  raw=base64.b64decode(encoded)
                  got=hashlib.sha256(raw).hexdigest()
                  if got != want:
                      raise SystemExit(f'payload checksum mismatch for {rel}: {got} != {want}')
                  p=Path(rel); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(raw)
          version=Path('internal/buildinfo/version.go').read_text(encoding='utf-8')
          app=Path('internal/webui/assets/app.js').read_text(encoding='utf-8')
          already=('Version    = "0.2.16-alpha"' in version and 'api:Object.freeze({version:13})' in app and Path('internal/platform/overlay.go').exists() and 'const HUDVersion = 2' in Path('internal/platform/overlay.go').read_text(encoding='utf-8'))
          if already:
              print('HUD2 / SDK13 already present; leaving source unchanged and continuing validation/build.')
              raise SystemExit(0)
          if 'Version    = "0.2.15-alpha"' not in version:
              raise SystemExit('Refusing to patch: expected JACoB 0.2.15-alpha or an already-applied 0.2.16-alpha tree.')
          for path,want in BASELINE.items():
              got=blob(path)
              if got != want:
                  raise SystemExit(f'Refusing to patch {path}: baseline blob {got} does not match reviewed {want}. Rebase the hotpatch against current main.')
          write_payload()
          app_path=Path('internal/webui/assets/app.js')
          app=app_path.read_text(encoding='utf-8')
          needle='window.Elite=Object.freeze({'
          if app.count(needle) != 1:
              raise SystemExit(f'Expected exactly one Elite SDK declaration, found {app.count(needle)}')
          helper="\nconst hud=Object.freeze({\n scene:(items=[],options={})=>Object.assign({theme:'cockpit',space:'normalized'},cloneSDKValue(options),{items:Array.isArray(items)?cloneSDKValue(items):[]}),\n text:(text,x,y,options={})=>Object.assign({},cloneSDKValue(options),{type:'text',x:Number(x),y:Number(y),text:String(text??'')}),\n metric:(x,y,value,options={})=>Object.assign({},cloneSDKValue(options),{type:'metric',x:Number(x),y:Number(y),value:String(value??'')}),\n panel:(x,y,w,h,options={})=>Object.assign({},cloneSDKValue(options),{type:'panel',x:Number(x),y:Number(y),w:Number(w),h:Number(h)}),\n progress:(x,y,w,h,progress,options={})=>Object.assign({},cloneSDKValue(options),{type:'progress',x:Number(x),y:Number(y),w:Number(w),h:Number(h),progress:Number(progress)}),\n reticle:(x,y,options={})=>Object.assign({},cloneSDKValue(options),{type:'reticle',x:Number(x),y:Number(y)}),\n bracket:(x,y,w,h,options={})=>Object.assign({},cloneSDKValue(options),{type:'bracket',x:Number(x),y:Number(y),w:Number(w),h:Number(h)}),\n chevron:(x,y,options={})=>Object.assign({},cloneSDKValue(options),{type:'chevron',x:Number(x),y:Number(y)}),\n arc:(x,y,r,startAngle,sweepAngle,options={})=>Object.assign({},cloneSDKValue(options),{type:'arc',x:Number(x),y:Number(y),r:Number(r),startAngle:Number(startAngle),sweepAngle:Number(sweepAngle)}),\n ring:(x,y,r,options={})=>Object.assign({},cloneSDKValue(options),{type:'ring',x:Number(x),y:Number(y),r:Number(r)})\n});\n"
          app=app.replace(needle, helper+needle, 1)
          old_version='api:Object.freeze({version:12})'
          if app.count(old_version) != 1:
              raise SystemExit(f'Expected exactly one SDK12 version marker, found {app.count(old_version)}')
          app=app.replace(old_version,'api:Object.freeze({version:13})',1)
          old_overlay="overlay:Object.freeze({info:()=>request('overlay.info'),set:scene=>request('overlay.set',{scene}),clear:()=>request('overlay.clear')}),"
          new_overlay="overlay:Object.freeze({info:()=>request('overlay.info'),set:scene=>request('overlay.set',{scene}),clear:()=>request('overlay.clear'),hud}),"
          if app.count(old_overlay) != 1:
              raise SystemExit(f'Expected exactly one overlay SDK object, found {app.count(old_overlay)}')
          app=app.replace(old_overlay,new_overlay,1)
          app_path.write_text(app.rstrip()+'\n', encoding='utf-8', newline='\n')
          print('Applied JACoB HUD2 / SDK13 source payload.')
          PY

      - name: Format touched Go files
        shell: pwsh
        run: |
          $goFiles = @(
            "internal/platform/overlay.go",
            "internal/platform/overlay_windows.go",
            "internal/platform/overlay_test.go",
            "internal/buildinfo/version.go"
          )
          & gofmt -w $goFiles
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed" }

      - name: Validate browser SDK and HUD Studio JavaScript
        shell: pwsh
        run: |
          & node --check internal/webui/assets/app.js
          if ($LASTEXITCODE -ne 0) { throw "app.js syntax validation failed" }

          @'
          from pathlib import Path
          import re
          html=Path('examples/hud-studio-tab.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          if not m:
              raise SystemExit('HUD Studio script block not found')
          Path('hud-studio-check.js').write_text(m.group(1),encoding='utf-8',newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "HUD Studio extraction failed" }
          & node --check hud-studio-check.js
          if ($LASTEXITCODE -ne 0) { throw "HUD Studio syntax validation failed" }
          Remove-Item hud-studio-check.js -Force

      - name: Verify source cleanliness
        shell: pwsh
        run: |
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          $workflowDiff = @(git diff --name-only -- .github/workflows)
          if ($workflowDiff.Count -gt 0) { throw "Hotpatch must not modify workflow files: $($workflowDiff -join ', ')" }

      - name: Vet and test
        shell: pwsh
        run: |
          & go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
          & go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "go test failed" }

      - name: Build release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "0.2.16-alpha"
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"

          $env:GOOS = "windows"
          & go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw "portable Windows build failed" }
          & go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw "no-capture Windows build failed" }

          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try {
            & go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
            if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue
          }

          $env:GOOS = "linux"
          & go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw "Linux no-CGO build failed" }

          $sourceFiles = @(
            "internal/platform/overlay.go",
            "internal/platform/overlay_windows.go",
            "internal/platform/overlay_test.go",
            "internal/buildinfo/version.go",
            "internal/webui/assets/app.js",
            "examples/hud-studio-tab.html",
            "docs/HUD2-SDK13.md",
            "cmd/installer/payload/HUD-Studio.html",
            "cmd/installer/payload/Documentation/JACoB-HUD2-SDK13.md",
            "RELEASE-NOTES-0.2.16-alpha.md"
          )
          Compress-Archive -Path $sourceFiles -DestinationPath "dist/JACoB-$v-HUD2-SDK13-source.zip" -Force

          $files = @(
            "dist/JACoB-$v-win-x64.exe",
            "dist/JACoB-$v-win-x64-portable.exe",
            "dist/JACoB-$v-win-x64-no-capture.exe",
            "dist/JACoB-$v-linux-amd64",
            "dist/JACoB-$v-HUD2-SDK13-source.zip"
          )
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $sumLines | Out-File "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JACoB-0.2.16-alpha-HUD2-SDK13
          path: |
            dist/JACoB-0.2.16-alpha-win-x64.exe
            dist/JACoB-0.2.16-alpha-win-x64-portable.exe
            dist/JACoB-0.2.16-alpha-win-x64-no-capture.exe
            dist/JACoB-0.2.16-alpha-linux-amd64
            dist/JACoB-0.2.16-alpha-HUD2-SDK13-source.zip
            dist/SHA256SUMS.txt
            RELEASE-NOTES-0.2.16-alpha.md

      - name: Commit validated source changes
        if: ${{ inputs.commit_changes }}
        shell: pwsh
        run: |
          $workflowDiff = @(git diff --name-only -- .github/workflows)
          if ($workflowDiff.Count -gt 0) { throw "Refusing to commit workflow changes" }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            internal/platform/overlay.go `
            internal/platform/overlay_windows.go `
            internal/platform/overlay_test.go `
            internal/buildinfo/version.go `
            internal/webui/assets/app.js `
            examples/hud-studio-tab.html `
            docs/HUD2-SDK13.md `
            cmd/installer/payload/HUD-Studio.html `
            cmd/installer/payload/Documentation/JACoB-HUD2-SDK13.md `
            RELEASE-NOTES-0.2.16-alpha.md

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "staged diff check failed" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No source changes to commit."
          } else {
            git commit -m "HUD2 renderer and SDK13"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            git push origin "HEAD:${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          }

      - name: Create or update draft release
        if: ${{ inputs.create_draft_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "0.2.16-alpha"
          $tag = "v$v"
          $target = (git rev-parse HEAD).Trim()
          $assets = @(
            "dist/JACoB-$v-win-x64.exe",
            "dist/JACoB-$v-win-x64-portable.exe",
            "dist/JACoB-$v-win-x64-no-capture.exe",
            "dist/JACoB-$v-linux-amd64",
            "dist/JACoB-$v-HUD2-SDK13-source.zip",
            "dist/SHA256SUMS.txt"
          )
          $releaseTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases" }
          $exists = $releaseTags -contains $tag
          if ($exists) {
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to existing release $tag" }
            & gh release edit $tag --draft --prerelease --title "JACoB $v — HUD2 / SDK13" --notes-file "RELEASE-NOTES-$v.md" --target $target
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release $tag" }
          } else {
            & gh release create $tag @assets --target $target --draft --prerelease --title "JACoB $v — HUD2 / SDK13" --notes-file "RELEASE-NOTES-$v.md"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }
