name: JACoB 0.2.15 Reviewed Hotpatch

on:
  push:
    paths:
      - .github/workflows/JACoB-0.2.15-Reviewed-Hotpatch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify exact 0.2.14 SDK11 baseline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'internal/buildinfo/version.go' = 'b358a84b938e2ad751445d2a97e0b247b18c2498'
            'cmd/jacob/main.go' = 'ea773f7741128c53a1f82434113ddff6c0f8f544'
            'internal/journal/detect.go' = '003dbfec97d833d8b959d2f508503c67e621a68a'
            'internal/bindings/bindings.go' = 'e3811f3841d7ecb3670639dc54461bf573e325be'
            'internal/core/server.go' = '4e8d6dc40ca775fbfd712f9e75e88b228999f807'
            'internal/platform/text_windows.go' = '271d68910f431454196ed2a7e2e0e8eaac38ea7a'
            'internal/platform/wgc_capture_windows.go' = 'f2e87f0c4bb90cebbfd442da0f21c28930611f64'
            'internal/webui/assets/app.js' = '1dd29b51910522a281c664fec6c2ddcf3819654f'
            'internal/webui/assets/index.html' = 'b7b73681cb3745fef6b40e2d5883b744f3de0cdb'
            '.github/workflows/build-windows-release.yml' = '8e51c35744f7b24e66b30c19c3db8fae7938913c'
            'cmd/installer/main.go' = '68ee453d7e2a4d2522693b1ec5f79384347524a3'
            'internal/networkdiag/networkdiag_windows.go' = 'f59ff6c80c44bb2a9d57e24d950eae1cb46c86e4'
            'internal/updater/updater.go' = '3eb0876ea77f1d6ff3df068b70dc2cb545bc0533'
            'internal/platform/input_windows.go' = 'dd67e11f54322875c4a5036f7bdbdd1c082dedc8'
            'internal/platform/recorder_windows.go' = '2a70d5c1a635cae1c509e0e7e533ef0cbd46f23f'
          }
          foreach ($item in $expected.GetEnumerator()) {
            if (-not (Test-Path $item.Key)) { throw "Baseline file missing: $($item.Key)" }
            $got = (git hash-object -- $item.Key).Trim()
            if ($got -ne $item.Value) {
              throw "Baseline drift in $($item.Key): expected $($item.Value), got $got. Hotpatch intentionally refused to apply."
            }
          }
          if (Test-Path internal/pathconfig) { throw 'internal/pathconfig already exists; refusing a second application' }
          if (Test-Path internal/deviceauth) { throw 'internal/deviceauth already exists; refusing a second application' }
          if (Test-Path internal/macros) { throw 'internal/macros already exists; refusing a second application' }
          $version = Get-Content internal/buildinfo/version.go -Raw
          if ($version -notmatch 'Version\s*=\s*"0\.2\.14-alpha"' -or $version -notmatch 'SDK11') {
            throw 'Expected JACoB 0.2.14-alpha / SDK11 baseline.'
          }
          git merge-base --is-ancestor dcaab9e9044c75ca8b668f06de0220d7a61554a4 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Current branch is not descended from the pinned 0.2.14 SDK11 distribution commit.' }
          $sourceDrift = @(git diff --name-only dcaab9e9044c75ca8b668f06de0220d7a61554a4 HEAD | Where-Object { $_ -and -not $_.StartsWith('.github/workflows/') })
          if ($sourceDrift.Count -gt 0) { throw ('Source tree has non-workflow changes beyond the reviewed 0.2.14 distro: ' + ($sourceDrift -join ', ')) }
          Write-Host 'Pinned 0.2.14-alpha / SDK11 source hashes confirmed; workflow-only housekeeping is allowed.'

