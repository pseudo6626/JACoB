      - name: Format Go
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $goFiles = @(
            'cmd/jacob/main.go',
            'internal/buildinfo/version.go',
            'internal/journal/detect.go',
            'internal/bindings/bindings.go',
            'internal/core/server.go',
            'internal/deviceauth/store.go',
            'internal/deviceauth/store_test.go',
            'internal/macros/store.go',
            'internal/macros/store_test.go',
            'internal/pathconfig/pathconfig.go',
            'internal/pathconfig/pathconfig_test.go',
            'internal/platform/text_windows.go',
            'internal/platform/text_windows_test.go',
            'internal/platform/wgc_capture_windows.go',
            'internal/journal/detect_override_test.go',
            'internal/bindings/detect_override_test.go',
            'internal/networkdiag/networkdiag_windows.go',
            'internal/networkdiag/networkdiag_windows_test.go',
            'cmd/installer/main.go'
          )
          gofmt -w $goFiles
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }

      - name: Test Go
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }

      - name: Validate browser JavaScript
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check internal/webui/assets/app.js
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax check failed' }
          $html = Get-Content internal/webui/assets/diagnostics-tab.html -Raw
          $m = [regex]::Match($html, '(?s)<script>(.*)</script>')
          if (-not $m.Success) { throw 'Diagnostics tab script block missing' }
          $diagJS = Join-Path $env:RUNNER_TEMP 'jacob-diagnostics-tab.js'
          Set-Content -Path $diagJS -Value $m.Groups[1].Value -Encoding utf8
          node --check $diagJS
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics tab JavaScript syntax check failed' }

      - name: Verify hotpatch invariants
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = Get-Content internal/buildinfo/version.go -Raw
          $app = Get-Content internal/webui/assets/app.js -Raw
          $index = Get-Content internal/webui/assets/index.html -Raw
          $wgc = Get-Content internal/platform/wgc_capture_windows.go -Raw
          if ($version -notmatch '0\.2\.15-alpha' -or $version -notmatch 'SDK12') { throw 'version/SDK invariant failed' }
          if ($app -notmatch 'paths\.get' -or $app -notmatch 'installDiagnosticsTab' -or $app -notmatch 'api:Object\.freeze\(\{version:12\}\)' -or $app -notmatch 'macros:Object\.freeze') { throw 'SDK12/UI invariant failed' }
          if ($index -notmatch 'Elite data paths' -or $index -notmatch 'SETUP WALK-THROUGH' -or $index -notmatch 'Elite macros' -or $index -notmatch 'SDK 12' -or $index -match '0\.2\.13 · SDK 10') { throw 'Tutorial/path/macro/footer invariant failed' }
          if ($wgc -notmatch 'idle\.Reset\(2 \* time\.Second\)' -or $wgc -notmatch 'closeSource\("idle-timeout"\)' -or $wgc -notmatch 'capture/wgc: session ready') { throw 'WGC idle-release/logging fix missing' }
          if (-not (Test-Path internal/webui/assets/diagnostics-tab.html)) { throw 'Diagnostics tab missing' }
          if (-not (Test-Path RELEASE-NOTES-0.2.15-alpha.md)) { throw 'Release notes missing' }
          $installer = Get-Content cmd/installer/main.go -Raw
          $netdiag = Get-Content internal/networkdiag/networkdiag_windows.go -Raw
          $paths = Get-Content internal/pathconfig/pathconfig.go -Raw
          $diag = Get-Content internal/webui/assets/diagnostics-tab.html -Raw
          $server = Get-Content internal/core/server.go -Raw
          $deviceAuth = Get-Content internal/deviceauth/store.go -Raw
          $macros = Get-Content internal/macros/store.go -Raw
          if (-not (Test-Path internal/macros/store_test.go)) { throw 'Macro regression tests missing' }
          if (-not (Test-Path docs/SDK12_MACROS.md)) { throw 'SDK12 macro documentation missing' }
          if (-not (Test-Path internal/deviceauth/store_test.go)) { throw 'Device-auth regression tests missing' }
          if ($server -notmatch '/api/pair' -or $server -notmatch 'case "devices\.setAdmin"' -or $server -notmatch 'requirePhysicalHost' -or $server -notmatch 'SameSiteStrictMode') { throw 'Connected-device trust core missing' }
          if ($server -match 'r\.URL\.Query\(\)\.Get\("token"\)' -or $server -match 'LAN pairing token:') { throw 'Legacy shared-token authentication or secret logging remains' }
          if ($server -notmatch '(?s)case "devices\.setAdmin":.*?requirePhysicalHost' -or $server -notmatch '(?s)case "devices\.setRemember":.*?requirePhysicalHost' -or $server -notmatch '(?s)case "devices\.revoke":.*?requirePhysicalHost') { throw 'Device trust mutation is not physical-host-only' }
          if ($server -notmatch '(?s)case "core\.shutdown":.*?clientPrivileged' -or $server -notmatch '(?s)case "update\.install":.*?clientPrivileged') { throw 'Remote Admin host-action bridge incomplete' }
          if ($deviceAuth -notmatch 'sha256\.Sum256' -or $deviceAuth -notmatch 'subtle\.ConstantTimeCompare' -or $deviceAuth -notmatch 'SecretHash') { throw 'Per-device credential hashing invariant failed' }
          if ($server -notmatch 'case "macros\.run"' -or $server -notmatch 'case "macros\.save"' -or $server -notmatch 'case "macros\.policy\.accept"' -or $server -notmatch 'MACRO_POLICY_REQUIRED' -or $server -notmatch '"apiVersion": 12' -or $server -notmatch 'runMacro') { throw 'SDK12 macro core/policy gate missing' }
          if ($macros -notmatch 'ID: "plot_route"' -or $macros -notmatch 'ID: "exit_menus"' -or $macros -notmatch 'ID: "open_quick_comms"' -or $macros -notmatch 'ID: "open_codex_discovery"' -or $macros -notmatch 'Key: "SC:01"' -or $macros -notmatch 'ExpandText' -or $macros -notmatch 'maxCustomSteps\s*=\s*12' -or $macros -notmatch 'policyVersion\s*=\s*1' -or $macros -notmatch 'validateBuiltInStep') { throw 'Responsible-use macro store missing' }
          if ($macros -match 'ID: "toggle_analysis_mode"' -or $macros -match 'ID: "enter_fss"' -or $macros -match 'ID: "leave_fss"' -or $macros -match 'PlayerHUDModeToggle' -or $macros -match 'ExplorationFSS') { throw 'Gameplay-state macros must not ship as built-ins' }
          if ($server -notmatch 'platform\.ValidateSafeChord' -or $server -notmatch 'macroRunning' -or $server -notmatch '90\*time\.Second') { throw 'Macro execution safety invariant failed' }
          if ($app -notmatch 'recordedMacroSteps' -or $app -notmatch 'toggleMacroRecording' -or $app -notmatch 'macros\.run' -or $app -notmatch 'macros\.list' -or $app -notmatch 'macroPolicyAccepted') { throw 'Macro recorder, policy UI logic, or sandbox bridge missing' }
          if ($index -notmatch 'Macro use agreement' -or $index -notmatch 'Frontier Code of Conduct' -or $index -notmatch 'limited to 12 steps') { throw 'Macro responsible-use agreement UI missing' }
          if ($app -notmatch 'Connected devices' -and $index -notmatch 'Connected devices') { throw 'Connected Device Manager UI missing' }
          if ($app -match '\?token=\$\{encodeURIComponent\(token\(\)\)\}') { throw 'Browser still sends pairing credentials in WebSocket URL' }
          if ($installer -match 'networkdiag\.EnsureInteractive') { throw 'Installer/update still performs implicit firewall elevation' }
          if ($installer -notmatch 'CreationFlags: createNoWindow') { throw 'Installer child-process console suppression missing' }
          if ($installer -notmatch 'pre-update Windows network:' -or $installer -notmatch 'post-update listeners:' -or $installer -notmatch 'inspectTCPListeners' -or $installer -notmatch 'post-update Windows network:' -or $installer -notmatch 'automatic update leaves Windows firewall configuration unchanged') { throw 'Before/after LAN verification/diagnostic logging missing' }
          if ($installer -notmatch 'rotateUpdateLog' -or $installer -notmatch 'pid=%d') { throw 'Rotating PID-stamped update log missing' }
          $main = Get-Content cmd/jacob/main.go -Raw
          if ($main -notmatch 'rotateLog' -or $main -notmatch 'process/start:' -or $main -notmatch 'config/effective:') { throw 'Persistent core diagnostic logging missing' }
          if ($server -notmatch 'network/%s:' -or $server -notmatch 'video/stream-start:' -or $server -notmatch 'ws/connect:' -or $server -notmatch 'api/error:' -or $server -notmatch 'recorder/start:') { throw 'Core component diagnostic logging missing' }
          if ($netdiag -notmatch 'func hiddenCommand' -or $netdiag -notmatch 'CreationFlags: createNoWindow') { throw 'Network Doctor hidden-process fix missing' }
          if ($app -notmatch 'Normal JACoB updates do not require administrator access') { throw 'Informative firewall elevation prompt missing' }
          if ($paths -notmatch 'filepath\.IsAbs' -or $paths -notmatch 'runtime\.GOOS == "windows"') { throw 'Path safety/host semantics invariant failed' }
          if ($diag -match 'url:await Elite\.video\.attach') { throw 'Diagnostics tab must not export the scoped media URL' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Build release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = '0.2.15-alpha'
          $env:CGO_ENABLED = '0'
          $env:GOARCH = 'amd64'

          $env:GOOS = 'linux'
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw 'Linux build failed' }
          go build -trimpath -tags "norecorder,nocapture" -o "dist/JACoB-$v-linux-amd64-no-capture" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw 'Linux no-capture build failed' }

          $env:GOOS = 'windows'
          go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable build failed' }
          go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob
          if ($LASTEXITCODE -ne 0) { throw 'Windows no-capture build failed' }

          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try {
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue
          }

          $files = @(
            "dist/JACoB-$v-win-x64.exe",
            "dist/JACoB-$v-win-x64-portable.exe",
            "dist/JACoB-$v-win-x64-no-capture.exe",
            "dist/JACoB-$v-linux-amd64",
            "dist/JACoB-$v-linux-amd64-no-capture"
          )
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $sumLines | Out-File "dist/SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: JACoB-0.2.15-alpha
          path: |
            dist/JACoB-0.2.15-alpha-win-x64.exe
            dist/JACoB-0.2.15-alpha-win-x64-portable.exe
            dist/JACoB-0.2.15-alpha-win-x64-no-capture.exe
            dist/JACoB-0.2.15-alpha-linux-amd64
            dist/JACoB-0.2.15-alpha-linux-amd64-no-capture
            dist/SHA256SUMS.txt
            RELEASE-NOTES-0.2.15-alpha.md

      - name: Commit tested hotpatch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/JACoB-0.2.15-Reviewed-Hotpatch.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'Hotpatch produced no tracked changes' }
          git commit -m 'JACoB 0.2.15-alpha setup device trust capture and updater hotfix'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
          "PATCHED_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '0.2.15-alpha'
          $tag = "v$v"
          $assets = @(
            "dist/JACoB-$v-win-x64.exe",
            "dist/JACoB-$v-win-x64-portable.exe",
            "dist/JACoB-$v-win-x64-no-capture.exe",
            "dist/JACoB-$v-linux-amd64",
            "dist/JACoB-$v-linux-amd64-no-capture",
            "dist/SHA256SUMS.txt"
          )
          $releaseTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($releaseTags -contains $tag) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag" }
            gh release edit $tag --draft --prerelease --target "$env:PATCHED_SHA" --title "JACoB $v" --notes-file "RELEASE-NOTES-$v.md"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update $tag" }
          } else {
            gh release create $tag @assets --target "$env:PATCHED_SHA" --draft --prerelease --title "JACoB $v" --notes-file "RELEASE-NOTES-$v.md"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag" }
          }
