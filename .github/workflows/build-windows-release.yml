name: Build JACoB Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from internal/buildinfo/version.go
        required: true
        default: 0.2.11-alpha
      create_draft_release:
        description: Create/update a draft GitHub release with the built assets
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify version
        shell: powershell
        run: |
          $want = "${{ inputs.version }}"
          $src = Get-Content internal/buildinfo/version.go -Raw
          if ($src -notmatch ('Version\s*=\s*"' + [regex]::Escape($want) + '"')) {
            throw "buildinfo.Version does not match requested version $want"
          }

      - name: Test Windows
        run: go test ./...

      - name: Validate browser SDK
        shell: powershell
        run: node --check internal/webui/assets/app.js

      - name: Build release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "${{ inputs.version }}"
          $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"

          $env:GOOS="linux"
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          $env:GOOS="windows"
          go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          go build -trimpath -tags norecorder -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-recorder.exe" ./cmd/jacob

          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-recorder.exe" cmd/installer/payload/JACoB-no-recorder.exe
          try {
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-recorder.exe -Force -ErrorAction SilentlyContinue
          }

          $hash=(Get-FileHash "dist/JACoB-$v-win-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  JACoB-$v-win-x64.exe" | Out-File "dist/JACoB-$v-win-x64.exe.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: JACoB-${{ inputs.version }}
          path: |
            dist/JACoB-${{ inputs.version }}-win-x64.exe
            dist/JACoB-${{ inputs.version }}-win-x64.exe.sha256
            dist/JACoB-${{ inputs.version }}-win-x64-portable.exe
            dist/JACoB-${{ inputs.version }}-win-x64-no-recorder.exe
            dist/JACoB-${{ inputs.version }}-linux-amd64
            RELEASE-NOTES-${{ inputs.version }}.md

      - name: Create or update draft release
        if: ${{ inputs.create_draft_release }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v="${{ inputs.version }}"
          $tag="v$v"
          $assets=@(
            "dist/JACoB-$v-win-x64.exe",
            "dist/JACoB-$v-win-x64.exe.sha256",
            "dist/JACoB-$v-win-x64-portable.exe",
            "dist/JACoB-$v-win-x64-no-recorder.exe",
            "dist/JACoB-$v-linux-amd64"
          )
          $releaseTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          $exists = $releaseTags -contains $tag
          $notesFile = "RELEASE-NOTES-$v.md"
          if ($exists) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to existing release $tag" }
            if (Test-Path $notesFile) {
              gh release edit $tag --draft --prerelease --title "JACoB $v" --notes-file $notesFile
            } else {
              gh release edit $tag --draft --prerelease --title "JACoB $v"
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release $tag" }
          } else {
            if (Test-Path $notesFile) {
              gh release create $tag @assets --target "${{ github.sha }}" --draft --prerelease --title "JACoB $v" --notes-file $notesFile
            } else {
              gh release create $tag @assets --target "${{ github.sha }}" --draft --prerelease --title "JACoB $v" --notes "Automated JACoB build. Test before publishing."
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }
