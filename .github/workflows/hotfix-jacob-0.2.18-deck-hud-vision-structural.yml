      - name: Validate structural hotfix
        run: |
          set -euo pipefail
          git diff --check

          grep -Fq 'linux-x11-elite-child-hud' internal/platform/overlay_linux.go
          grep -Fq 'XCreateWindow(' internal/platform/overlay_linux.go
          grep -Fq 'd, parent, 0, 0' internal/platform/overlay_linux.go
          grep -Fq 'JACoB HUD Child' internal/platform/overlay_linux.go
          ! grep -Fq 'unsigned long elite_app = 359320UL' internal/platform/overlay_linux.go
          ! grep -Fq 'GAMESCOPE_EXTERNAL_OVERLAY' internal/platform/overlay_linux.go

          grep -Fq 'linux-x11-elite-window-direct-first' internal/platform/capture_linux_x11.go
          grep -Fq 'Direct XGetImage was the pre-SDK14 Deck path' internal/platform/capture_linux_x11.go
          grep -Fq 'jacob_ximage_looks_blank' internal/platform/capture_linux_x11.go
          grep -Fq '"blankFrames"' internal/platform/capture_linux_x11.go
          grep -Fq '"directFrames"' internal/platform/capture_linux_x11.go
          grep -Fq '"compositeFrames"' internal/platform/capture_linux_x11.go

          grep -Fq 'Elite - Dangerous (CLIENT)' internal/platform/focus_linux_x11.go
          grep -Fq 'linuxWindowHasEliteClientTitle' internal/platform/focus_linux_x11.go

      - name: Test Linux platform, Vision, Spatial, and repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision ./internal/spatial
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-0.2.18-windows-regression.exe ./cmd/jacob

      - name: Build and inspect Deck core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/JACoB-0.2.18-deck-structural-hotfix ./cmd/jacob
          ldd /tmp/JACoB-0.2.18-deck-structural-hotfix | tee /tmp/jacob-structural-hotfix-ldd.txt
          ! grep -q 'not found' /tmp/jacob-structural-hotfix-ldd.txt
          grep -q 'libXcomposite' /tmp/jacob-structural-hotfix-ldd.txt
          strings /tmp/JACoB-0.2.18-deck-structural-hotfix | grep -Fq 'linux-x11-elite-child-hud'
          strings /tmp/JACoB-0.2.18-deck-structural-hotfix | grep -Fq 'linux-x11-elite-window-direct-first'

      - name: Commit tested structural hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/overlay_linux.go internal/platform/capture_linux_x11.go
          if git diff --cached --quiet; then
            echo "Structural Deck hotfix already present."
          else
            git commit -m "Fix Deck HUD topology and black Vision capture"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Build replacement Steam Deck Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          mkdir -p dist

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )
          packaging/flatpak/tesseract-appdir/AppRun --version
          packaging/flatpak/tesseract-appdir/AppRun --list-langs | grep -Fxq eng

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" > dist/STEAMDECK-STRUCTURAL-HOTFIX-SHA256.txt

          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-STRUCTURAL-HOTFIX-SHA256.txt" --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-STRUCTURAL-HOTFIX-SHA256.txt" \
              --target "$(git rev-parse HEAD)" --draft --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck structural HUD + Vision capture hotfix. Test before publishing."
          fi

          echo "Replacement Steam Deck asset uploaded to draft release $tag"
