name: JACoB Community Tabs

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    paths:
      - 'registry/**'
      - 'scripts/process_community_submission.py'
      - 'scripts/validate_community_registry.py'
      - 'scripts/rebuild_community_stats.py'
      - '.github/ISSUE_TEMPLATE/community-tab.yml'
  push:
    branches: [main]
    paths:
      - 'registry/tabs/**'
      - 'registry/packages/**'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install JACoB Linux test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libx11-dev libxfixes-dev libxcomposite-dev

      - name: Prepare encoded Community Tabs patch
