          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Community Tabs v2 is already applied."
            exit 0
          fi
          git config user.name "JACoB Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/customtabs \
            internal/core/server.go \
            internal/updater/updater.go \
            internal/webui/assets/index.html \
            internal/webui/assets/styles.css \
            internal/webui/assets/app.js \
            registry \
            scripts \
            .github/ISSUE_TEMPLATE/community-tab.yml
          git commit -m "Add Community Tabs browser and sharing workflow"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  process-submission:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[Community Tab]')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find uploaded submission
        id: attachment
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          urls = re.findall(r'https://github\.com/user-attachments/files/[^\s)]+\.json(?:\?[^\s)]*)?', body)
          print('url=' + (urls[0] if urls else ''))
          PY

      - name: Ask for a submission file when missing
        if: steps.attachment.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "JACoB could not find a **.json** submission attachment in this issue. Edit the issue and upload the file created by **Tab Manager → Community**, then save the edit."

      - name: Stop when no attachment is present
        if: steps.attachment.outputs.url == ''
        run: exit 0

      - name: Download submission
        if: steps.attachment.outputs.url != ''
        run: |
          curl -fL --retry 3 --max-filesize 10000000 "${{ steps.attachment.outputs.url }}" -o /tmp/jacob-submission.json

      - name: Reset submission branch from current main
        if: steps.attachment.outputs.url != ''
        run: |
          branch="community-submission-${{ github.event.issue.number }}"
          git checkout -B "$branch" "${{ github.event.repository.default_branch }}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Validate and write registry changes
        if: steps.attachment.outputs.url != ''
        id: process
        env:
          ACTOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set +e
          python3 scripts/process_community_submission.py /tmp/jacob-submission.json \
            --actor "$ACTOR" --issue "$ISSUE" --root . --summary /tmp/community-summary.json \
            > /tmp/process-out.txt 2> /tmp/process-error.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "message<<EOF"
              cat /tmp/process-error.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_community_registry.py --root .
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('/tmp/community-summary.json'))
          for key in ('id','name','version','action'):
              print(f"{key}={s[key]}")
          print('capabilities=' + (', '.join(s['capabilities']) if s['capabilities'] else 'none'))
          print('capability_mismatch=' + str(bool(s['capabilityMismatch'])).lower())
          PY

      - name: Comment validation failure
        if: steps.attachment.outputs.url != '' && steps.process.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERROR_TEXT: ${{ steps.process.outputs.message }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "### Submission needs attention

          JACoB's registry validator rejected this file:

          \`\`\`
          $ERROR_TEXT
          \`\`\`

          Fix the tab in JACoB, prepare a new submission file, and replace the attachment in this issue."

      - name: Stop after validation failure
        if: steps.attachment.outputs.url != '' && steps.process.outputs.failed == 'true'
        run: exit 0

      - name: Commit registry proposal
        if: steps.attachment.outputs.url != '' && steps.process.outputs.failed == 'false'
        run: |
          git config user.name "JACoB Registry Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry
          git commit -m "Community tab: ${{ steps.process.outputs.name }} ${{ steps.process.outputs.version }} (#${{ github.event.issue.number }})"
          git push --force origin "HEAD:$BRANCH"

      - name: Create or refresh review PR
        if: steps.attachment.outputs.url != '' && steps.process.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          body=$(cat <<EOF
          Automated Community Tabs proposal from #${{ github.event.issue.number }}.

          - **Action:** ${{ steps.process.outputs.action }}
          - **Package:** \`${{ steps.process.outputs.id }}\`
          - **Version:** ${{ steps.process.outputs.version }}
          - **Detected capabilities:** ${{ steps.process.outputs.capabilities }}

          JACoB generated the version/hash/package metadata. The workflow independently recomputed the HTML hash, size and capability groups before creating this PR.

          Closes #${{ github.event.issue.number }}
          EOF
          )
          if [ -z "$existing" ]; then
            existing="$(gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "Community tab: ${{ steps.process.outputs.name }} ${{ steps.process.outputs.version }}" --body "$body")"
          else
            gh pr edit "$existing" --title "Community tab: ${{ steps.process.outputs.name }} ${{ steps.process.outputs.version }}" --body "$body"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "### Submission validated

          JACoB checked the package, recomputed its SHA-256 and size, and detected these sensitive capability groups: **${{ steps.process.outputs.capabilities }}**.

          Review PR: $existing"

  validate-registry:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate registry
        run: |
          python3 -m py_compile scripts/process_community_submission.py scripts/validate_community_registry.py scripts/rebuild_community_stats.py
          python3 scripts/validate_community_registry.py --root .

  publish-packages:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish current registry versions as GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/community-current.tsv
          import json
          from pathlib import Path
          for path in sorted(Path('registry/tabs').glob('*.json')):
              m=json.loads(path.read_text(encoding='utf-8'))
              print('\t'.join([m['id'],m['version'],m['artifact']['path']]))
          PY
          while IFS=$'\t' read -r package version artifact; do
            [ -n "$package" ] || continue
            [ -f "$artifact" ] || { echo "Missing $artifact" >&2; exit 1; }
            tag="community--${package}--v${version}"
            asset_name="$(basename "$artifact")"
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                echo "$tag already has $asset_name; preserving its download count."
              else
                gh release upload "$tag" "$artifact"
              fi
            else
              gh release create "$tag" "$artifact" \
                --title "Community Tab: ${package} ${version}" \
                --notes "JACoB Community Tab package. Install through JACoB's Community tab." \
                --prerelease --latest=false
            fi
          done < /tmp/community-current.tsv

      - name: Refresh aggregate download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.tag_name, ([.assets[].download_count] | add // 0)] | @tsv' \
            | python3 scripts/rebuild_community_stats.py --root .
          if git diff --quiet -- registry/stats.json; then
            exit 0
          fi
          git config user.name "JACoB Registry Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/stats.json
          git commit -m "Update Community Tab download counts [skip ci]"
          git push

  refresh-stats:
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild aggregate download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ ! -f scripts/rebuild_community_stats.py ]; then
            echo "Community Tabs has not been installed yet."
            exit 0
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.tag_name, ([.assets[].download_count] | add // 0)] | @tsv' \
            | python3 scripts/rebuild_community_stats.py --root .
          if git diff --quiet -- registry/stats.json; then
            exit 0
          fi
          git config user.name "JACoB Registry Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/stats.json
          git commit -m "Update Community Tab download counts [skip ci]"
          git push
