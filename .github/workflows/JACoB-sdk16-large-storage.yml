name: Apply JACoB SDK16 Large Storage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Patch, test, and commit SDK16 storage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libx11-dev \
            libxfixes-dev \
            libxcomposite-dev

