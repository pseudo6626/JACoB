    - name: Add Vulkan HUD2 regression tests
      run: "set -euo pipefail\ncat > internal/platform/vulkan_hud2_features_linux_test.go <<'GO'\n//go:build linux && cgo\n\npackage platform\n\nimport (\n\t\"math\"\n\t\"testing\"\n)\n\nfunc TestVulkanHUD2FeatureSceneTessellates(t *testing.T) {\n\tscene := OverlayScene{\n\t\tSpace: \"pixels\",\n\t\tTheme: \"clean\",\n\t\tItems: []OverlayItem{\n\t\t\t{Type: \"text\", X: 40, Y: 40, Text: \"HUD2 123\", Role: \"primary\", FontSize: 20, FontWeight: 700, Italic: true, Glow: 3, GlowColor: \"#79B8FFAA\", OutlineWidth: 1, OutlineColor: \"#000000FF\", ShadowX: 2, ShadowY: 2, ShadowColor: \"#00000099\"},\n\t\t\t{Type: \"line\", X: 20, Y: 90, X2: 260, Y2: 90, Role: \"accent\", LineWidth: 3, Dash: \"dash\", Glow: 2},\n\t\t\t{Type: \"polyline\", Points: []OverlayPoint{{X: 20, Y: 120}, {X: 80, Y: 105}, {X: 140, Y: 130}}, Role: \"success\", LineWidth: 2, Dash: \"dot\"},\n\t\t\t{Type: \"polygon\", Points: []OverlayPoint{{X: 190, Y: 105}, {X: 250, Y: 115}, {X: 220, Y: 155}}, Stroke: \"#FFFFFFFF\", Fill:\
        \ \"#FF8A2B66\", LineWidth: 2},\n\t\t\t{Type: \"rect\", X: 20, Y: 180, W: 150, H: 70, Role: \"panel\"},\n\t\t\t{Type: \"circle\", X: 230, Y: 215, R: 30, Stroke: \"#FFFFFFFF\", Fill: \"#79B8FF55\", LineWidth: 2},\n\t\t\t{Type: \"ring\", X: 330, Y: 215, R: 26, Role: \"warning\", LineWidth: 3},\n\t\t\t{Type: \"arc\", X: 420, Y: 215, R: 30, StartAngle: -90, SweepAngle: 220, Role: \"danger\", LineWidth: 3},\n\t\t\t{Type: \"reticle\", X: 520, Y: 215, R: 16, Role: \"accent\", LineWidth: 2},\n\t\t\t{Type: \"bracket\", X: 590, Y: 180, W: 90, H: 70, Role: \"success\", LineWidth: 2},\n\t\t\t{Type: \"chevron\", X: 760, Y: 215, W: 55, H: 35, Role: \"warning\", LineWidth: 3},\n\t\t\t{Type: \"panel\", X: 20, Y: 300, W: 280, H: 90, Label: \"PANEL\"},\n\t\t\t{Type: \"progress\", X: 340, Y: 315, W: 260, H: 18, Label: \"PROGRESS\", Progress: 0.63, Role: \"accent\"},\n\t\t\t{Type: \"metric\", X: 690, Y: 310, Label: \"SPEED\", Value: \"512\", Unit: \"M/S\", FontSize: 30, Role: \"metric\"},\n\t\t},\n\t\
        }\n\tif err := ValidateOverlayScene(&scene); err != nil {\n\t\tt.Fatalf(\"ValidateOverlayScene: %v\", err)\n\t}\n\tif len(scene.Items) <= 14 {\n\t\tt.Fatalf(\"semantic HUD2 items were not expanded: got %d items\", len(scene.Items))\n\t}\n\tvar vertices []vulkanHUDVertex\n\tvulkanTessellateScene(&vertices, scene)\n\tif len(vertices) < 500 {\n\t\tt.Fatalf(\"expected substantial HUD2 geometry, got %d vertices\", len(vertices))\n\t}\n\tif len(vertices)%3 != 0 {\n\t\tt.Fatalf(\"triangle stream length must be divisible by 3, got %d\", len(vertices))\n\t}\n\tfor i, v := range vertices {\n\t\tfor _, n := range []float32{v.X, v.Y, v.R, v.G, v.B, v.A} {\n\t\t\tif math.IsNaN(float64(n)) || math.IsInf(float64(n), 0) {\n\t\t\t\tt.Fatalf(\"vertex %d contains non-finite value\", i)\n\t\t\t}\n\t\t}\n\t\tif v.A < 0 || v.A > 1 {\n\t\t\tt.Fatalf(\"vertex %d alpha out of range: %f\", i, v.A)\n\t\t}\n\t}\n}\nGO\ngofmt -w internal/platform/vulkan_hud2_features_linux_test.go\n"
    - name: Prepare normal release workflow
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\n\nsource = Path(\".github/workflows/build-releases.yml\")\np = Path(\"/tmp/build-releases-vulkan.yml\")\ns = source.read_text(encoding=\"utf-8\")\ns = s.replace(\"default: 0.2.17-alpha\", \"default: 0.2.18-alpha\", 1)\n\ndep_pattern = re.compile(\n    r'(?m)^(\\s*)build-essential libx11-dev libxfixes-dev \\\\\\n'\n    r'\\1flatpak flatpak-builder$'\n)\ndep_replacement = (\n    r'\\1build-essential cmake ninja-build libvulkan-dev glslang-tools \\\\\\n'\n    r'\\1libx11-dev libxfixes-dev libxcomposite-dev \\\\\\n'\n    r'\\1libpipewire-0.3-dev libwayland-dev \\\\\\n'\n    r'\\1flatpak flatpak-builder'\n)\ns, n = dep_pattern.subn(dep_replacement, s, count=1)\nif n != 1 and \"libvulkan-dev\" not in s:\n    raise SystemExit(f\"release dependency replacement count={n}\")\n\nif \"Build Vulkan HUD layer\" not in s:\n    anchor = \"      - name: Build Steam Deck Flatpak installer\\n\"\n    if anchor not in s:\n\
        \        raise SystemExit(\"Steam Deck Flatpak build anchor not found\")\n    extra = '''      - name: Build Vulkan HUD layer\n        run: |\n          set -euo pipefail\n          rm -rf build/vulkan-hud packaging/flatpak/vulkan-hud\n          mkdir -p build/vulkan-hud packaging/flatpak/vulkan-hud\n          glslangValidator -V native/vulkan-hud/overlay.vert -o build/vulkan-hud/overlay.vert.spv\n          glslangValidator -V native/vulkan-hud/overlay.frag -o build/vulkan-hud/overlay.frag.spv\n          cmake -S native/vulkan-hud -B build/vulkan-hud/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release\n          cmake --build build/vulkan-hud/cmake --verbose\n          layer=\"$(find build/vulkan-hud/cmake -type f -name 'libVK_LAYER_JACOB_hud.so' -print -quit)\"\n          test -n \"$layer\"\n          test -s \"$layer\"\n          ldd \"$layer\" | tee dist/vulkan-layer-ldd.txt\n          ! grep -q 'not found' dist/vulkan-layer-ldd.txt\n          readelf -Ws \"$layer\" | grep -F 'vkNegotiateLoaderLayerInterfaceVersion'\n\
        \          cp \"$layer\" packaging/flatpak/vulkan-hud/libVK_LAYER_JACOB_hud.so\n          cp build/vulkan-hud/overlay.vert.spv packaging/flatpak/vulkan-hud/overlay.vert.spv\n          cp build/vulkan-hud/overlay.frag.spv packaging/flatpak/vulkan-hud/overlay.frag.spv\n\n      - name: Prepare bundled OCR runtime\n        run: |\n          set -euo pipefail\n          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'\n          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'\n          curl -fL --retry 3 \"$ocr_url\" -o /tmp/jacob-tesseract.AppImage\n          printf '%s  %s\\\\n' \"$ocr_sha\" /tmp/jacob-tesseract.AppImage | sha256sum -c -\n          chmod +x /tmp/jacob-tesseract.AppImage\n          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root\n          (\n            cd packaging/flatpak\n            /tmp/jacob-tesseract.AppImage\
        \ --appimage-extract >/dev/null\n            mv squashfs-root tesseract-appdir\n          )\n          test -x packaging/flatpak/tesseract-appdir/AppRun\n\n'''\n    s = s.replace(anchor, extra + anchor, 1)\n\nif \"            dist/vulkan-layer-ldd.txt\\\\n\" not in s:\n    anchor = \"            dist/linux-ldd.txt\\n\"\n    if anchor not in s:\n        raise SystemExit(\"Linux artifact path anchor not found\")\n    s = s.replace(anchor, anchor + \"            dist/vulkan-layer-ldd.txt\\n\", 1)\n\np.write_text(s, encoding=\"utf-8\")\nPY\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport yaml\nyaml.safe_load(Path(\"/tmp/build-releases-vulkan.yml\").read_text(encoding=\"utf-8\"))\nprint(\"/tmp/build-releases-vulkan.yml: YAML OK\")\nPY\n"
    - name: Update Steam Deck documentation
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"README.md\")\ns = p.read_text(encoding=\"utf-8\")\ns = s.replace(\"> Current field build: **0.2.13 Alpha \xB7 SDK 10**\", \"> Current field build: **0.2.18 Alpha \xB7 SDK 14**\")\nold = \"Steam Deck users should install the `JACoB-<version>-SteamDeck.flatpak` release asset in Desktop Mode and launch **JACoB Steam Deck Setup** once. The setup installs the native host payload and integrates JACoB with Elite's Steam launch options. **Decky Loader is required only for JACoB's in-game HUD renderer**; if Decky is missing, setup directs the user to the official Decky installation page. Full step-by-step instructions are in [`docs/INSTALLATION.md`](docs/INSTALLATION.md).\"\nnew = \"Steam Deck users should install the `JACoB-<version>-SteamDeck.flatpak` release asset in Desktop Mode and launch **JACoB Steam Deck Setup** once. The setup installs the native host payload, Vulkan HUD layer, clean pre-HUD Vision capture\
        \ path, and Elite Steam launch integration. Decky Loader is not required. Full step-by-step instructions are in [`docs/INSTALLATION.md`](docs/INSTALLATION.md).\"\nif old not in s:\n    raise SystemExit(\"README Steam Deck paragraph anchor not found\")\ns = s.replace(old, new, 1)\ns = s.replace(\"SDK / protocol version **10** includes:\", \"SDK / protocol version **14** includes:\", 1)\np.write_text(s, encoding=\"utf-8\")\n\np = Path(\"docs/INSTALLATION.md\")\ns = p.read_text(encoding=\"utf-8\")\nstart = s.find(\"After setup, launch Elite Dangerous normally from Gaming Mode.\")\nend_marker = \"OCR is capability-checked separately and uses the bundled Tesseract runtime in the Steam Deck package.\"\nend = s.find(end_marker)\nif start < 0 or end < 0 or end < start:\n    raise SystemExit(\"INSTALLATION Steam Deck section anchors not found\")\nend += len(end_marker)\nnew = '''After setup, launch Elite Dangerous normally from Gaming Mode. JACoB starts with Elite. In Desktop Mode, JACoB\
        \ can also be launched without Elite; it opens the local browser UI so another device can be paired before starting the game.\n\nThe Flatpak is only the installer/bootstrap. The actual JACoB core runs natively on the Steam Deck host so Vulkan, Linux input, journal/status access and the in-app updater are not trapped inside a Flatpak sandbox.\n\n`~/.local/share/JACoB` is installer-managed payload. Reinstalling a newer Steam Deck package stops the old host instance and replaces that payload completely. Saved tabs, pairing state and user configuration under `~/.config/JACoB` are preserved.\n\n### Steam Deck Vulkan HUD and clean Vision capture\n\nThe full Linux build is compiled natively on Linux with CGO enabled. When Elite is launched through JACoB's Steam integration, the bundled implicit Vulkan layer is enabled only for the Elite process.\n\nThe Vulkan layer consumes the same validated HUD2 `OverlayScene` contract as Windows and composites JACoB geometry directly into Elite's Vulkan\
        \ presentation path. It does not use Decky, Steam CEF, a second overlay window, or the Gamescope external-overlay slot.\n\nVision, OCR and Game View prefer the Vulkan pre-HUD capture backend while the layer is connected. The layer copies the Elite frame before JACoB draws its own HUD, so visual tools cannot detect JACoB's overlay. Gamescope/PipeWire and X11 capture remain fallback paths when the Vulkan layer is not available.\n\nThe capture boundary remains Elite-only. Custom tabs receive derived Vision/OCR results rather than raw game pixels.\n\nOCR is capability-checked separately and uses the bundled Tesseract runtime in the Steam Deck package.'''\ns = s[:start] + new + s[end:]\np.write_text(s, encoding=\"utf-8\")\nPY\npython3 - <<'PY'\nfrom pathlib import Path\nfor name in [\"examples/hud-studio-tab.html\", \"cmd/installer/payload/HUD-Studio.html\"]:\n    p = Path(name)\n    if not p.exists():\n        continue\n    s = p.read_text(encoding=\"utf-8\")\n    s = s.replace(\"SDK13\"\
        , \"SDK14\")\n    marker = \"Change the sliders while Elite is foreground and compare themes.\"\n    extra = \" On Steam Deck, leave this HUD visible and open Game View/Vision: the capture should show Elite without these HUD elements.\"\n    if marker in s and extra.strip() not in s:\n        s = s.replace(marker, marker + extra, 1)\n    p.write_text(s, encoding=\"utf-8\")\nPY\n"
