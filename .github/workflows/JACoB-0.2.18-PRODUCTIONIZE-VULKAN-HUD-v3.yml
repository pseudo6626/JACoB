    - name: Commit production Vulkan backend
      run: "set -euo pipefail\n\n# Build products are validation artifacts, not repository source.\nrm -rf build/vulkan-hud\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\n# The repository token can write ordinary contents but GitHub refuses workflow-file\n# updates without the dedicated Workflows permission. Keep that boundary explicit.\ngit add -A -- . ':(exclude).github/workflows/**' ':(exclude)build/**'\n\nstaged=\"$(git diff --cached --name-only)\"\nif printf '%s\\n' \"$staged\" | grep -Eq '^\\.github/workflows/|^build/'; then\n  echo \"Refusing to commit workflow/build artifacts:\" >&2\n  printf '%s\\n' \"$staged\" >&2\n  exit 1\nfi\n\nif git diff --cached --quiet; then\n  echo \"No productionization changes to commit.\"\n  exit 0\nfi\n\ngit status --short\ngit commit -m \"Productionize Steam Deck Vulkan HUD and clean Vision capture\"\ngit push origin HEAD:main\n"
