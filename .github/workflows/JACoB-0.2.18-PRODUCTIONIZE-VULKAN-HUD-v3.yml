        \ Vulkan runtime path anchor not found\")\np.write_text(s, encoding=\"utf-8\")\n\np = Path(\"internal/platform/overlay_linux_vulkan.go\")\ns = p.read_text(encoding=\"utf-8\")\npattern = re.compile(r'func vulkanRuntimeDir\\(\\) string \\{.*?\\n\\}', re.S)\nreplacement = '''func vulkanRuntimeDir() string {\n\tif v := strings.TrimSpace(os.Getenv(\"JACOB_VK_RUNTIME_DIR\")); v != \"\" {\n\t\treturn v\n\t}\n\tif home, err := os.UserHomeDir(); err == nil && strings.TrimSpace(home) != \"\" {\n\t\treturn filepath.Join(home, \".local\", \"share\", \"JACoB\", \"vulkan-runtime\")\n\t}\n\tbase := strings.TrimSpace(os.Getenv(\"XDG_RUNTIME_DIR\"))\n\tif base == \"\" {\n\t\tbase = fmt.Sprintf(\"/run/user/%d\", os.Getuid())\n\t}\n\treturn filepath.Join(base, \"jacob-vk\")\n}'''\ns, n = pattern.subn(replacement, s, count=1)\nif n != 1:\n    raise SystemExit(f\"Go Vulkan runtime function replacement count={n}\")\np.write_text(s, encoding=\"utf-8\")\n\np = Path(\"packaging/flatpak/jacob-steam-integrate\"\
        )\ns = p.read_text(encoding=\"utf-8\")\ns = s.replace(\n    'VK_RUNTIME=\"${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/jacob-vk\"',\n    'VK_RUNTIME=\"$HOME/.local/share/JACoB/vulkan-runtime\"',\n)\nif 'VK_RUNTIME=\"$HOME/.local/share/JACoB/vulkan-runtime\"' not in s:\n    raise SystemExit(\"Steam launcher Vulkan runtime path was not updated\")\np.write_text(s, encoding=\"utf-8\")\n\np = Path(\"packaging/flatpak/jacob-flatpak-launch\")\ns = p.read_text(encoding=\"utf-8\")\ns = s.replace(\n    'export JACOB_VK_RUNTIME_DIR=\"/run/user/$(id -u)/jacob-vk\"',\n    'export JACOB_VK_RUNTIME_DIR=\"$HOME/.local/share/JACoB/vulkan-runtime\"',\n)\n\nif \"remove_legacy_decky_hud()\" not in s:\n    anchor = \"clean_managed_payload() {\"\n    if anchor not in s:\n        raise SystemExit(\"clean_managed_payload anchor not found\")\n    helper = '''remove_legacy_decky_hud() {\n  local target=\"$HOST_HOME/homebrew/plugins/JACoB-HUD\"\n  [[ -e \"$target\" ]] || return 0\n  rm -rf \"$target\" 2>/dev/null\
