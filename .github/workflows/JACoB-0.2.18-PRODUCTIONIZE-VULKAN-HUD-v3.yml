    - name: Validate production source
      run: "set -euo pipefail\ngofmt -w \\\n  internal/platform/overlay_linux_vulkan.go \\\n  internal/platform/capture_linux_vulkan.go \\\n  internal/platform/overlay_linux_bridge.go \\\n  internal/platform/vulkan_transport_linux_test.go \\\n  internal/platform/vulkan_hud2_features_linux_test.go \\\n  internal/platform/capture_linux_gamescope.go \\\n  cmd/jacob/main.go\n\ngo test ./internal/platform\ngo test ./...\nnode --check internal/webui/assets/app.js\n\nrm -rf build/vulkan-hud\nmkdir -p build/vulkan-hud\nglslangValidator -V native/vulkan-hud/overlay.vert -o build/vulkan-hud/overlay.vert.spv\nglslangValidator -V native/vulkan-hud/overlay.frag -o build/vulkan-hud/overlay.frag.spv\ncmake -S native/vulkan-hud -B build/vulkan-hud/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release\ncmake --build build/vulkan-hud/cmake --verbose\nlayer=\"$(find build/vulkan-hud/cmake -type f -name 'libVK_LAYER_JACOB_hud.so' -print -quit)\"\ntest -n \"$layer\"\ntest -s \"$layer\"\nldd \"$layer\" | tee /tmp/vulkan-layer-ldd.txt\n\
        ! grep -q 'not found' /tmp/vulkan-layer-ldd.txt\nreadelf -Ws \"$layer\" | grep -F 'vkNegotiateLoaderLayerInterfaceVersion'\n\ngrep -Fq 'linux-vulkan-hud2-v10' internal/platform/overlay_linux_vulkan.go\ngrep -Fq 'linux-vulkan-prehud-elite-v2' internal/platform/capture_linux_vulkan.go\ngrep -Fq 'vulkan-runtime' packaging/flatpak/jacob-steam-integrate\ngrep -Fq 'vulkan-runtime' packaging/flatpak/jacob-flatpak-launch\ngrep -Fq 'vulkan-hud' packaging/flatpak/com.pseudosci.JACoB.yml\n! grep -Fq 'JACoB-HUD' packaging/flatpak/com.pseudosci.JACoB.yml\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport yaml\nfor f in [\"/tmp/build-releases-vulkan.yml\", \"packaging/flatpak/com.pseudosci.JACoB.yml\"]:\n    yaml.safe_load(Path(f).read_text(encoding=\"utf-8\"))\n    print(f\"{f}: YAML OK\")\nPY\n\nrm -rf build/vulkan-hud\ngit diff --check\n"
    - name: Upload production release workflow
