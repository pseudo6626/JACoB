        """
        source_text = gzip.decompress(
            base64.b64decode("".join(payload.split()))
        ).decode("utf-8")

        doc = yaml.safe_load(source_text)
        steps = next(iter(doc["jobs"].values())).get("steps") or []
        wanted = [
            "Add Vulkan v10 native renderer",
            "Add Vulkan HUD and clean Vision backends",
            "Replace Steam Deck packaging with v10 installer",
        ]
        found = {step.get("name"): step.get("run", "") for step in steps}
        missing = [name for name in wanted if not found.get(name)]
        if missing:
            raise SystemExit("Embedded v10 generator is missing steps: " + ", ".join(missing))

        out = Path("/tmp/jacob-vulkan-productionize")
        out.mkdir(parents=True, exist_ok=True)
        for old in out.glob("*.sh"):
            old.unlink()
        for i, name in enumerate(wanted):
            p = out / f"{i:02d}.sh"
            p.write_text("#!/usr/bin/env bash\n" + found[name] + "\n", encoding="utf-8")
            p.chmod(0o755)
            print(p)
        PY

        for script in /tmp/jacob-vulkan-productionize/*.sh; do
          echo "==> $script"
          bash "$script"
        done
