        }\n\tif err := ValidateOverlayScene(&scene); err != nil {\n\t\tt.Fatalf(\"ValidateOverlayScene: %v\", err)\n\t}\n\tif len(scene.Items) <= 14 {\n\t\tt.Fatalf(\"semantic HUD2 items were not expanded: got %d items\", len(scene.Items))\n\t}\n\tvar vertices []vulkanHUDVertex\n\tvulkanTessellateScene(&vertices, scene)\n\tif len(vertices) < 500 {\n\t\tt.Fatalf(\"expected substantial HUD2 geometry, got %d vertices\", len(vertices))\n\t}\n\tif len(vertices)%3 != 0 {\n\t\tt.Fatalf(\"triangle stream length must be divisible by 3, got %d\", len(vertices))\n\t}\n\tfor i, v := range vertices {\n\t\tfor _, n := range []float32{v.X, v.Y, v.R, v.G, v.B, v.A} {\n\t\t\tif math.IsNaN(float64(n)) || math.IsInf(float64(n), 0) {\n\t\t\t\tt.Fatalf(\"vertex %d contains non-finite value\", i)\n\t\t\t}\n\t\t}\n\t\tif v.A < 0 || v.A > 1 {\n\t\t\tt.Fatalf(\"vertex %d alpha out of range: %f\", i, v.A)\n\t\t}\n\t}\n}\nGO\ngofmt -w internal/platform/vulkan_hud2_features_linux_test.go\n"
    - name: Productionize normal release workflow
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re

        p = Path(".github/workflows/build-releases.yml")
        s = p.read_text(encoding="utf-8")
        s = s.replace("default: 0.2.17-alpha", "default: 0.2.18-alpha", 1)

        dep_pattern = re.compile(
            r'(?m)^(\s*)build-essential libx11-dev libxfixes-dev \\\n'
            r'\1flatpak flatpak-builder$'
        )
        dep_replacement = (
            r'\1build-essential cmake ninja-build libvulkan-dev glslang-tools \\\n'
            r'\1libx11-dev libxfixes-dev libxcomposite-dev \\\n'
            r'\1libpipewire-0.3-dev libwayland-dev \\\n'
            r'\1flatpak flatpak-builder'
        )
        s, n = dep_pattern.subn(dep_replacement, s, count=1)
        if n != 1 and "libvulkan-dev" not in s:
            raise SystemExit(f"release dependency replacement count={n}")

        if "Build Vulkan HUD layer" not in s:
            anchor = "      - name: Build Steam Deck Flatpak installer\n"
            if anchor not in s:
                raise SystemExit("Steam Deck Flatpak build anchor not found")
            extra = '''      - name: Build Vulkan HUD layer
                run: |
                  set -euo pipefail
                  rm -rf build/vulkan-hud packaging/flatpak/vulkan-hud
                  mkdir -p build/vulkan-hud packaging/flatpak/vulkan-hud
                  glslangValidator -V native/vulkan-hud/overlay.vert -o build/vulkan-hud/overlay.vert.spv
                  glslangValidator -V native/vulkan-hud/overlay.frag -o build/vulkan-hud/overlay.frag.spv
                  cmake -S native/vulkan-hud -B build/vulkan-hud/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
                  cmake --build build/vulkan-hud/cmake --verbose
                  layer="$(find build/vulkan-hud/cmake -type f -name 'libVK_LAYER_JACOB_hud.so' -print -quit)"
                  test -n "$layer"
                  test -s "$layer"
                  ldd "$layer" | tee dist/vulkan-layer-ldd.txt
                  ! grep -q 'not found' dist/vulkan-layer-ldd.txt
                  readelf -Ws "$layer" | grep -F 'vkNegotiateLoaderLayerInterfaceVersion'
                  cp "$layer" packaging/flatpak/vulkan-hud/libVK_LAYER_JACOB_hud.so
                  cp build/vulkan-hud/overlay.vert.spv packaging/flatpak/vulkan-hud/overlay.vert.spv
                  cp build/vulkan-hud/overlay.frag.spv packaging/flatpak/vulkan-hud/overlay.frag.spv

              - name: Prepare bundled OCR runtime
                run: |
                  set -euo pipefail
                  ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
                  ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
                  curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
                  printf '%s  %s\\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
                  chmod +x /tmp/jacob-tesseract.AppImage
                  rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
                  (
                    cd packaging/flatpak
                    /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
                    mv squashfs-root tesseract-appdir
                  )
                  test -x packaging/flatpak/tesseract-appdir/AppRun

        '''
            s = s.replace(anchor, extra + anchor, 1)

        if "            dist/vulkan-layer-ldd.txt\\n" not in s:
            anchor = "            dist/linux-ldd.txt\n"
            if anchor not in s:
                raise SystemExit("Linux artifact path anchor not found")
            s = s.replace(anchor, anchor + "            dist/vulkan-layer-ldd.txt\n", 1)

        p.write_text(s, encoding="utf-8")
        PY

