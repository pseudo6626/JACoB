name: JACoB 0.2.13 Network Doctor Bootstrap

on:
  push:
    paths:
      - .github/workflows/JACoB-0.2.13-Network-Doctor-Bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Apply Network Doctor patch
        shell: powershell
        run: |
          $b64 = @'
          
          '@
          [IO.File]::WriteAllBytes('network_patch.py', [Convert]::FromBase64String($b64.Trim()))
          python network_patch.py
          Remove-Item network_patch.py -Force
      - name: Format Go
        shell: powershell
        run: |
          $goFiles = @(
            "internal/core/server.go"
            "cmd/installer/main.go"
            "internal/buildinfo/version.go"
          )
          $goFiles += Get-ChildItem "internal/networkdiag" -Filter "*.go" | ForEach-Object { $_.FullName }
          & gofmt -w $goFiles
      - name: Validate browser JavaScript
        shell: powershell
        run: node --check internal/webui/assets/app.js
      - name: Test Windows
        shell: powershell
        run: go test ./...
      - name: Build Windows variants
        shell: powershell
        run: |
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags='-H=windowsgui' -o "$env:RUNNER_TEMP/JACoB-full.exe" ./cmd/jacob
          go build -trimpath -tags 'norecorder,nocapture' -ldflags='-H=windowsgui' -o "$env:RUNNER_TEMP/JACoB-no-capture.exe" ./cmd/jacob
          Copy-Item "$env:RUNNER_TEMP/JACoB-full.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "$env:RUNNER_TEMP/JACoB-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try { go build -trimpath -ldflags='-H=windowsgui' -o "$env:RUNNER_TEMP/JACoB-setup.exe" ./cmd/installer } finally { Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue }
      - name: Verify diff
        shell: powershell
        run: |
          git diff --check
          git status --short
          if (Test-Path .github/workflows/JACoB-0.2.13-Network-Doctor-Bootstrap.yml) { throw 'bootstrap workflow should remove itself before commit' }
          if (-not (Test-Path internal/networkdiag/networkdiag_windows.go)) { throw 'network diagnostics backend missing' }
          $version = Get-Content internal/buildinfo/version.go -Raw
          if ($version -notmatch '0\.2\.13-alpha') { throw 'version bump missing' }
      - name: Commit validated patch
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { Write-Host 'No changes to commit'; exit 0 }
          git commit -m 'JACoB 0.2.13-alpha LAN Network Doctor'
          git push origin HEAD:main
