name: Repair JACoB 0.2.11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Ensure 0.2.8 hotfix tag is available
        shell: powershell
        run: git fetch --tags --force

      - name: Apply 0.2.11 repair
        run: python scripts/repair-0.2.11.py

      - name: Format modified Go source
        shell: powershell
        run: |
          gofmt -w `
            internal/customtabs/store.go internal/customtabs/store_test.go `
            internal/buildinfo/version.go internal/buildinfo/version_test.go `
            cmd/jacob/main.go cmd/installer/main.go `
            internal/updater/updater.go internal/updater/updater_test.go

      - name: Run full Go test suite
        run: go test ./...

      - name: Validate browser SDK
        shell: powershell
        run: node --check internal/webui/assets/app.js

      - name: Validate schema-3 repair and port migration
        shell: powershell
        run: |
          $store = Get-Content internal/customtabs/store.go -Raw
          if ($store -notmatch 'storeSchema\s*=\s*3') { throw "Schema 3 was not restored" }
          if ($store -notmatch 'maxHTMLBytes\s*=\s*4 \* 1024 \* 1024') { throw "4 MiB tab limit was not restored" }
          foreach ($needle in @('contentDirName = "custom-tabs"','recoverOrphanedBodies','SizeBytes int64','replaceFileAtomic')) {
            if ($store -notmatch [regex]::Escape($needle)) { throw "Schema 3 marker missing: $needle" }
          }
          $main = Get-Content cmd/jacob/main.go -Raw
          if ($main -notmatch '127\.0\.0\.1:6626') { throw "Default browser port is not 6626" }
          if ($main -notmatch '0\.0\.0\.0:6626') { throw "Default LAN bind port is not 6626" }
          $installer = Get-Content cmd/installer/main.go -Raw
          if ($installer -notmatch '127\.0\.0\.1:6626/api/health') { throw "Installer verification port is not 6626" }
          $app = Get-Content internal/webui/assets/app.js -Raw
          if ($app -notmatch 'lan\.port\|\|6626') { throw "Browser LAN fallback port is not 6626" }
          $version = Get-Content internal/buildinfo/version.go -Raw
          if ($version -notmatch 'Version\s*=\s*"0\.2\.11-alpha"') { throw "Version was not raised to 0.2.11-alpha" }

      - name: Commit repaired source to main
        shell: powershell
        run: |
          git config user.name "JACoB Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          if (git diff --cached --quiet) { throw "Repair produced no source changes" }
          git commit -m "Restore schema 3 tabs and move JACoB to port 6626"
          git push origin HEAD:main
