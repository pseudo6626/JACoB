          JACOB_PATCH
          python /tmp/jacob-hotfix.py

          gofmt -w \
            internal/platform/capture_linux_gamescope.go \
            internal/platform/overlay_linux_bridge.go

      - name: Rebuild Decky HUD runtime
        working-directory: packaging/decky/JACoB-HUD
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build
          test -s dist/index.js
          python -m py_compile main.py

          rm -rf ../../flatpak/JACoB-HUD
          mkdir -p ../../flatpak/JACoB-HUD
          cp plugin.json main.py ../../flatpak/JACoB-HUD/
          cp -a dist ../../flatpak/JACoB-HUD/

      - name: Validate hotfix
        run: |
          set -euo pipefail
          grep -Fq 'SPA_POD_CHOICE_RANGE_Rectangle' packaging/flatpak/jacob-gamescope-stream.c
          grep -Fq 'SPA_POD_CHOICE_RANGE_Fraction' packaging/flatpak/jacob-gamescope-stream.c
          grep -Fq 'SPA_FRACTION(0, 1)' packaging/flatpak/jacob-gamescope-stream.c
          grep -Fq 'SPA_FRACTION(30, 1)' packaging/flatpak/jacob-gamescope-stream.c
          grep -Fq 'SPA_FORMAT_VIDEO_gamescope_focus_appid' packaging/flatpak/jacob-gamescope-stream.c
          ! grep -Fq 'SPA_FORMAT_VIDEO_requested_size, SPA_POD_Rectangle' packaging/flatpak/jacob-gamescope-stream.c

          grep -Fq 'var helperStderr bytes.Buffer' internal/platform/capture_linux_gamescope.go
          grep -Fq 'helperStderrTail' internal/platform/capture_linux_gamescope.go

          grep -Fq 'DECKY_RELOAD_STAMP' packaging/flatpak/jacob-flatpak-launch
          grep -Fq 'pkexec systemctl restart plugin_loader.service' packaging/flatpak/jacob-flatpak-launch
          grep -Fq '"version": "0.1.1"' packaging/decky/JACoB-HUD/plugin.json

          git diff --check

      - name: Compile PipeWire helper
        run: |
          set -euo pipefail
          cc -O2 -Wall -Wextra -Werror \
            packaging/flatpak/jacob-gamescope-stream.c \
            -o /tmp/jacob-gamescope-stream \
            $(pkg-config --cflags --libs libpipewire-0.3 wayland-client)
          ldd /tmp/jacob-gamescope-stream | tee /tmp/helper-ldd.txt
          ! grep -q 'not found' /tmp/helper-ldd.txt

      - name: Test Linux repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision ./internal/spatial
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-hotfix-v2-windows.exe ./cmd/jacob
          go build -trimpath -o /tmp/JACoB-Setup-hotfix-v2-windows.exe ./cmd/installer

      - name: Build Linux core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          v='0.2.18-alpha'
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          ldd "dist/JACoB-$v-linux-amd64" | tee /tmp/core-ldd.txt
          ! grep -q 'not found' /tmp/core-ldd.txt

      - name: Prepare OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'

          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )

      - name: Build Deck Flatpak before commit
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          test -s "dist/JACoB-$v-SteamDeck.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-PIPEWIRE-HUD2-V2-SHA256.txt

      - name: Commit tested hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf packaging/decky/JACoB-HUD/node_modules
          rm -rf packaging/decky/JACoB-HUD/dist
          rm -f packaging/decky/JACoB-HUD/pnpm-lock.yaml

          git add \
            packaging/flatpak/jacob-gamescope-stream.c \
            internal/platform/capture_linux_gamescope.go \
            internal/platform/overlay_linux_bridge.go \
            packaging/decky/JACoB-HUD/plugin.json \
            packaging/flatpak/JACoB-HUD \
            packaging/flatpak/jacob-flatpak-launch

          if git diff --cached --quiet; then
            echo "Hotfix already present."
          else
            git commit -m "Fix Deck PipeWire negotiation and HUD plugin loading"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Upload replacement Deck release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          tag="v$v"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-PIPEWIRE-HUD2-V2-SHA256.txt" \
              --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-PIPEWIRE-HUD2-V2-SHA256.txt" \
              --target "$(git rev-parse HEAD)" \
              --draft --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck PipeWire negotiation + Decky HUD loader hotfix."
          fi
