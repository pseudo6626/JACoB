            mv squashfs-root tesseract-appdir
          )
          test -x packaging/flatpak/tesseract-appdir/AppRun

      - name: Build Steam Deck probe Flatpak
        run: |
          set -euo pipefail
          v='0.2.18-alpha'

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          rm -rf flatpak-build flatpak-repo
          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            "dist/JACoB-$v-SteamDeck-vulkan-hud-v9.2.flatpak" \
            com.pseudosci.JACoB \
            stable

          test -s "dist/JACoB-$v-SteamDeck-vulkan-hud-v9.2.flatpak"
          sha256sum \
            "dist/JACoB-$v-SteamDeck-vulkan-hud-v9.2.flatpak" \
            dist/libVK_LAYER_JACOB_hud.so \
            > dist/VULKAN-HUD-V9.1-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jacob-0.2.18-vulkan-hud-v9.2
          path: |
            dist/JACoB-0.2.18-alpha-SteamDeck-vulkan-hud-v9.2.flatpak
            dist/libVK_LAYER_JACOB_hud.so
            dist/VULKAN-HUD-V9.1-SHA256.txt

      - name: Upload probe Flatpak to current alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.2.18-alpha'
          if gh release view "$tag" >/dev/null 2>&1; then
