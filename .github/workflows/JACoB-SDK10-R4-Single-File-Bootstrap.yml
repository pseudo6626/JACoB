      - name: Format and validate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          gofmt -w internal/vision internal/platform/capture_windows.go internal/platform/capture_windows_disabled.go internal/platform/window_geometry_windows.go internal/platform/calibration_capture_windows.go internal/platform/calibration_capture_nocapture.go internal/platform/calibration_capture_other.go internal/platform/capture_matte_windows.go internal/platform/capture_matte_test.go internal/core/server.go internal/core/video_privacy_test.go internal/buildinfo/version.go cmd/installer/main.go
          go test ./...
          go test -tags "norecorder,nocapture" ./...
          $visionMatte = Select-String -Path internal/vision/*.go -Pattern "CapturePrivacyMatteJPEG" -SimpleMatch
          if ($visionMatte) { throw "Vision must remain on the tight CaptureJPEG path; privacy matte is video-only." }
          if (-not (Select-String -Path internal/vision/ocr_windows.go -Pattern "CREATE_NO_WINDOW|createNoWindow")) { throw "Windows OCR worker is missing CREATE_NO_WINDOW protection." }
          if (-not (Select-String -Path internal/vision/ocr_windows.go -Pattern "WindowStyle.*,.*Hidden|-WindowStyle")) { throw "Windows OCR worker is missing hidden-window configuration." }
          if (-not (Select-String -Path internal/vision/calibration.go -Pattern "CaptureCalibrationJPEG" -SimpleMatch)) { throw "Frozen calibration is not using the temporary-focus snapshot path." }
          if (-not (Select-String -Path internal/platform/calibration_capture_windows.go -Pattern "FocusGame" -SimpleMatch)) { throw "Windows calibration helper is not focusing Elite before capture." }
          if (Select-String -Path internal/vision/*.go -Pattern "CapturePrivacyMatteJPEG" -SimpleMatch) { throw "Vision must not use the Game View privacy matte path." }
          foreach ($f in @('examples/vision-text-recognition.html','examples/vision-color-fill-recognition.html','examples/vision-color-detection.html')) { if (-not (Test-Path $f)) { throw "Missing generic Vision example tab: $f" } }
          node --check internal/webui/assets/app.js
          python -m json.tool docs/schemas/vision-inspect-request.schema.json > $null

      - name: Build candidate artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = "0.2.12-alpha"
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"

          $env:GOOS="linux"
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          $env:GOOS="windows"
          go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob

          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try {
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue
          }

      - name: Package exact source diff and checksums
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = "0.2.12-alpha"
          git add -N .
          git diff --binary --output="dist/JACoB-$v-SDK10-R4-source.patch"
          $changed = @(git diff --name-only)
          $stage = Join-Path $env:RUNNER_TEMP "jacob-sdk10-r4-source"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($f in $changed) {
            if (-not (Test-Path $f -PathType Leaf)) { continue }
            $dest = Join-Path $stage $f
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item $f $dest
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/JACoB-$v-SDK10-R4-source-update.zip" -Force
          Copy-Item "RELEASE-NOTES-$v.md" "dist/RELEASE-NOTES-$v.md"
          $hashFiles = Get-ChildItem dist -File | Where-Object { $_.Name -notlike '*.sha256' }
          $lines = foreach ($f in $hashFiles) {
            $h=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File "dist/SHA256SUMS.txt" -Encoding ascii
          git status --short | Out-File "dist/SOURCE-STATUS.txt" -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: JACoB-0.2.12-alpha-SDK10-candidate-R4
          if-no-files-found: error
          path: |
            dist/JACoB-0.2.12-alpha-win-x64.exe
            dist/JACoB-0.2.12-alpha-win-x64-portable.exe
            dist/JACoB-0.2.12-alpha-win-x64-no-capture.exe
            dist/JACoB-0.2.12-alpha-linux-amd64
            dist/JACoB-0.2.12-alpha-SDK10-R4-source.patch
            dist/JACoB-0.2.12-alpha-SDK10-R4-source-update.zip
            dist/RELEASE-NOTES-0.2.12-alpha.md
            dist/SHA256SUMS.txt
            dist/SOURCE-STATUS.txt

      - name: Commit validated candidate
        if: ${{ inputs.commit_candidate }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r4.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r3.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r2.yml'
          git rm --ignore-unmatch '.github/workflows/JACoB-SDK10-GitHub-Web-Bootstrap.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-prepare.yml'
          git add -A
          git commit -m "JACoB 0.2.12-alpha SDK 10 frozen Vision calibration, generic Vision tabs, hidden OCR, privacy matte, and No Capture"
          git push origin "HEAD:${{ github.ref_name }}"
