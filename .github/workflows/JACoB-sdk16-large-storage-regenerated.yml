      - name: Apply SDK16 large-storage patch
        shell: bash
        run: |
          python3 /tmp/apply_sdk16.py
          gofmt -w \
            internal/tabstorage/*.go \
            internal/core/server.go \
            internal/buildinfo/version.go \
            cmd/jacob/main.go

      - name: Validate generated source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Version    = "0.2.21-alpha"' internal/buildinfo/version.go
          grep -Fq 'SDKVersion = 16' internal/buildinfo/version.go
          grep -Fq 'api:Object.freeze({version:16})' internal/webui/assets/app.js
          grep -Fq 'storage:Object.freeze({' internal/webui/assets/app.js
          grep -Fq '"storage": (r"\bElite\.storage\b",),' scripts/process_community_submission.py
          node --check internal/webui/assets/app.js
          python3 -m py_compile \
            scripts/validate_community_registry.py \
            scripts/process_community_submission.py
          python3 scripts/validate_community_registry.py
          python3 - <<'PYTEST'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/process_community_submission.py')
          spec = importlib.util.spec_from_file_location('community_submission', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.detect_capabilities('<script>Elite.storage.info()</script>') == ['storage']
          print('community storage capability detection: OK')
          PYTEST
          if compgen -G 'internal/webui/*.test.cjs' > /dev/null; then
            node --test internal/webui/*.test.cjs
          fi
          CGO_ENABLED=1 go test ./...
          git diff --check

      - name: Show patch summary
        shell: bash
        run: |
          git status --short
          git diff --stat

      - name: Commit SDK16 storage update
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "JACoB Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            RELEASE-NOTES-0.2.21-alpha.md \
            docs \
            internal \
            cmd \
            scripts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add SDK16 large local tab storage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
