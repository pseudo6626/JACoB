      - name: Repair and verify Vision standard-library imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('internal/vision/inspect.go')
          text = path.read_text(encoding='utf-8')

          if 'errors.' in text:
              match = re.search(r'import\s*\((.*?)\n\)', text, re.S)
              if not match:
                  raise SystemExit('inspect.go uses errors but has no import block')
              block = match.group(1)
              if '"errors"' not in block:
                  replacement = 'import (\n\t"errors"' + block + '\n)'
                  text = text[:match.start()] + replacement + text[match.end():]
                  path.write_text(text, encoding='utf-8')
          PY

