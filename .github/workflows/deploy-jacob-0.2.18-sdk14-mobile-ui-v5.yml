          JACOB_EOF
          python /tmp/jacob-mobile-ui.py

      - name: Format patched Go sources
        run: |
          gofmt -w \
            internal/platform/focus_linux_x11.go \
            internal/platform/capture_linux_x11.go \
            internal/platform/recorder_linux.go \
            internal/platform/overlay_linux.go \
            internal/platform/overlay.go \
            internal/platform/capture.go \
            internal/control/control.go \
            internal/control/control_release_test.go \
            internal/vision/ocr_linux.go \
            internal/vision/ocr_other.go \
            internal/vision/ocr_info_windows.go \
            internal/vision/tracker.go \
            internal/vision/inspect.go \
            internal/core/platform_info.go \
            internal/core/server.go \
            internal/buildinfo/version.go

      - name: Validate sources and SDK contract
        run: |
          set -euo pipefail

          must_have() {
            local needle="$1"
            local file="$2"
            if ! grep -Fq -- "$needle" "$file"; then
              echo "::error file=$file::Missing expected SDK14 marker: $needle"
              exit 1
            fi
          }

          must_have_ci() {
            local needle="$1"
            local file="$2"
            if ! grep -Fqi -- "$needle" "$file"; then
              echo "::error file=$file::Missing expected SDK14 marker (case-insensitive): $needle"
              exit 1
            fi
          }

          must_not_have() {
            local needle="$1"
            local file="$2"
            if grep -Fq -- "$needle" "$file"; then
              echo "::error file=$file::Unexpected stale marker remains: $needle"
              exit 1
            fi
          }

          echo "Checking whitespace and JavaScript syntax..."
          git diff --check
          node --check internal/webui/assets/app.js

          echo "Checking responsive shell..."
          must_have 'JACoB responsive shell 0.2.18' internal/webui/assets/styles.css
          must_have '--online:#62d492' internal/webui/assets/styles.css
          must_have 'viewport-fit=cover' internal/webui/assets/index.html
          must_have 'interactive-widget=resizes-content' internal/webui/assets/index.html
          must_have 'aria-live="polite"' internal/webui/assets/index.html
          must_have 'keepActiveNavVisible' internal/webui/assets/app.js
          must_have 'aria-current' internal/webui/assets/app.js

          echo "Checking shell scripts..."
          bash -n packaging/flatpak/jacob-flatpak-launch
          bash -n packaging/flatpak/jacob-steam-integrate

          echo "Checking SDK14/version markers..."
          must_have 'Version    = "0.2.18-alpha"' internal/buildinfo/version.go
          must_have 'Display    = "Alpha 0.2.18 SDK14"' internal/buildinfo/version.go
          must_have 'api:Object.freeze({version:14})' internal/webui/assets/app.js
          must_have 'system.performance' internal/webui/assets/app.js
          must_have 'system.capabilities' internal/webui/assets/app.js
          must_have 'bindings.releaseAll' internal/webui/assets/app.js
          must_have 'input.releaseAll' internal/webui/assets/app.js

          echo "Checking Linux/Steam Deck backends..."
          must_have 'linux-x11-gamescope-transient-hud' internal/platform/overlay_linux.go
          must_have 'linux-x11-xcomposite-elite-window' internal/platform/capture_linux_x11.go
          must_have 'cacheWindowMs' internal/platform/capture_linux_x11.go
          must_have 'linux-evdev' internal/platform/recorder_linux.go
          must_have_ci 'jacob virtual keyboard' internal/platform/recorder_linux.go
          must_have 'GAMESCOPE_FOCUSED_APP_GFX' internal/platform/focus_linux_x11.go
          must_have 'ev.pid == os.Getpid()' internal/platform/focus_linux_x11.go
          must_have 'touch-action:none' internal/webui/assets/app.js
          must_have 'JACOB_TESSERACT' packaging/flatpak/jacob-steam-integrate
          must_have 'JACoB Steam Deck input access' packaging/flatpak/jacob-flatpak-launch
          must_have 'libxcomposite-dev' .github/workflows/build-releases.yml
          must_not_have 'vision inspection rate limited' internal/vision/inspect.go
          must_have '"errors"' internal/vision/inspect.go

          echo "SDK14 source contract checks passed."

      - name: Compile/test Linux platform backends
        env:
          CGO_ENABLED: '1'
        run: go test ./internal/platform

      - name: Compile/test Vision and Spatial
        env:
          CGO_ENABLED: '1'
        run: go test ./internal/vision ./internal/spatial

      - name: Test all Go packages
        env:
          CGO_ENABLED: '1'
        run: go test ./...

      - name: Compile and test Windows SDK14 paths
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-sdk14-windows.exe ./cmd/jacob
          go build -trimpath -o /tmp/JACoB-Setup-sdk14-windows.exe ./cmd/installer

      - name: Build and inspect Steam Deck binary
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/JACoB-sdk14-deck ./cmd/jacob
          ldd /tmp/JACoB-sdk14-deck | tee /tmp/jacob-sdk14-ldd.txt
          ! grep -q 'not found' /tmp/jacob-sdk14-ldd.txt
          grep -q 'libXcomposite' /tmp/jacob-sdk14-ldd.txt
          strings /tmp/JACoB-sdk14-deck | grep -Fq 'linux-x11-gamescope-transient-hud'
          strings /tmp/JACoB-sdk14-deck | grep -Fq 'linux-x11-xcomposite-elite-window'
          strings /tmp/JACoB-sdk14-deck | grep -Fq 'linux-evdev'
          strings /tmp/JACoB-sdk14-deck | grep -Fq 'GAMESCOPE_FOCUSED_APP_GFX'
          strings /tmp/JACoB-sdk14-deck | grep -Fq '0.2.18-alpha'

      - name: Commit tested SDK14 source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GITHUB_TOKEN cannot create/update workflow files. The source patch is
          # fully tested above; keep the repository's existing release workflow
          # unchanged and build this release directly below.
          git restore -- .github/workflows/build-releases.yml

          git add -A
          if git diff --cached --quiet; then
            echo "SDK14 source patch is already present."
          else
            git commit -m "Ship SDK14 platform support and responsive UI"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Build 0.2.18 release assets directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          v='0.2.18-alpha'
          mkdir -p dist

          echo "Building Windows assets..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-H=windowsgui" \
            -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" \
            -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob

          cp "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          cp "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          trap 'rm -f cmd/installer/payload/JACoB.exe cmd/installer/payload/JACoB-no-capture.exe' EXIT
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-H=windowsgui" \
            -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
          rm -f cmd/installer/payload/JACoB.exe cmd/installer/payload/JACoB-no-capture.exe
          trap - EXIT

          echo "Building Linux assets..."
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags "norecorder,nocapture" \
            -o "dist/JACoB-$v-linux-amd64-no-capture" ./cmd/jacob

          ldd "dist/JACoB-$v-linux-amd64" | tee dist/linux-ldd.txt
          ! grep -q 'not found' dist/linux-ldd.txt
          grep -q 'libXcomposite' dist/linux-ldd.txt

          echo "Preparing bundled OCR runtime..."
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )
          packaging/flatpak/tesseract-appdir/AppRun --version
          packaging/flatpak/tesseract-appdir/AppRun --list-langs | grep -Fxq eng

          echo "Building Steam Deck Flatpak..."
          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          echo "Generating checksums..."
          (
            cd dist
            sha256sum \
              "JACoB-$v-win-x64.exe" \
              "JACoB-$v-win-x64-portable.exe" \
              "JACoB-$v-win-x64-no-capture.exe" \
              "JACoB-$v-linux-amd64" \
              "JACoB-$v-linux-amd64-no-capture" \
              "JACoB-$v-SteamDeck.flatpak" \
              > SHA256SUMS.txt
          )

          echo "Creating/updating draft release..."
          tag="v$v"
          target="$(git rev-parse HEAD)"
          notes="RELEASE-NOTES-$v.md"
          assets=(
            "dist/JACoB-$v-win-x64.exe"
            "dist/JACoB-$v-win-x64-portable.exe"
            "dist/JACoB-$v-win-x64-no-capture.exe"
            "dist/JACoB-$v-linux-amd64"
            "dist/JACoB-$v-linux-amd64-no-capture"
            "dist/JACoB-$v-SteamDeck.flatpak"
            "dist/SHA256SUMS.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$tag" --draft --prerelease \
                --title "JACoB $v" --notes-file "$notes"
            else
              gh release edit "$tag" --draft --prerelease \
                --title "JACoB $v"
            fi
          else
            if [[ -f "$notes" ]]; then
              gh release create "$tag" "${assets[@]}" \
                --target "$target" --draft --prerelease \
                --title "JACoB $v" --notes-file "$notes"
            else
              gh release create "$tag" "${assets[@]}" \
                --target "$target" --draft --prerelease \
                --title "JACoB $v" \
                --notes "JACoB 0.2.18-alpha SDK14 automated release. Test before publishing."
            fi
          fi

          echo "Draft release ready: $tag"
