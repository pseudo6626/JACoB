      - name: Patch core and packaging
        run: |
          set -euo pipefail
          python /tmp/apply_deck_platform_patch.py

          # Catch generator escaping mistakes before gofmt so the failing source is visible.
          python - <<'PY'
          from pathlib import Path
          p = Path("internal/core/server.go")
          t = p.read_text(encoding="utf-8")
          bad = [(i, line) for i, line in enumerate(t.splitlines(), 1) if line.startswith(r"\t")]
          if bad:
              for i, line in bad[:80]:
                  print(f"server.go:{i}: literal-backslash-tab: {line}")
              raise SystemExit("patch generator emitted literal \t sequences into Go source")
          start = t.find("func (s *Server) handleDeckHUDState(")
          if start < 0:
              raise SystemExit("Deck HUD handler missing after patch")
          end = t.find("func (s *Server) handleHealth(", start)
          print(t[start:end])
          PY

          gofmt -w \
            internal/platform/overlay.go \
            internal/platform/overlay_linux.go \
            internal/platform/overlay_linux_bridge.go \
            internal/platform/capture_linux_gamescope.go \
            internal/core/server.go

      - name: Build Decky HUD2 renderer
        working-directory: packaging/decky/JACoB-HUD
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build
          test -s dist/index.js
          python -m py_compile main.py

          rm -rf ../../flatpak/JACoB-HUD
          mkdir -p ../../flatpak/JACoB-HUD
          cp plugin.json main.py ../../flatpak/JACoB-HUD/
          cp -a dist ../../flatpak/JACoB-HUD/

      - name: Compile host PipeWire helper
        run: |
          set -euo pipefail
          cc -O2 -Wall -Wextra -Werror \
            packaging/flatpak/jacob-gamescope-stream.c \
            -o /tmp/jacob-gamescope-stream \
            $(pkg-config --cflags --libs libpipewire-0.3 wayland-client)
          ldd /tmp/jacob-gamescope-stream | tee /tmp/jacob-pipewire-helper-ldd.txt
          ! grep -q 'not found' /tmp/jacob-pipewire-helper-ldd.txt

      - name: Validate platform contracts
        run: |
          set -euo pipefail
          git diff --check

          grep -Fq 'linux-gamescope-pipewire-elite-v1' internal/platform/capture_linux_gamescope.go
          grep -Fq 'linux-steam-cef-hud2-bridge' internal/platform/overlay_linux_bridge.go
          grep -Fq 'type DeckOverlayBridge interface' internal/platform/overlay.go
          grep -Fq '/api/deck/hud/state' internal/core/server.go
          grep -Fq 'IsLoopback' internal/core/server.go

          grep -Fq 'SPA_FORMAT_VIDEO_gamescope_focus_appid' packaging/flatpak/jacob-gamescope-stream.c
          grep -Fq 'JACOB_DEFAULT_APPID 359320' packaging/flatpak/jacob-gamescope-stream.c
          grep -Fq 'gamescope_pipewire' packaging/flatpak/jacob-gamescope-stream.c

          grep -Fq 'AddMinimumCompositionStateRequest' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'routerHook.addGlobalComponent' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'paintOrder="stroke fill"' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'text-before-edge' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'window.innerWidth' packaging/decky/JACoB-HUD/src/index.tsx
          test -s packaging/flatpak/JACoB-HUD/dist/index.js

          ! grep -Fq 'take_screenshot' internal/platform/capture_linux_gamescope.go
          ! grep -Fq 'gamescopectl' internal/platform/capture_linux_gamescope.go

      - name: Test Linux platform and repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision ./internal/spatial
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-deck-platform-windows.exe ./cmd/jacob
          go build -trimpath -o /tmp/JACoB-Setup-deck-platform-windows.exe ./cmd/installer

      - name: Build Linux core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -o dist/JACoB-0.2.18-alpha-linux-amd64 ./cmd/jacob
          ldd dist/JACoB-0.2.18-alpha-linux-amd64 | tee /tmp/jacob-deck-platform-ldd.txt
          ! grep -q 'not found' /tmp/jacob-deck-platform-ldd.txt
          strings dist/JACoB-0.2.18-alpha-linux-amd64 | grep -Fq 'linux-gamescope-pipewire-elite-v1'
          strings dist/JACoB-0.2.18-alpha-linux-amd64 | grep -Fq 'linux-steam-cef-hud2-bridge'

      - name: Prepare OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )
          packaging/flatpak/tesseract-appdir/AppRun --version
          packaging/flatpak/tesseract-appdir/AppRun --list-langs | grep -Fxq eng

      - name: Build and validate Steam Deck Flatpak before commit
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          test -s "dist/JACoB-$v-SteamDeck.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-PIPEWIRE-HUD2-SHA256.txt

      - name: Commit tested Deck platform update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf packaging/decky/JACoB-HUD/node_modules
          rm -rf packaging/decky/JACoB-HUD/dist
          rm -f packaging/decky/JACoB-HUD/pnpm-lock.yaml

          git add \
            internal/platform/overlay.go \
            internal/platform/overlay_linux.go \
            internal/platform/overlay_linux_bridge.go \
            internal/platform/capture_linux_gamescope.go \
            internal/core/server.go \
            packaging/decky/JACoB-HUD \
            packaging/flatpak/JACoB-HUD \
            packaging/flatpak/jacob-gamescope-stream.c \
            packaging/flatpak/com.pseudosci.JACoB.yml \
            packaging/flatpak/jacob-flatpak-launch \
            packaging/flatpak/jacob-steam-integrate

          if git diff --cached --quiet; then
            echo "Deck platform update already present."
          else
            git commit -m "Use PipeWire capture and Steam CEF HUD on Deck"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Upload replacement Deck release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-PIPEWIRE-HUD2-SHA256.txt" --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-PIPEWIRE-HUD2-SHA256.txt" \
              --target "$(git rev-parse HEAD)" --draft --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck PipeWire capture + Steam CEF HUD2 renderer test build."
          fi

          echo "Replacement Deck asset uploaded to draft release $tag"
