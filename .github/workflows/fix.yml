name: Deploy JACoB 0.2.18 Deck PipeWire + HUD2 Bridge v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxfixes-dev libxcomposite-dev \
            libpipewire-0.3-dev libwayland-dev \
            flatpak flatpak-builder
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install Deck platform source files
        run: |
          set -euo pipefail
          mkdir -p "packaging/flatpak"
