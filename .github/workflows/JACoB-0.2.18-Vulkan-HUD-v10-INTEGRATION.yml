          cat > internal/platform/capture_linux_vulkan.go <<'GO_CAPTURE'
          //go:build linux && !nocapture && cgo
          
          package platform
          
          import (
          	"encoding/binary"
          	"fmt"
          	"os"
          	"path/filepath"
          	"strconv"
          	"strings"
          	"sync"
          	"time"
          )
          
          const (
          	vulkanCaptureMagic   uint32 = 0x3246434a // JCF2
          	vulkanCaptureVersion uint32 = 2
          	vulkanCaptureRGBA    uint32 = 1
          	vulkanCaptureBGRA    uint32 = 2
          )
          
          type vulkanCleanCapture struct {
          	mu          sync.Mutex
          	nextSeq     uint64
          	requests    uint64
          	frames      uint64
          	failures    uint64
          	cacheHits   uint64
          	lastLatency time.Duration
          	lastError   string
          	cached      GameFrame
          }
          
          type vulkanPreferredCapture struct {
          	vulkan   *vulkanCleanCapture
          	fallback CaptureDriver
          }
          
          func newVulkanPreferredCapture(fallback CaptureDriver) CaptureDriver {
          	return &vulkanPreferredCapture{vulkan: &vulkanCleanCapture{}, fallback: fallback}
          }
          
          func (m *vulkanPreferredCapture) Name() string {
          	if m.vulkan.Available() {
          		return m.vulkan.Name()
          	}
          	return m.fallback.Name()
          }
          
          func (m *vulkanPreferredCapture) Available() bool {
          	return m.vulkan.Available() || m.fallback.Available()
          }
          
          func (m *vulkanPreferredCapture) CaptureFrame(maxWidth int, intent CaptureIntent) (GameFrame, error) {
          	if m.vulkan.Available() {
          		return m.vulkan.CaptureFrame(maxWidth, intent)
          	}
          	return m.fallback.CaptureFrame(maxWidth, intent)
          }
          
          func (m *vulkanPreferredCapture) CaptureJPEG(maxWidth int, quality int) ([]byte, CaptureInfo, error) {
          	if m.vulkan.Available() {
          		return m.vulkan.CaptureJPEG(maxWidth, quality)
          	}
          	return m.fallback.CaptureJPEG(maxWidth, quality)
          }
          
          func (m *vulkanPreferredCapture) CaptureStats() map[string]any {
          	out := map[string]any{"activeBackend": m.Name()}
          	out["vulkanPreHUD"] = m.vulkan.CaptureStats()
          	if s, ok := m.fallback.(CaptureStatsProvider); ok {
          		out["fallback"] = s.CaptureStats()
          	}
          	return out
          }
          
          func (v *vulkanCleanCapture) Name() string { return "linux-vulkan-prehud-elite-v2" }
          
          func (v *vulkanCleanCapture) Available() bool {
          	ok, _ := vulkanRendererReady()
          	return ok
          }
          
          func (v *vulkanCleanCapture) requestPath() string {
          	return filepath.Join(vulkanRuntimeDir(), "capture.request")
          }
          func (v *vulkanCleanCapture) framePath() string {
          	return filepath.Join(vulkanRuntimeDir(), "capture.frame")
          }
          
          func (v *vulkanCleanCapture) CaptureFrame(maxWidth int, intent CaptureIntent) (GameFrame, error) {
          	if !linuxGamescopeEliteDirectlyFocused() {
          		return blankGameFrame(v.Name(), 1280, 800,
          			"Elite is not the directly presented Gamescope client; pre-HUD frame withheld"), nil
          	}
          	if !v.Available() {
          		return GameFrame{}, fmt.Errorf("Vulkan pre-HUD capture is not connected")
          	}
          
          	v.mu.Lock()
          	if intent == CaptureIntentLive && !v.cached.CapturedAt.IsZero() && time.Since(v.cached.CapturedAt) <= 90*time.Millisecond {
          		if f, ok := linuxCachedFrameForWidth(v.cached, maxWidth); ok {
          			v.cacheHits++
          			v.mu.Unlock()
          			return f, nil
          		}
          	}
          	v.nextSeq++
          	if v.nextSeq == 0 {
          		v.nextSeq++
          	}
          	seq := uint64(time.Now().UnixNano()) ^ v.nextSeq
          	v.requests++
          	v.mu.Unlock()
          
          	started := time.Now()
          	if err := os.MkdirAll(vulkanRuntimeDir(), 0o700); err != nil {
          		v.fail(err)
          		return GameFrame{}, err
          	}
          	req := []byte(strconv.FormatUint(seq, 10) + "\n")
          	reqPath := v.requestPath()
          	tmp := fmt.Sprintf("%s.tmp.%d", reqPath, os.Getpid())
          	if err := os.WriteFile(tmp, req, 0o600); err != nil {
          		v.fail(err)
          		return GameFrame{}, err
          	}
          	if err := os.Rename(tmp, reqPath); err != nil {
          		_ = os.Remove(tmp)
          		v.fail(err)
          		return GameFrame{}, err
          	}
          
          	timeout := 900 * time.Millisecond
          	if intent == CaptureIntentCalibration {
          		timeout = 1200 * time.Millisecond
          	}
          	deadline := time.Now().Add(timeout)
          	var lastErr error
          	for time.Now().Before(deadline) {
          		frame, gotSeq, err := readVulkanCaptureFrame(v.framePath())
          		if err == nil && gotSeq == seq {
          			if !linuxGamescopeEliteDirectlyFocused() {
          				return blankGameFrame(v.Name(), frame.Width, frame.Height,
          					"Elite focus changed while acquiring the pre-HUD frame; frame discarded"), nil
          			}
          			frame.Driver = v.Name()
          			frame.CapturedAt = time.Now().UTC()
          			frame.Verified = true
          			frame.Foreground = true
          			frame.SourceWidth = frame.Width
          			frame.SourceHeight = frame.Height
          			if linuxFrameLooksBlank(frame.Pix, frame.Width, frame.Height) {
          				return blankGameFrame(v.Name(), frame.Width, frame.Height,
          					"Vulkan pre-HUD frame was effectively black; Vision results withheld"), nil
          			}
          			v.mu.Lock()
          			v.frames++
          			v.lastLatency = time.Since(started)
          			v.lastError = ""
          			v.cached = frame
          			v.mu.Unlock()
          			scaled, _ := linuxCachedFrameForWidth(frame, maxWidth)
          			return scaled, nil
          		}
          		if err != nil && !os.IsNotExist(err) {
          			lastErr = err
          		}
          		time.Sleep(8 * time.Millisecond)
          	}
          
          	if lastErr == nil {
          		lastErr = fmt.Errorf("timed out waiting for Vulkan pre-HUD frame sequence %d", seq)
          	}
          	v.fail(lastErr)
          	return GameFrame{}, lastErr
          }
          
          func (v *vulkanCleanCapture) CaptureJPEG(maxWidth int, quality int) ([]byte, CaptureInfo, error) {
          	frame, err := v.CaptureFrame(maxWidth, CaptureIntentLive)
          	if err != nil {
          		return nil, CaptureInfo{Driver: v.Name(), Blanked: true, Reason: err.Error()}, err
          	}
          	return EncodeGameFrameJPEG(frame, quality)
          }
          
          func (v *vulkanCleanCapture) fail(err error) {
          	v.mu.Lock()
          	defer v.mu.Unlock()
          	v.failures++
          	if err != nil {
          		v.lastError = err.Error()
          	}
          }
          
          func (v *vulkanCleanCapture) CaptureStats() map[string]any {
          	v.mu.Lock()
          	defer v.mu.Unlock()
          	ready, detail := vulkanRendererReady()
          	age := int64(-1)
          	if !v.cached.CapturedAt.IsZero() {
          		age = time.Since(v.cached.CapturedAt).Milliseconds()
          	}
          	return map[string]any{
          		"driver":           v.Name(),
          		"transport":        "vulkan-pre-hud-runtime-file",
          		"ready":            ready,
          		"renderer":         detail,
          		"requests":         v.requests,
          		"frames":           v.frames,
          		"failures":         v.failures,
          		"cacheHits":        v.cacheHits,
          		"cachedFrameAgeMs": age,
          		"lastLatencyMs":    v.lastLatency.Milliseconds(),
          		"lastError":        v.lastError,
          		"eliteOnly":        true,
          		"preHUD":           true,
          	}
          }
          
          func readVulkanCaptureFrame(path string) (GameFrame, uint64, error) {
          	b, err := os.ReadFile(path)
          	if err != nil {
          		return GameFrame{}, 0, err
          	}
          	if len(b) < 32 {
          		return GameFrame{}, 0, fmt.Errorf("Vulkan capture frame header is truncated")
          	}
          	magic := binary.LittleEndian.Uint32(b[0:4])
          	version := binary.LittleEndian.Uint32(b[4:8])
          	seq := binary.LittleEndian.Uint64(b[8:16])
          	width := binary.LittleEndian.Uint32(b[16:20])
          	height := binary.LittleEndian.Uint32(b[20:24])
          	format := binary.LittleEndian.Uint32(b[24:28])
          	payload := binary.LittleEndian.Uint32(b[28:32])
          	if magic != vulkanCaptureMagic || version != vulkanCaptureVersion {
          		return GameFrame{}, seq, fmt.Errorf("Vulkan capture frame has invalid magic/version")
          	}
          	if width == 0 || height == 0 || width > 8192 || height > 8192 || payload != width*height*4 {
          		return GameFrame{}, seq, fmt.Errorf("Vulkan capture frame dimensions are invalid")
          	}
          	if len(b) != 32+int(payload) {
          		return GameFrame{}, seq, fmt.Errorf("Vulkan capture frame payload is truncated")
          	}
          	pix := append([]byte(nil), b[32:]...)
          	switch format {
          	case vulkanCaptureRGBA:
          	case vulkanCaptureBGRA:
          		for i := 0; i+3 < len(pix); i += 4 {
          			pix[i], pix[i+2] = pix[i+2], pix[i]
          		}
          	default:
          		return GameFrame{}, seq, fmt.Errorf("Vulkan capture frame uses unsupported pixel format %d", format)
          	}
          	return GameFrame{
          		Pix:          pix,
          		Width:        int(width),
          		Height:       int(height),
          		Stride:       int(width) * 4,
          		Format:       PixelFormatRGBA8,
          		SourceWidth:  int(width),
          		SourceHeight: int(height),
          		Verified:     true,
          		Foreground:   true,
          	}, seq, nil
          }
          
          func vulkanCaptureReadyDetail() string {
          	_, detail := vulkanRendererReady()
          	return strings.TrimSpace(detail)
          }
          GO_CAPTURE
          
          cat > internal/platform/overlay_linux_bridge.go <<'GO_BRIDGE'
          //go:build linux && cgo
          
          package platform
          
          import (
          	"fmt"
          	"os"
          	"path/filepath"
          )
          
          func deckGamescopePresent() bool {
          	runtimeDir := os.Getenv("XDG_RUNTIME_DIR")
          	if runtimeDir == "" {
          		runtimeDir = fmt.Sprintf("/run/user/%d", os.Getuid())
          	}
          	st, err := os.Stat(filepath.Join(runtimeDir, "gamescope-0"))
          	return err == nil && st.Mode()&os.ModeSocket != 0
          }
          
          func newOverlayDriver() OverlayDriver {
          	if deckGamescopePresent() {
          		return newVulkanOverlayDriver()
          	}
          	return newLinuxNativeOverlayDriver()
          }
          GO_BRIDGE
          
          cat > internal/platform/vulkan_transport_linux_test.go <<'GO_TEST'
          //go:build linux && cgo && !nocapture
          
          package platform
          
          import (
          	"encoding/binary"
          	"os"
          	"path/filepath"
          	"testing"
          )
          
          func TestVulkanHUDTransportWritesTriangleStream(t *testing.T) {
          	dir := t.TempDir()
          	t.Setenv("JACOB_VK_RUNTIME_DIR", dir)
          	o := newVulkanOverlayDriver()
          	if err := o.SetLayer("test", OverlayScene{Items: []OverlayItem{{
          		Type: "rect", X: 0.1, Y: 0.2, W: 0.25, H: 0.1, Fill: "#FF6600CC",
          	}}}); err != nil {
          		t.Fatal(err)
          	}
          	b, err := os.ReadFile(filepath.Join(dir, "overlay.vertices"))
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(b) < 40 {
          		t.Fatalf("transport too short: %d", len(b))
          	}
          	if got := binary.LittleEndian.Uint32(b[0:4]); got != vulkanHUDMagic {
          		t.Fatalf("magic=%#x", got)
          	}
          	if got := binary.LittleEndian.Uint32(b[4:8]); got != vulkanHUDVersion {
          		t.Fatalf("version=%d", got)
          	}
          	count := binary.LittleEndian.Uint32(b[20:24])
          	if count < 6 || count%3 != 0 {
          		t.Fatalf("unexpected vertex count %d", count)
          	}
          	if want := 40 + int(count)*24; len(b) != want {
          		t.Fatalf("transport bytes=%d want=%d", len(b), want)
          	}
          }
          
          func TestReadVulkanCaptureFrameConvertsBGRA(t *testing.T) {
          	path := filepath.Join(t.TempDir(), "capture.frame")
          	b := make([]byte, 32+8)
          	binary.LittleEndian.PutUint32(b[0:4], vulkanCaptureMagic)
          	binary.LittleEndian.PutUint32(b[4:8], vulkanCaptureVersion)
          	binary.LittleEndian.PutUint64(b[8:16], 99)
          	binary.LittleEndian.PutUint32(b[16:20], 2)
          	binary.LittleEndian.PutUint32(b[20:24], 1)
          	binary.LittleEndian.PutUint32(b[24:28], vulkanCaptureBGRA)
          	binary.LittleEndian.PutUint32(b[28:32], 8)
          	copy(b[32:], []byte{3, 2, 1, 255, 30, 20, 10, 128})
          	if err := os.WriteFile(path, b, 0o600); err != nil {
          		t.Fatal(err)
          	}
          	frame, seq, err := readVulkanCaptureFrame(path)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if seq != 99 || frame.Width != 2 || frame.Height != 1 {
          		t.Fatalf("seq/dimensions = %d %dx%d", seq, frame.Width, frame.Height)
          	}
          	want := []byte{1, 2, 3, 255, 10, 20, 30, 128}
          	for i := range want {
          		if frame.Pix[i] != want[i] {
          			t.Fatalf("pixel[%d]=%d want=%d", i, frame.Pix[i], want[i])
          		}
          	}
          }
          GO_TEST
          
          python3 - <<'PY_PATCH'
          from pathlib import Path
          
          p = Path('internal/platform/capture_linux_gamescope.go')
          s = p.read_text(encoding='utf-8')
          old = '''func newLinuxCaptureDriver() CaptureDriver {
          	return &linuxCaptureMux{
          		pipewire: &pipewireCapture{},
          		x11:      &linuxCapture{},
          	}
          }
          '''
          new = '''func newLinuxCaptureDriver() CaptureDriver {
          	fallback := &linuxCaptureMux{
          		pipewire: &pipewireCapture{},
          		x11:      &linuxCapture{},
          	}
          	return newVulkanPreferredCapture(fallback)
          }
          '''
          if old not in s:
              raise SystemExit('capture constructor anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          
          p = Path('cmd/jacob/main.go')
          s = p.read_text(encoding='utf-8')
          old = 'if boolDefault(os.Getenv("JACOB_OPEN_BROWSER"), runtime.GOOS == "windows") {'
          new = 'if boolDefault(os.Getenv("JACOB_OPEN_BROWSER"), defaultOpenBrowser()) {'
          if old not in s:
              raise SystemExit('browser default anchor not found')
          s = s.replace(old, new, 1)
          anchor = '''func openBrowser(url string) {
          '''
          helper = '''func defaultOpenBrowser() bool {
          	if runtime.GOOS == "windows" {
          		return true
          	}
          	if runtime.GOOS == "linux" {
          		return strings.TrimSpace(os.Getenv("DISPLAY")) != "" || strings.TrimSpace(os.Getenv("WAYLAND_DISPLAY")) != ""
          	}
          	return false
          }
          
          '''
          if 'func defaultOpenBrowser() bool' not in s:
              if anchor not in s:
                  raise SystemExit('openBrowser anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY_PATCH
          
          gofmt -w internal/platform/overlay_linux_vulkan.go internal/platform/capture_linux_vulkan.go internal/platform/overlay_linux_bridge.go internal/platform/vulkan_transport_linux_test.go internal/platform/capture_linux_gamescope.go cmd/jacob/main.go
          
          grep -Fq 'newVulkanPreferredCapture' internal/platform/capture_linux_gamescope.go
          
          grep -Fq 'defaultOpenBrowser()' cmd/jacob/main.go

      - name: Replace Steam Deck packaging with v10 installer
        run: |
          set -euo pipefail
          
          cat > packaging/flatpak/jacob-flatpak-launch <<'FLAT_LAUNCH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          
          HOST_HOME="$(flatpak-spawn --host sh -lc 'printf %s "$HOME"')"
          [[ -n "$HOST_HOME" ]] || { echo "Could not resolve the Steam Deck home directory." >&2; exit 1; }
          HOST_UID="$(flatpak-spawn --host id -u)"
          HOST_RUNTIME="/run/user/$HOST_UID"
          HOST_DIR="$HOST_HOME/.local/share/JACoB"
          HOST_BIN="$HOST_DIR/JACoB"
          HOST_HELPER="$HOST_DIR/jacob-gamescope-stream"
          HOST_VK_DIR="$HOST_DIR/vulkan-hud"
          HOST_VK_LIB="$HOST_VK_DIR/libVK_LAYER_JACOB_hud.so"
          HOST_VK_VERT="$HOST_VK_DIR/overlay.vert.spv"
          HOST_VK_FRAG="$HOST_VK_DIR/overlay.frag.spv"
          HOST_VK_ENABLED="$HOST_VK_DIR/enabled"
          VK_MANIFEST_DIR="$HOST_HOME/.local/share/vulkan/implicit_layer.d"
          VK_MANIFEST="$VK_MANIFEST_DIR/VK_LAYER_JACOB_hud.json"
          OCR_DIR="$HOST_DIR/ocr/tesseract"
          INSTALL_ID_FILE="$HOST_DIR/.flatpak-install-id"
          PACKAGED_VERSION="$(cat /app/share/jacob/VERSION 2>/dev/null || echo unknown)"
          PACKAGED_BIN_HASH="$(sha256sum /app/libexec/JACoB | awk '{print $1}')"
          PACKAGED_HELPER_HASH="$(sha256sum /app/libexec/jacob-gamescope-stream | awk '{print $1}')"
          PACKAGED_VK_HASH="$(sha256sum /app/share/jacob/vulkan-hud/libVK_LAYER_JACOB_hud.so /app/share/jacob/vulkan-hud/overlay.vert.spv /app/share/jacob/vulkan-hud/overlay.frag.spv | sha256sum | awk '{print $1}')"
          PACKAGED_OCR_HASH="$(sha256sum /app/libexec/tesseract/AppRun | awk '{print $1}')"
          INSTALL_ID="v10:${PACKAGED_VERSION}:${PACKAGED_BIN_HASH}:${PACKAGED_HELPER_HASH}:${PACKAGED_VK_HASH}:${PACKAGED_OCR_HASH}"
          LOG_DIR="$HOST_HOME/.config/JACoB"
          LOG_FILE="$LOG_DIR/deck-install.log"
          
          mkdir -p "$LOG_DIR"
          
          log_install() {
            printf '[%s] %s\n' "$(date -Is)" "$*" >> "$LOG_FILE"
          }
          
          stop_old_host_jacob() {
            flatpak-spawn --host sh -lc '
              target="$HOME/.local/share/JACoB/JACoB"
              found=0
              for p in /proc/[0-9]*; do
                exe="$(readlink -f "$p/exe" 2>/dev/null || true)"
                if [[ "$exe" == "$target" ]]; then
                  found=1
                  kill -TERM "${p##*/}" 2>/dev/null || true
                fi
              done
              if [[ "$found" == "1" ]]; then
                for _ in $(seq 1 40); do
                  live=0
                  for p in /proc/[0-9]*; do
                    exe="$(readlink -f "$p/exe" 2>/dev/null || true)"
                    [[ "$exe" == "$target" ]] && { live=1; break; }
                  done
                  [[ "$live" == "0" ]] && exit 0
                  sleep 0.1
                done
                for p in /proc/[0-9]*; do
                  exe="$(readlink -f "$p/exe" 2>/dev/null || true)"
                  [[ "$exe" == "$target" ]] && kill -KILL "${p##*/}" 2>/dev/null || true
                done
              fi
            ' >/dev/null 2>&1 || true
          }
          
          clean_managed_payload() {
            log_install "Managed payload changed; performing clean JACoB Steam Deck reinstall. User data in ~/.config/JACoB is preserved."
            stop_old_host_jacob
          
            # ~/.local/share/JACoB is installer-managed on Steam Deck. User tabs/config/pairing
            # live under ~/.config/JACoB and are intentionally untouched.
            rm -rf "$HOST_DIR"
            mkdir -p "$HOST_DIR"
          
            rm -f "$VK_MANIFEST"
            rm -rf "$HOST_HOME/homebrew/plugins/JACoB-HUD"
          
            # Remove old known wrappers/staging left by earlier Deck installers.
            rm -f "$HOST_HOME/.local/bin/run-elite-with-jacob.sh" 2>/dev/null || true
            rm -f "$HOST_HOME/.local/bin/jacob-elite-launch" 2>/dev/null || true
          }
          
          CURRENT_INSTALL_ID="$(cat "$INSTALL_ID_FILE" 2>/dev/null || true)"
          if [[ "$CURRENT_INSTALL_ID" != "$INSTALL_ID" ]]; then
            clean_managed_payload
          else
            mkdir -p "$HOST_DIR"
          fi
          
          install -m 0755 /app/libexec/JACoB "$HOST_BIN.new"
          mv -f "$HOST_BIN.new" "$HOST_BIN"
          install -m 0755 /app/libexec/jacob-gamescope-stream "$HOST_HELPER.new"
          mv -f "$HOST_HELPER.new" "$HOST_HELPER"
          
          rm -rf "$HOST_VK_DIR.new"
          mkdir -p "$HOST_VK_DIR.new"
          install -m 0755 /app/share/jacob/vulkan-hud/libVK_LAYER_JACOB_hud.so "$HOST_VK_DIR.new/libVK_LAYER_JACOB_hud.so"
          install -m 0644 /app/share/jacob/vulkan-hud/overlay.vert.spv "$HOST_VK_DIR.new/overlay.vert.spv"
          install -m 0644 /app/share/jacob/vulkan-hud/overlay.frag.spv "$HOST_VK_DIR.new/overlay.frag.spv"
          printf '%s\n' "v10" > "$HOST_VK_DIR.new/enabled"
          rm -rf "$HOST_VK_DIR"
          mv "$HOST_VK_DIR.new" "$HOST_VK_DIR"
          
          mkdir -p "$VK_MANIFEST_DIR"
          cat > "$VK_MANIFEST.new" <<EOF_MANIFEST
          {
            "file_format_version": "1.1.0",
            "layer": {
              "name": "VK_LAYER_JACOB_hud",
              "type": "GLOBAL",
              "library_path": "$HOST_VK_LIB",
              "api_version": "1.3.0",
              "implementation_version": "10",
              "description": "JACoB in-process Steam Deck HUD and clean Vision capture",
              "enable_environment": { "JACOB_VK_HUD": "1" },
              "disable_environment": { "JACOB_VK_HUD_DISABLE": "1" }
            }
          }
          EOF_MANIFEST
          mv -f "$VK_MANIFEST.new" "$VK_MANIFEST"
          
          rm -rf "$OCR_DIR.new"
          mkdir -p "$OCR_DIR.new"
          cp -a /app/libexec/tesseract/. "$OCR_DIR.new/"
          chmod +x "$OCR_DIR.new/AppRun"
          rm -rf "$OCR_DIR"
          mv "$OCR_DIR.new" "$OCR_DIR"
          
          # Old Decky HUD builds must not remain active beside the Vulkan renderer.
          rm -rf "$HOST_HOME/homebrew/plugins/JACoB-HUD" "$HOST_DIR/decky"
          
          printf '%s\n' "$INSTALL_ID" > "$INSTALL_ID_FILE"
          printf '%s\n' "$PACKAGED_VERSION" > "$HOST_DIR/.flatpak-payload-version"
          log_install "Installed JACoB ${PACKAGED_VERSION} v10 managed payload. bin=${PACKAGED_BIN_HASH} vk=${PACKAGED_VK_HASH}"
          
          if [[ "${1:-}" != "--service-only" ]]; then
            if ! flatpak-spawn --host sh -lc 'grep -Fq "JACoB Steam Deck input access" /etc/udev/rules.d/70-jacob-input.rules 2>/dev/null'; then
              log_install "Requesting one-time input-device permission setup."
              if flatpak-spawn --host pkexec sh -c 'cat > /etc/udev/rules.d/70-jacob-input.rules <<"EOF_RULES"
          # JACoB Steam Deck input access
          KERNEL=="uinput", MODE="0660", TAG+="uaccess"
          SUBSYSTEM=="input", KERNEL=="event*", ENV{ID_INPUT_KEYBOARD}=="1", MODE="0660", TAG+="uaccess"
          EOF_RULES
          udevadm control --reload-rules
          udevadm trigger --subsystem-match=input --action=change
          '; then
                log_install "Input-device permissions installed."
              else
                log_install "WARNING: input-device permission setup was declined or failed; Action Recorder may remain unavailable."
              fi
            fi
          
            JACOB_HOST_HOME="$HOST_HOME" /app/bin/jacob-steam-integrate || true
          fi
          
          if [[ "${1:-}" == "--service-only" ]]; then
            exit 0
          fi
          
          # Desktop Mode: run the host-native core without letting it launch xdg-open itself.
          # We launch the browser separately with the real desktop D-Bus/runtime environment.
          stop_old_host_jacob
          flatpak-spawn --host sh -lc '
            export JACOB_OPEN_BROWSER=0
            export JACOB_TESSERACT="$HOME/.local/share/JACoB/ocr/tesseract/AppRun"
            export JACOB_GAMESCOPE_CAPTURE_HELPER="$HOME/.local/share/JACoB/jacob-gamescope-stream"
            export JACOB_VK_RUNTIME_DIR="/run/user/$(id -u)/jacob-vk"
            exec "$HOME/.local/share/JACoB/JACoB"
          ' >/dev/null 2>&1 &
          HOST_JACOB_SPAWN=$!
          
          ready=0
          for _ in $(seq 1 100); do
            if curl -fsS --max-time 0.25 http://127.0.0.1:6626/api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          
          if [[ "$ready" == "1" ]]; then
            flatpak-spawn --host sh -lc '
              uid="$(id -u)"
              export XDG_RUNTIME_DIR="/run/user/$uid"
              export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
              if [[ -S "$XDG_RUNTIME_DIR/wayland-0" ]]; then
                export WAYLAND_DISPLAY="${WAYLAND_DISPLAY:-wayland-0}"
              fi
              export DISPLAY="${DISPLAY:-:0}"
              if command -v xdg-open >/dev/null 2>&1; then
                nohup xdg-open http://127.0.0.1:6626/ >/dev/null 2>&1 &
              elif command -v kde-open5 >/dev/null 2>&1; then
                nohup kde-open5 http://127.0.0.1:6626/ >/dev/null 2>&1 &
              fi
            ' >/dev/null 2>&1 || true
            log_install "Desktop Mode JACoB started and browser-open request issued."
          else
            log_install "WARNING: Desktop Mode JACoB did not become healthy before browser launch timeout."
          fi
          
          wait "$HOST_JACOB_SPAWN" || true
          FLAT_LAUNCH
          
          cat > packaging/flatpak/jacob-steam-integrate <<'STEAM_INTEGRATE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          
          ELITE_APP_ID="359320"
          HOST_HOME="${JACOB_HOST_HOME:-$(flatpak-spawn --host sh -lc 'printf %s "$HOME"')}"
          [[ -n "$HOST_HOME" ]] || exit 1
          HOST_DIR="$HOST_HOME/.local/share/JACoB"
          HOST_BIN="$HOST_DIR/JACoB"
          LAUNCHER="$HOST_DIR/jacob-elite-launch"
          HOOK_STAMP="$HOST_DIR/.steam-hook-v10"
          LOG_DIR="$HOST_HOME/.config/JACoB"
          LOG_FILE="$LOG_DIR/deck-install.log"
          mkdir -p "$HOST_DIR" "$LOG_DIR"
          exec >>"$LOG_FILE" 2>&1
          
          echo "[$(date -Is)] Steam integration v10 check"
          
          find_steam_root() {
            local p
            for p in "$HOST_HOME/.local/share/Steam" "$HOST_HOME/.steam/steam" "$HOST_HOME/.steam/root"; do
              [[ -d "$p/userdata" ]] && { (cd "$p" && pwd -P); return 0; }
            done
            return 1
          }
          
          select_localconfig() {
            local root="$1" file
            local -a configs=() matches=()
            while IFS= read -r -d '' file; do
              configs+=("$file")
              grep -Eq '^[[:space:]]*"359320"[[:space:]]*$' "$file" && matches+=("$file")
            done < <(find "$root/userdata" -mindepth 3 -maxdepth 3 -type f -path '*/config/localconfig.vdf' -print0 2>/dev/null)
            if (( ${#matches[@]} )); then ls -1t -- "${matches[@]}" | head -n1; return 0; fi
            if (( ${#configs[@]} )); then ls -1t -- "${configs[@]}" | head -n1; return 0; fi
            return 1
          }
          
          extract_launch_options() {
            local file="$1"
            awk -v appid="$ELITE_APP_ID" '
              function bd(s, i,c,d,q,e){d=0;q=0;e=0;for(i=1;i<=length(s);i++){c=substr(s,i,1);if(q){if(e){e=0;continue}if(c=="\\"){e=1;continue}if(c=="\"")q=0;continue}if(c=="\""){q=1;continue}if(c=="{")d++;else if(c=="}")d--}return d}
              BEGIN{p=0;a=0;dep=0}
              {l=$0;if(!a&&l~"^[[:space:]]*\"" appid "\"[[:space:]]*$"){p=1;next}if(p){if(l~/^[[:space:]]*\{[[:space:]]*$/){a=1;dep=1;p=0;next}if(l!~/^[[:space:]]*$/)p=0}if(a){if(dep==1&&l~/^[[:space:]]*"LaunchOptions"[[:space:]]*"/){v=l;sub(/^[[:space:]]*"LaunchOptions"[[:space:]]*"/,"",v);sub(/"[[:space:]]*$/,"",v);print v;exit}dep+=bd(l);if(dep<=0)exit}}
            ' "$file"
          }
          
          patch_launch_options() {
            local file="$1" replacement="$2" out="$3"
            JACOB_REPLACEMENT="$replacement" awk -v appid="$ELITE_APP_ID" '
              function ws(s){match(s,/^[[:space:]]*/);return substr(s,1,RLENGTH)}
              function bd(s, i,c,d,q,e){d=0;q=0;e=0;for(i=1;i<=length(s);i++){c=substr(s,i,1);if(q){if(e){e=0;continue}if(c=="\\"){e=1;continue}if(c=="\"")q=0;continue}if(c=="\""){q=1;continue}if(c=="{")d++;else if(c=="}")d--}return d}
              BEGIN{r=ENVIRON["JACOB_REPLACEMENT"];p=0;a=0;dep=0;fa=0;rep=0;ind=""}
              {
                l=$0
                if(!a&&l~"^[[:space:]]*\"" appid "\"[[:space:]]*$"){p=1;fa=1;print l;next}
                if(p){print l;if(l~/^[[:space:]]*\{[[:space:]]*$/){a=1;dep=1;ind=ws(l)"\t";p=0;next}if(l!~/^[[:space:]]*$/)p=0;next}
                if(a){d=bd(l);if(dep==1&&l~/^[[:space:]]*"LaunchOptions"[[:space:]]*"/){printf "%s\"LaunchOptions\"\t\t\"%s\"\n",ws(l),r;rep=1}else if(dep==1&&d<0){if(!rep){printf "%s\"LaunchOptions\"\t\t\"%s\"\n",ind,r;rep=1}print l}else print l;dep+=d;if(dep<=0)a=0;next}
                print l
              }
              END{if(!fa)exit 42;if(!rep)exit 43}
            ' "$file" > "$out"
          }
          
          # Always rewrite this file, even when Steam launch options already point here.
          # This prevents an old host-side launcher surviving a Flatpak update.
          cat > "$LAUNCHER" <<'LAUNCH'
          #!/usr/bin/env bash
          set -u
          
          JACOB_BIN="$HOME/.local/share/JACoB/JACoB"
          JACOB_PID=""
          JACOB_OWNED=0
          GAME_PID=""
          VK_DIR="$HOME/.local/share/JACoB/vulkan-hud"
          VK_RUNTIME="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/jacob-vk"
          
          jacob_healthy() {
            command -v curl >/dev/null 2>&1 && curl -fsS --max-time 0.5 http://127.0.0.1:6626/api/health >/dev/null 2>&1
          }
          
          start_jacob() {
            if jacob_healthy; then
              return 0
            fi
            if [[ ! -x "$JACOB_BIN" ]]; then
              return 0
            fi
            JACOB_OPEN_BROWSER=0 \
            JACOB_TESSERACT="$HOME/.local/share/JACoB/ocr/tesseract/AppRun" \
            JACOB_GAMESCOPE_CAPTURE_HELPER="$HOME/.local/share/JACoB/jacob-gamescope-stream" \
            JACOB_VK_RUNTIME_DIR="$VK_RUNTIME" \
            JACOB_STEAM_APP_ID=359320 \
            "$JACOB_BIN" >/dev/null 2>&1 &
            JACOB_PID=$!
            JACOB_OWNED=1
          }
          
          cleanup() {
            if [[ "$JACOB_OWNED" == "1" && -n "${JACOB_PID:-}" ]] && kill -0 "$JACOB_PID" 2>/dev/null; then
              kill "$JACOB_PID" 2>/dev/null || true
              wait "$JACOB_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM
          
          mkdir -p "$VK_RUNTIME"
          rm -f "$VK_RUNTIME/renderer.ready" "$VK_RUNTIME/capture.request" "$VK_RUNTIME/capture.frame" 2>/dev/null || true
          
          # Elite remains Steam/Gamescope's primary process. The Vulkan layer is enabled
          # only for Elite, while the JACoB core starts headlessly alongside it.
          if [[ -f "$VK_DIR/enabled" ]]; then
            JACOB_VK_HUD=1 \
            JACOB_VK_HUD_DIR="$VK_DIR" \
            JACOB_VK_RUNTIME_DIR="$VK_RUNTIME" \
            "$@" &
          else
            "$@" &
          fi
          GAME_PID=$!
          sleep 0.75
          start_jacob
          
          while kill -0 "$GAME_PID" 2>/dev/null; do
            if ! jacob_healthy; then
              if [[ -z "${JACOB_PID:-}" ]] || ! kill -0 "$JACOB_PID" 2>/dev/null; then
                start_jacob
              fi
            fi
            sleep 2
          done
          
          wait "$GAME_PID"
          status=$?
          exit $status
          LAUNCH
          chmod 0755 "$LAUNCHER"
          printf '%s\n' "v10" > "$HOOK_STAMP"
          
          STEAM_ROOT="$(find_steam_root)" || { echo "Steam userdata not found; will retry later."; exit 0; }
          LOCALCONFIG="$(select_localconfig "$STEAM_ROOT")" || { echo "localconfig.vdf not found; will retry later."; exit 0; }
          
          CURRENT="$(extract_launch_options "$LOCALCONFIG" || true)"
          LEGACY=0
          if [[ "$CURRENT" == *"run-elite-with-jacob.sh"* ]]; then
            LEGACY=1
            echo "Legacy JACoB Steam wrapper detected; migrating launch options."
            if [[ "$CURRENT" == *"%command%"* ]]; then
              suffix="${CURRENT#*%command%}"
              CURRENT="%command%$suffix"
            else
              CURRENT="%command%"
            fi
          fi
          
          if [[ "$CURRENT" == *"$LAUNCHER"* && "$LEGACY" == "0" ]]; then
            echo "Steam hook already points at the freshly rewritten v10 launcher."
            exit 0
          fi
          
          echo "Closing Steam before editing localconfig.vdf..."
          flatpak-spawn --host sh -lc 'steam -shutdown >/dev/null 2>&1 || true' || true
          for _ in {1..60}; do
            if ! flatpak-spawn --host pgrep -x steam >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          
          LOCALCONFIG="$(select_localconfig "$STEAM_ROOT")" || { echo "localconfig missing after Steam shutdown"; exit 1; }
          CURRENT="$(extract_launch_options "$LOCALCONFIG" || true)"
          if [[ "$CURRENT" == *"run-elite-with-jacob.sh"* ]]; then
            if [[ "$CURRENT" == *"%command%"* ]]; then
              suffix="${CURRENT#*%command%}"
              CURRENT="%command%$suffix"
            else
              CURRENT="%command%"
            fi
          fi
          
          if [[ "$CURRENT" == *"$LAUNCHER"* ]]; then
            NEW="$CURRENT"
          elif [[ "$CURRENT" == *"%command%"* ]]; then
            NEW="${CURRENT/\%command%/$LAUNCHER %command%}"
          elif [[ -n "$CURRENT" ]]; then
            NEW="$LAUNCHER %command% $CURRENT"
          else
            NEW="$LAUNCHER %command%"
          fi
          
          BACKUP="$LOCALCONFIG.jacob-backup-$(date +%Y%m%d-%H%M%S)"
          cp -p "$LOCALCONFIG" "$BACKUP"
          TMP="$LOCALCONFIG.jacob-new-$$"
          set +e
          patch_launch_options "$LOCALCONFIG" "$NEW" "$TMP"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            rm -f "$TMP"
            echo "Could not patch Elite launch options (status $rc). Backup: $BACKUP"
            flatpak-spawn --host sh -lc 'nohup steam -silent >/dev/null 2>&1 &' || true
            exit 1
          fi
          mv -f "$TMP" "$LOCALCONFIG"
          echo "Steam hook installed. Backup: $BACKUP"
          flatpak-spawn --host sh -lc 'nohup steam -silent >/dev/null 2>&1 &' || true
          STEAM_INTEGRATE
          
          cat > packaging/flatpak/com.pseudosci.JACoB.yml <<'FLAT_MANIFEST'
          id: com.pseudosci.JACoB
          default-branch: stable
          runtime: org.freedesktop.Platform
          runtime-version: '25.08'
          sdk: org.freedesktop.Sdk
          command: jacob-flatpak-launch
          
          build-options:
            no-debuginfo: true
          
          finish-args:
            - --filesystem=home
            - --talk-name=org.freedesktop.Flatpak
          
          modules:
            - name: jacob-steamdeck-bootstrap
              buildsystem: simple
              build-commands:
                - install -Dm755 JACoB /app/libexec/JACoB
                - cc -O2 -Wall -Wextra jacob-gamescope-stream.c -o /app/libexec/jacob-gamescope-stream $(pkg-config --cflags --libs libpipewire-0.3 wayland-client)
                - mkdir -p /app/share/jacob/vulkan-hud
                - cp -a vulkan-hud/. /app/share/jacob/vulkan-hud/
                - mkdir -p /app/libexec/tesseract
                - cp -a tesseract-appdir/. /app/libexec/tesseract/
                - install -Dm755 jacob-flatpak-launch /app/bin/jacob-flatpak-launch
                - install -Dm755 jacob-steam-integrate /app/bin/jacob-steam-integrate
                - install -Dm644 VERSION /app/share/jacob/VERSION
                - install -Dm644 com.pseudosci.JACoB.desktop /app/share/applications/com.pseudosci.JACoB.desktop
                - install -Dm644 com.pseudosci.JACoB.metainfo.xml /app/share/metainfo/com.pseudosci.JACoB.metainfo.xml
                - install -Dm644 jacob-icon-256.png /app/share/icons/hicolor/256x256/apps/com.pseudosci.JACoB.png
              sources:
                - type: file
                  path: JACoB
                - type: file
                  path: jacob-gamescope-stream.c
                - type: dir
                  path: vulkan-hud
                  dest: vulkan-hud
                - type: file
                  path: jacob-flatpak-launch
                - type: file
                  path: jacob-steam-integrate
                - type: file
                  path: VERSION
                - type: file
                  path: com.pseudosci.JACoB.desktop
                - type: file
                  path: com.pseudosci.JACoB.metainfo.xml
                - type: file
                  path: jacob-icon-256.png
                - type: dir
                  path: tesseract-appdir
                  dest: tesseract-appdir
          FLAT_MANIFEST
          
          chmod 0755 packaging/flatpak/jacob-flatpak-launch packaging/flatpak/jacob-steam-integrate
          
          bash -n packaging/flatpak/jacob-flatpak-launch
          
          bash -n packaging/flatpak/jacob-steam-integrate
          
          python3 - <<'PY_VALIDATE'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('packaging/flatpak/com.pseudosci.JACoB.yml').read_text(encoding='utf-8'))
          print('Flatpak manifest parses')
          PY_VALIDATE
          
          ! grep -n 'JACoB-HUD' packaging/flatpak/com.pseudosci.JACoB.yml

      - name: Build Vulkan layer and shaders
        run: |
          set -euo pipefail
          rm -rf build/vulkan-hud packaging/flatpak/vulkan-hud
          mkdir -p build/vulkan-hud packaging/flatpak/vulkan-hud dist
          
          glslangValidator -V native/vulkan-hud/overlay.vert -o build/vulkan-hud/overlay.vert.spv
          glslangValidator -V native/vulkan-hud/overlay.frag -o build/vulkan-hud/overlay.frag.spv
          
          cmake -S native/vulkan-hud -B build/vulkan-hud/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vulkan-hud/cmake --verbose
          layer="$(find build/vulkan-hud/cmake -type f -name 'libVK_LAYER_JACOB_hud.so' -print -quit)"
          test -n "$layer"
          test -s "$layer"
          file "$layer"
          ldd "$layer" | tee dist/vulkan-layer-ldd.txt
          ! grep -q 'not found' dist/vulkan-layer-ldd.txt
          readelf -Ws "$layer" | grep -F 'vkNegotiateLoaderLayerInterfaceVersion'
          
          cp "$layer" dist/libVK_LAYER_JACOB_hud.so
          cp "$layer" packaging/flatpak/vulkan-hud/libVK_LAYER_JACOB_hud.so
          cp build/vulkan-hud/overlay.vert.spv packaging/flatpak/vulkan-hud/overlay.vert.spv
          cp build/vulkan-hud/overlay.frag.spv packaging/flatpak/vulkan-hud/overlay.frag.spv
          cp build/vulkan-hud/overlay.vert.spv dist/overlay.vert.spv
          cp build/vulkan-hud/overlay.frag.spv dist/overlay.frag.spv

      - name: Validate v10 integration
        run: |
          set -euo pipefail
          git diff --check
          
          test -s packaging/flatpak/vulkan-hud/libVK_LAYER_JACOB_hud.so
          test -s packaging/flatpak/vulkan-hud/overlay.vert.spv
          test -s packaging/flatpak/vulkan-hud/overlay.frag.spv
          
          grep -Fq 'linux-vulkan-hud2-v10' internal/platform/overlay_linux_vulkan.go
          grep -Fq 'linux-vulkan-prehud-elite-v2' internal/platform/capture_linux_vulkan.go
          grep -Fq 'return newVulkanOverlayDriver()' internal/platform/overlay_linux_bridge.go
          grep -Fq 'JACOB_VK_HUD=1' packaging/flatpak/jacob-steam-integrate
          grep -Fq 'rm -rf "$HOST_DIR"' packaging/flatpak/jacob-flatpak-launch
          grep -Fq 'DBUS_SESSION_BUS_ADDRESS' packaging/flatpak/jacob-flatpak-launch

      - name: Test JACoB
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./...

      - name: Build Linux JACoB payload
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION
          ldd "dist/JACoB-$v-linux-amd64" | tee dist/linux-ldd.txt
          ! grep -q 'not found' dist/linux-ldd.txt

      - name: Prepare bundled OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage
          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )
          test -x packaging/flatpak/tesseract-appdir/AppRun

      - name: Build Steam Deck v10 Flatpak
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo "dist/JACoB-$v-SteamDeck-vulkan-hud-v10.flatpak" com.pseudosci.JACoB stable
          test -s "dist/JACoB-$v-SteamDeck-vulkan-hud-v10.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck-vulkan-hud-v10.flatpak" dist/libVK_LAYER_JACOB_hud.so dist/overlay.vert.spv dist/overlay.frag.spv > dist/VULKAN-HUD-V10-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jacob-0.2.18-vulkan-hud-v10
          path: |
            dist/JACoB-0.2.18-alpha-SteamDeck-vulkan-hud-v10.flatpak
            dist/libVK_LAYER_JACOB_hud.so
            dist/overlay.vert.spv
            dist/overlay.frag.spv
            dist/VULKAN-HUD-V10-SHA256.txt
            dist/linux-ldd.txt
            dist/vulkan-layer-ldd.txt

      - name: Upload v10 Flatpak to current alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.2.18-alpha'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/JACoB-0.2.18-alpha-SteamDeck-vulkan-hud-v10.flatpak \
              dist/VULKAN-HUD-V10-SHA256.txt \
              --clobber
          else
            echo "Release $tag does not exist; use the Actions artifact."
          fi
