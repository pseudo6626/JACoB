          	'9':  {0x0E, 0x11, 0x11, 0x0F, 0x01, 0x01, 0x0E},
          	'.':  {0, 0, 0, 0, 0, 0x0C, 0x0C},
          	',':  {0, 0, 0, 0, 0x0C, 0x0C, 0x08},
