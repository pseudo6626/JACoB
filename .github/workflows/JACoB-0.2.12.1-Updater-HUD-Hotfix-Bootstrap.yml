          python $patcher

      - name: Format and validate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          gofmt -w `
            cmd/installer/main.go `
            internal/core/server.go `
            internal/platform/overlay.go `
            internal/platform/overlay_windows.go `
            internal/platform/overlay_linux.go `
            internal/platform/overlay_linux_nocgo.go `
            internal/platform/overlay_other.go `
            internal/platform/overlay_prefix_test.go `
            internal/buildinfo/version.go

          go test ./...
          go test -tags "norecorder,nocapture" ./...
          node --check internal/webui/assets/app.js

          $installer = Get-Content cmd/installer/main.go -Raw
          if ($installer -match 'func waitForPID\(pid int, timeout time.Duration\) \{') {
            throw "Old silent waitForPID implementation survived the patch."
          }
          if ($installer -notmatch 'taskkill", "/PID"') {
            throw "PID-specific forced shutdown is missing."
          }
          if ($installer -notmatch 'waitForPortFree') {
            throw "Port release verification is missing."
          }
          if ($installer -notmatch 'update\.log') {
            throw "Update handoff logging is missing."
          }

          $server = Get-Content internal/core/server.go -Raw
          if ($server -match 'ClearLayer\("tab:" \+ id\)') {
            throw "Tab deletion still clears only one HUD layer."
          }
          if ($server -notmatch 'ClearPrefix\("tab:" \+ id\)') {
            throw "Tab namespace HUD cleanup is missing."
          }

      - name: Build candidate artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "0.2.12.1-alpha"
          $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"

          $env:GOOS="linux"
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          go build -trimpath -tags "norecorder,nocapture" -o "dist/JACoB-$v-linux-amd64-no-capture" ./cmd/jacob

          $env:GOOS="windows"
          go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob

          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try {
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue
          }

          $files = @(
            "dist/JACoB-$v-win-x64.exe",
            "dist/JACoB-$v-win-x64-portable.exe",
            "dist/JACoB-$v-win-x64-no-capture.exe",
            "dist/JACoB-$v-linux-amd64",
            "dist/JACoB-$v-linux-amd64-no-capture"
          )
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $sumLines | Out-File "dist/SHA256SUMS.txt" -Encoding ascii
          Copy-Item RELEASE-NOTES-0.2.12.1-alpha.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: JACoB-0.2.12.1-alpha-updater-HUD-candidate
          path: |
            dist/JACoB-0.2.12.1-alpha-win-x64.exe
            dist/JACoB-0.2.12.1-alpha-win-x64-portable.exe
            dist/JACoB-0.2.12.1-alpha-win-x64-no-capture.exe
            dist/JACoB-0.2.12.1-alpha-linux-amd64
            dist/JACoB-0.2.12.1-alpha-linux-amd64-no-capture
            dist/RELEASE-NOTES-0.2.12.1-alpha.md
            dist/SHA256SUMS.txt

      - name: Commit validated source
        if: ${{ inputs.commit_candidate }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git commit -m "JACoB 0.2.12.1-alpha updater and HUD reliability hotfix"
          git push origin HEAD:${{ github.ref_name }}
