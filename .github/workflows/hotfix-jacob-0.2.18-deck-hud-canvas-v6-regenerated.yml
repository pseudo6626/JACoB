name: Hotfix JACoB 0.2.18 Deck HUD Canonical Canvas + Decky Setup v6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxfixes-dev libxcomposite-dev \
            libpipewire-0.3-dev libwayland-dev \
            flatpak flatpak-builder
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Replace Deck HUD renderer with canonical 1280x800 canvas
        run: |
          set -euo pipefail

          cat > packaging/decky/JACoB-HUD/src/index.tsx <<'EOF'
          import { findModuleChild, PanelSection, PanelSectionRow, staticClasses } from "@decky/ui";
          import { definePlugin, routerHook } from "@decky/api";
          import { useEffect, useMemo, useState } from "react";
          import { FaCrosshairs } from "react-icons/fa";

          type Point = { x:number; y:number };
          type Item = {
            type:string; x?:number; y?:number; x2?:number; y2?:number; w?:number; h?:number; r?:number;
            points?:Point[]; text?:string; color?:string; stroke?:string; fill?:string;
            lineWidth?:number; fontSize?:number; fontFamily?:string; fontWeight?:number; italic?:boolean;
            align?:string; opacity?:number; glow?:number; glowColor?:string; outlineWidth?:number;
            outlineColor?:string; shadowX?:number; shadowY?:number; shadowColor?:string;
            cornerRadius?:number; dash?:string;
          };
          type Scene = {
            z?:number; space?:string; width?:number; height?:number; opacity?:number; items:Item[];
          };
          type Snapshot = {
            hudVersion:number; version:number; visible:boolean; layers:Record<string,Scene>;
            connected?:boolean; rendererConnected?:boolean;
          };
          type NamedScene = [string, Scene];

          const CANVAS_W = 1280;
          const CANVAS_H = 800;

          enum UIComposition {
            Hidden = 0,
            Notification = 1,
            Overlay = 2,
            Opaque = 3,
            OverlayKeyboard = 4,
            OverlayQAM = 5,
            OverlayKeyboard1 = 6,
          }

          const discoveredUIComposition =
            findModuleChild((m:any) => {
              if (typeof m !== "object") return undefined;
              for (const prop in m) {
                const fn = m[prop];
                if (typeof fn === "function") {
                  const s = fn.toString();
                  if (s.includes("AddMinimumCompositionStateRequest") &&
                      s.includes("ChangeMinimumCompositionStateRequest") &&
                      s.includes("RemoveMinimumCompositionStateRequest") &&
                      !s.includes("m_mapCompositionStateRequests")) {
                    return fn;
                  }
                }
              }
              return undefined;
            }) as any;

          const useUIComposition: (composition:UIComposition)=>void =
            (typeof discoveredUIComposition === "function" ? discoveredUIComposition : (()=>{})) as any;

          let current:Snapshot = {
            hudVersion:2,
            version:0,
            visible:false,
            layers:{},
            connected:false
          };

          const subscribers = new Set<(s:Snapshot)=>void>();

          function publish(s:Snapshot){
            current=s;
            subscribers.forEach(fn=>fn(s));
          }

          const HUD_URL="http://127.0.0.1:6626/api/deck/hud/state";
          let transportStopped=false;
          let transportVersion=0;

          function sleep(ms:number){
            return new Promise(resolve=>setTimeout(resolve,ms));
          }

          async function hudTransportLoop(){
            transportStopped=false;
            while(!transportStopped){
              try{
                const url=`${HUD_URL}?since=${transportVersion}&wait=1000`;
                const res=await fetch(url,{method:"GET",cache:"no-store",mode:"cors"});
                if(!res.ok) throw new Error(`HUD state HTTP ${res.status}`);
                const snap=await res.json() as Snapshot;
                transportVersion=Number(snap.version||transportVersion);
                publish({...snap,connected:true});
              }catch(_err){
                publish({
                  hudVersion:current.hudVersion||2,
                  version:transportVersion,
                  visible:false,
                  layers:{},
                  connected:false
                });
                await sleep(500);
              }
            }
          }

          function useSnapshot(){
            const [snap,setSnap] = useState<Snapshot>(current);
            useEffect(()=>{
              subscribers.add(setSnap);
              return ()=>{subscribers.delete(setSnap)};
            },[]);
            return snap;
          }

          function pixelScaleX(scene:Scene){
            if(scene.space!=="pixels") return 1;
            const ref=(scene.width||0)>0 ? Number(scene.width) : CANVAS_W;
            return CANVAS_W/ref;
          }

          function pixelScaleY(scene:Scene){
            if(scene.space!=="pixels") return 1;
            const ref=(scene.height||0)>0 ? Number(scene.height) : CANVAS_H;
            return CANVAS_H/ref;
          }

          function metricScale(scene:Scene){
            if(scene.space!=="pixels") return 1;
            return Math.min(pixelScaleX(scene),pixelScaleY(scene));
          }

          function sx(v:number|undefined, scene:Scene){
            const n=v||0;
            return scene.space==="pixels" ? n*pixelScaleX(scene) : n*CANVAS_W;
          }

          function sy(v:number|undefined, scene:Scene){
            const n=v||0;
            return scene.space==="pixels" ? n*pixelScaleY(scene) : n*CANVAS_H;
          }

          function sw(v:number|undefined, scene:Scene){
            return sx(v,scene);
          }

          function sh(v:number|undefined, scene:Scene){
            return sy(v,scene);
          }

          function sr(v:number|undefined, scene:Scene){
            const n=v||0;
            return scene.space==="pixels" ? n*metricScale(scene) : n*Math.min(CANVAS_W,CANVAS_H);
          }

          function dash(v:string|undefined, width:number){
            switch(v){
              case "dash": return `${6*width} ${4*width}`;
              case "dot": return `${width} ${3*width}`;
              case "dashdot": return `${6*width} ${3*width} ${width} ${3*width}`;
              default: return undefined;
            }
          }

          function fx(i:Item, scene:Scene){
            const f:string[]=[];
            const ms=metricScale(scene);
            if((i.shadowX||i.shadowY) && i.shadowColor){
              f.push(`drop-shadow(${(i.shadowX||0)*ms}px ${(i.shadowY||0)*ms}px 0px ${i.shadowColor})`);
            }
            if((i.glow||0)>0){
              f.push(`drop-shadow(0 0 ${(i.glow||0)*ms}px ${i.glowColor||i.stroke||i.color||"#ffffff"})`);
            }
            return f.length?f.join(" "):undefined;
          }

          function common(i:Item, scene:Scene){
            return {
              opacity:i.opacity??1,
              filter:fx(i,scene),
              strokeLinecap:"round" as const,
              strokeLinejoin:"round" as const,
            };
          }

          function renderItem(i:Item, scene:Scene, key:string){
            const ms=metricScale(scene);
            const lw=(i.lineWidth||1)*ms;
            const stroke=i.stroke||i.color||"none";
            const fill=i.fill||"none";
            const c=common(i,scene);

            if(i.type==="line"){
              return <line
                key={key}
                x1={sx(i.x,scene)}
                y1={sy(i.y,scene)}
                x2={sx(i.x2,scene)}
                y2={sy(i.y2,scene)}
                stroke={stroke}
                strokeWidth={lw}
                strokeDasharray={dash(i.dash,lw)}
                style={c}
              />;
            }

            if(i.type==="polyline"||i.type==="polygon"){
              const pts=(i.points||[])
                .map(p=>`${sx(p.x,scene)},${sy(p.y,scene)}`)
                .join(" ");

              return i.type==="polygon"
                ? <polygon
                    key={key}
                    points={pts}
                    stroke={stroke}
                    fill={fill}
                    strokeWidth={lw}
                    strokeDasharray={dash(i.dash,lw)}
                    style={c}
                  />
                : <polyline
                    key={key}
                    points={pts}
                    stroke={stroke}
                    fill="none"
                    strokeWidth={lw}
                    strokeDasharray={dash(i.dash,lw)}
                    style={c}
                  />;
            }

            if(i.type==="rect"){
              return <rect
                key={key}
                x={sx(i.x,scene)}
                y={sy(i.y,scene)}
                width={sw(i.w,scene)}
                height={sh(i.h,scene)}
                rx={sr(i.cornerRadius,scene)}
                stroke={stroke}
                fill={fill}
                strokeWidth={lw}
                strokeDasharray={dash(i.dash,lw)}
                style={c}
              />;
            }

            if(i.type==="circle"){
              return <circle
                key={key}
                cx={sx(i.x,scene)}
                cy={sy(i.y,scene)}
                r={sr(i.r,scene)}
                stroke={stroke}
                fill={fill}
                strokeWidth={lw}
                strokeDasharray={dash(i.dash,lw)}
                style={c}
              />;
            }

            if(i.type==="text"){
              const anchor=i.align==="center"?"middle":i.align==="right"?"end":"start";
              const color=i.color||i.fill||"#fff";
              const outline=(i.outlineWidth||0)*ms;

              return <text
                key={key}
                x={sx(i.x,scene)}
                y={sy(i.y,scene)}
                fill={color}
                fontSize={(i.fontSize||18)*ms}
                fontFamily={`${i.fontFamily||"sans-serif"}, "Noto Sans", sans-serif`}
                fontWeight={i.fontWeight||400}
                fontStyle={i.italic?"italic":"normal"}
                textAnchor={anchor}
                dominantBaseline="text-before-edge"
                stroke={outline>0?(i.outlineColor||"#000000"):"none"}
                strokeWidth={outline*2}
                paintOrder="stroke fill"
                style={c}
              >
                {i.text||""}
              </text>;
            }

            return null;
          }

          function HUDSurface({scenes}:{scenes:NamedScene[]}){
            useUIComposition(UIComposition.Notification);

            return <div
              aria-hidden="true"
              style={{
                position:"fixed",
                left:0,
                top:0,
                width:"100vw",
                height:"100vh",
                pointerEvents:"none",
                zIndex:2147483000,
                overflow:"hidden",
                background:"transparent",
                backgroundColor:"transparent"
              }}
            >
              <svg
                viewBox={`0 0 ${CANVAS_W} ${CANVAS_H}`}
                preserveAspectRatio="none"
                aria-hidden="true"
                fill="none"
                style={{
                  position:"absolute",
                  left:0,
                  top:0,
                  width:"100%",
                  height:"100%",
                  display:"block",
                  pointerEvents:"none",
                  overflow:"visible",
                  background:"transparent",
                  backgroundColor:"transparent"
                }}
              >
                {scenes.flatMap(([name,scene])=>
                  (scene.items||[]).map((item,idx)=>
                    renderItem(item,scene,`${name}:${idx}`)
                  )
                )}
              </svg>
            </div>;
          }

          function HUDOverlay(){
            const snap=useSnapshot();
            const scenes=useMemo(
              ()=>Object.entries(snap.layers||{})
                .sort((a,b)=>(a[1].z||0)-(b[1].z||0)) as NamedScene[],
              [snap]
            );

            const active=!!snap.connected && !!snap.visible && scenes.length>0;
            if(!active) return null;

            return <HUDSurface scenes={scenes}/>;
          }

          function Content(){
            const snap=useSnapshot();

            return <PanelSection title="HUD Renderer">
              <PanelSectionRow>
                <div style={{padding:"8px 0",fontSize:13}}>
                  <div>Core: {snap.connected?"connected":"waiting"}</div>
                  <div>HUD2: v{snap.hudVersion||2}</div>
                  <div>Renderer: Deck canonical canvas 1280×800</div>
                  <div>Layers: {Object.keys(snap.layers||{}).length}</div>
                  <div>Scene version: {snap.version||0}</div>
                </div>
              </PanelSectionRow>
            </PanelSection>;
          }

          export default definePlugin(()=>{
            const name="JACoBHUDOverlay";

            transportStopped=false;
            void hudTransportLoop();
            routerHook.addGlobalComponent(name,HUDOverlay);

            return {
              name:"JACoB HUD",
              titleView:<div className={staticClasses.Title}>JACoB HUD Bridge</div>,
              content:<Content/>,
              icon:<FaCrosshairs/>,
              alwaysRender:true,
              onDismount(){
                transportStopped=true;
                routerHook.removeGlobalComponent(name);
                publish({
                  hudVersion:2,
                  version:transportVersion,
                  visible:false,
                  layers:{},
                  connected:false
                });
              }
            };
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p=Path("packaging/decky/JACoB-HUD/package.json")
          pkg=json.loads(p.read_text(encoding="utf-8"))
          pkg["version"]="0.1.5"
          p.write_text(json.dumps(pkg,indent=2)+"\n",encoding="utf-8")

          p=Path("packaging/flatpak/jacob-flatpak-launch")
          s=p.read_text(encoding="utf-8")

          if "DECKY_GUIDE_STAMP" not in s:
              old='''else
            printf '[%s] Decky Loader not detected; HUD bridge retained at %s.\\n' "$(date -Is)" "$HOST_DECKY_DIR" >> "$LOG_FILE"
          fi
          '''
              new='''else
            printf '[%s] Decky Loader not detected; HUD bridge retained at %s.\\n' "$(date -Is)" "$HOST_DECKY_DIR" >> "$LOG_FILE"

            if [[ "${1:-}" != "--service-only" ]]; then
              DECKY_GUIDE_STAMP="$HOST_DIR/.decky-install-guidance-shown"
              DECKY_URL="https://github.com/SteamDeckHomebrew/decky-loader"

              if [[ ! -f "$DECKY_GUIDE_STAMP" ]]; then
                printf '[%s] Decky is required for JACoB in-game HUD rendering. Opening official installation guidance.\\n' "$(date -Is)" >> "$LOG_FILE"

                if flatpak-spawn --host sh -lc 'command -v kdialog >/dev/null 2>&1'; then
                  if flatpak-spawn --host kdialog \
                    --title "JACoB Steam Deck Setup" \
                    --yesno "JACoB is installed, but Decky Loader is required for JACoB HUD overlays in Gaming Mode. Open the official Decky installation page now?"; then
                    flatpak-spawn --host xdg-open "$DECKY_URL" >/dev/null 2>&1 || true
                  fi
                else
                  flatpak-spawn --host xdg-open "$DECKY_URL" >/dev/null 2>&1 || true
                fi

                printf '%s\\n' "$(date -Is)" > "$DECKY_GUIDE_STAMP"
              fi
            fi
          fi
          '''
              if old not in s:
                  raise SystemExit("Decky launcher anchor not found")
              s=s.replace(old,new,1)
              p.write_text(s,encoding="utf-8")

          p=Path("README.md")
          s=p.read_text(encoding="utf-8")
          if "Decky Loader is required only for JACoB" not in s:
              pat=re.compile(r'Steamdeck users should download both the linux version.*?\n\n',re.S|re.I)
              repl='''Steam Deck users should install the `JACoB-<version>-SteamDeck.flatpak` release asset in Desktop Mode and launch **JACoB Steam Deck Setup** once. The setup installs the native host payload and integrates JACoB with Elite's Steam launch options. **Decky Loader is required only for JACoB's in-game HUD renderer**; if Decky is missing, setup directs the user to the official Decky installation page. Full step-by-step instructions are in [`docs/INSTALLATION.md`](docs/INSTALLATION.md).

          '''
              if not pat.search(s):
                  raise SystemExit("README Steam Deck paragraph not found")
              p.write_text(pat.sub(repl,s,count=1),encoding="utf-8")

          p=Path("docs/INSTALLATION.md")
          s=p.read_text(encoding="utf-8")
          if "### Decky Loader requirement for HUD overlays" not in s:
              pat=re.compile(
                  r'After setup, launch Elite Dangerous normally from Gaming Mode\..*?OCR remains platform-dependent and should be capability-checked separately\.\n',
                  re.S
              )
              repl='''After setup, launch Elite Dangerous normally from Gaming Mode. JACoB starts with Elite and its browser UI can be selected as the second window through the Steam window switcher.

          The Flatpak is only the installer/bootstrap. The actual JACoB core runs natively on the Steam Deck host so Gamescope capture, Linux input, journal/status access and the in-app updater are not trapped inside a Flatpak sandbox.

          ### Decky Loader requirement for HUD overlays

          JACoB's normal web UI, journal/status tools, input bridge, Game View, Vision and OCR do not require Decky Loader. **The in-game HUD overlay does.** JACoB ships its own Decky HUD bridge, but Decky Loader must be installed so Steam's Gaming Mode UI can load that bridge.

          JACoB Steam Deck Setup checks for Decky. If Decky is missing, it offers to open the official Decky Loader page. To install Decky manually:

          1. Switch the Steam Deck to **Desktop Mode**.
          2. Open the official [Decky Loader repository](https://github.com/SteamDeckHomebrew/decky-loader).
          3. Download the official `decky_installer.desktop` installer. If Firefox saves it as `decky_installer.desktop.download`, rename it to `decky_installer.desktop`.
          4. Move the installer to the Desktop and double-click it.
          5. Authorize the installer when prompted and choose **Latest Release**.
          6. Return to Gaming Mode.
          7. Launch **JACoB Steam Deck Setup** once more. JACoB copies its bundled HUD bridge into Decky's plugin directory and requests a Decky reload. A reboot also loads the bridge if the reload is declined.

          Decky is maintained by the SteamDeckHomebrew project and is separate from JACoB. JACoB does not silently pipe a remote privileged installer into a shell.

          ### Steam Deck capture and HUD

          The full Linux build is compiled natively on Linux with CGO enabled. Game View, Vision and OCR use JACoB's Elite-only Gamescope/PipeWire capture path. The capture helper identifies Elite Dangerous (Steam app `359320`) and does not fall back to monitor or desktop capture.

          The HUD uses a canonical 1280×800 logical canvas in the bundled JACoB Decky renderer. Normalized scenes map to that canvas directly. Pixel-space scenes may provide `width` and `height` as their authoring dimensions; the Deck renderer scales those coordinates into the canonical canvas before Gamescope composites the result.

          OCR is capability-checked separately and uses the bundled Tesseract runtime in the Steam Deck package.
          '''
              if not pat.search(s):
                  raise SystemExit("INSTALLATION Steam Deck section not found")
              p.write_text(pat.sub(repl,s,count=1),encoding="utf-8")
          PY

          grep -Fq 'const CANVAS_W = 1280' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'const CANVAS_H = 800' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'viewBox={`0 0 ${CANVAS_W} ${CANVAS_H}`}' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq 'backgroundColor:"transparent"' packaging/decky/JACoB-HUD/src/index.tsx
          grep -Fq '"version": "0.1.5"' packaging/decky/JACoB-HUD/package.json
          bash -n packaging/flatpak/jacob-flatpak-launch
          git diff --check

      - name: Build Decky HUD renderer
        working-directory: packaging/decky/JACoB-HUD
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build
          test -s dist/index.js

      - name: Stage Decky production payload for Flatpak
        run: |
          set -euo pipefail
          rm -rf packaging/flatpak/JACoB-HUD
          mkdir -p packaging/flatpak/JACoB-HUD
          cp packaging/decky/JACoB-HUD/plugin.json packaging/flatpak/JACoB-HUD/
          cp packaging/decky/JACoB-HUD/package.json packaging/flatpak/JACoB-HUD/
          cp -a packaging/decky/JACoB-HUD/dist packaging/flatpak/JACoB-HUD/

          test -s packaging/flatpak/JACoB-HUD/dist/index.js
          grep -Fq '"version": "0.1.5"' packaging/flatpak/JACoB-HUD/package.json
          grep -Fq '1280' packaging/flatpak/JACoB-HUD/dist/index.js
          grep -Fq '800' packaging/flatpak/JACoB-HUD/dist/index.js

      - name: Prepare bundled OCR runtime
        run: |
          set -euo pipefail
          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'

          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )
          test -x packaging/flatpak/tesseract-appdir/AppRun

      - name: Test Linux repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision
          go test ./...

      - name: Windows regression compile gate
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -exec=true ./...
          go build -trimpath -o /tmp/JACoB-v6-windows.exe ./cmd/jacob

      - name: Build replacement Steam Deck Flatpak
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          mkdir -p dist

          grep -Fq 'Version    = "0.2.18-alpha"' internal/buildinfo/version.go
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/com.pseudosci.JACoB.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            "dist/JACoB-$v-SteamDeck.flatpak" \
            com.pseudosci.JACoB \
            stable

          test -s "dist/JACoB-$v-SteamDeck.flatpak"
          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" \
            > dist/STEAMDECK-HUD-CANVAS-V6-SHA256.txt

      - name: Commit tested hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf packaging/decky/JACoB-HUD/node_modules
          rm -rf packaging/decky/JACoB-HUD/dist
          rm -f packaging/decky/JACoB-HUD/pnpm-lock.yaml

          rm -rf packaging/flatpak/tesseract-appdir
          rm -f packaging/flatpak/JACoB
          rm -f packaging/flatpak/jacob-icon-256.png
          rm -f packaging/flatpak/VERSION

          git add \
            README.md \
            docs/INSTALLATION.md \
            packaging/decky/JACoB-HUD/src/index.tsx \
            packaging/decky/JACoB-HUD/package.json \
            packaging/flatpak/JACoB-HUD \
            packaging/flatpak/jacob-flatpak-launch

          if git diff --cached --quiet; then
            echo "Deck HUD canonical-canvas hotfix already present."
          else
            git commit -m "Fix Deck HUD canvas scaling and Decky setup guidance"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jacob-0.2.18-deck-hud-canvas-v6
          path: |
            dist/JACoB-0.2.18-alpha-SteamDeck.flatpak
            dist/STEAMDECK-HUD-CANVAS-V6-SHA256.txt

      - name: Upload replacement Deck release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          tag="v$v"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-CANVAS-V6-SHA256.txt" \
              --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HUD-CANVAS-V6-SHA256.txt" \
              --target "$(git rev-parse HEAD)" \
              --draft \
              --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck canonical HUD canvas + Decky setup guidance hotfix."
          fi
