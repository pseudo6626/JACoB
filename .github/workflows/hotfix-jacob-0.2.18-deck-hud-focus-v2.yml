      - name: Validate hotfix
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'linux-x11-gamescope-steam-window-overlay-recovered' internal/platform/overlay_linux.go
          grep -Fq 'XMapRaised' internal/platform/overlay_linux.go
          grep -Fq 'XUnmapWindow' internal/platform/overlay_linux.go
          ! grep -Fq 'XSetTransientForHint' internal/platform/overlay_linux.go
          ! grep -Fq 'GAMESCOPE_NO_FOCUS' internal/platform/overlay_linux.go
          grep -Fq 'Elite - Dangerous (CLIENT)' internal/platform/focus_linux_x11.go
          grep -Fq 'linuxWindowHasEliteClientTitle' internal/platform/focus_linux_x11.go
          grep -Fq 'cachedLinuxEliteWindowTarget' internal/platform/focus_linux_x11.go
          ! grep -Fq 'return true, true, 0' internal/platform/focus_linux_x11.go

      - name: Test Linux platform, Vision, Spatial, and repository
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./internal/platform
          go test ./internal/vision ./internal/spatial
          go test ./...

      - name: Build and inspect Deck core
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/JACoB-0.2.18-deck-hotfix-v2 ./cmd/jacob
          ldd /tmp/JACoB-0.2.18-deck-hotfix-v2 | tee /tmp/jacob-hotfix-v2-ldd.txt
          ! grep -q 'not found' /tmp/jacob-hotfix-v2-ldd.txt
          grep -q 'libXcomposite' /tmp/jacob-hotfix-v2-ldd.txt
          strings /tmp/JACoB-0.2.18-deck-hotfix-v2 | grep -Fq 'linux-x11-gamescope-steam-window-overlay-recovered'
          strings /tmp/JACoB-0.2.18-deck-hotfix-v2 | grep -Fq 'Elite - Dangerous (CLIENT)'

      - name: Commit tested hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/overlay_linux.go internal/platform/focus_linux_x11.go
          if git diff --cached --quiet; then
            echo "Hotfix already present."
          else
            git commit -m "Fix Deck HUD focus and launcher/client targeting"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Build replacement Steam Deck Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v='0.2.18-alpha'
          mkdir -p dist

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob

          ocr_url='https://github.com/pkgforge-community/AlexanderP_tesseract-appimage/releases/download/v5.5.2-20260124T161609/tesseract-5.5.2_lept-1.87-x86_64.AppImage'
          ocr_sha='177a11b5520e6e296de7aa8e2927c00c3ce7b6ffa9a9777454a2be3e87e8a391'
          curl -fL --retry 3 "$ocr_url" -o /tmp/jacob-tesseract.AppImage
          printf '%s  %s\n' "$ocr_sha" /tmp/jacob-tesseract.AppImage | sha256sum -c -
          chmod +x /tmp/jacob-tesseract.AppImage

          rm -rf packaging/flatpak/tesseract-appdir packaging/flatpak/squashfs-root
          (
            cd packaging/flatpak
            /tmp/jacob-tesseract.AppImage --appimage-extract >/dev/null
            mv squashfs-root tesseract-appdir
          )

          cp "dist/JACoB-$v-linux-amd64" packaging/flatpak/JACoB
          cp assets/jacob-icon-256.png packaging/flatpak/jacob-icon-256.png
          printf '%s\n' "$v" > packaging/flatpak/VERSION

          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/flatpak/com.pseudosci.JACoB.yml
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/JACoB-$v-SteamDeck.flatpak" com.pseudosci.JACoB stable

          sha256sum "dist/JACoB-$v-SteamDeck.flatpak" > dist/STEAMDECK-HOTFIX-V2-SHA256.txt

          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HOTFIX-V2-SHA256.txt" --clobber
          else
            gh release create "$tag" \
              "dist/JACoB-$v-SteamDeck.flatpak" \
              "dist/STEAMDECK-HOTFIX-V2-SHA256.txt" \
              --target "$(git rev-parse HEAD)" --draft --prerelease \
              --title "JACoB $v" \
              --notes "Steam Deck HUD focus + launcher/client targeting hotfix. Test before publishing."
          fi
