turn false;\n      if(q){const hay=[entry.name,entry.description,entry.author,entry.id,entry.category,...(entry.tags||[]),...(entry.capabilities||[]),...(entry.maintainers||[])].join(\' \').toLowerCase();if(!hay.includes(q))return false}\n      return true;\n    });\n    const downloads=id=>Number(communityRegistryStats?.downloads?.[id]||0);\n    if(sort===\'newest\')rows.sort((a,b)=>String(b.updatedAt||\'\').localeCompare(String(a.updatedAt||\'\'))||String(a.name).localeCompare(String(b.name)));\n    else if(sort===\'name\')rows.sort((a,b)=>String(a.name).localeCompare(String(b.name)));\n    else rows.sort((a,b)=>downloads(b.id)-downloads(a.id)||String(b.updatedAt||\'\').localeCompare(String(a.updatedAt||\'\')));\n    return rows;\n  }\n  function communityRenderRegistry(){\n    const host=$(\'#community-results\');if(!host)return;const rows=communityFilteredTabs(),installed=communityInstalledByPackage(),downloads=id=>Number(communityRegistryStats?.downloads?.[id]||0);\n    if(!rows.length){host.innerHTML=\'<div class="muted empty-state">No Community Tabs match those filters.</div>\';return}\n    host.innerHTML=\'\';\n    for(const entry of rows){\n      const local=installed.get(entry.id),current=local?.community?.publishedVersion||\'\',hasUpdate=!!(local&&communityVersionCompare(entry.version,current||\'0.0.0\')>0),compatible=communitySDKCompatible(entry),card=document.createElement(\'article\');card.className=\'community-tab-card\';\n      const caps=(entry.capabilities||[]).map(x=>`<span class="community-chip">${communityEscape(x)}</span>`).join(\'\'),tags=(entry.tags||[]).map(x=>`<span class="community-chip subtle">${communityEscape(x)}</span>`).join(\'\');\n      card.innerHTML=`<div class="community-card-head"><div><div class="section-kicker">${communityEscape(communityCategoryLabel(entry.category||\'utility\'))}</div><h2>${communityEscape(entry.name)}</h2><div class="muted">by ${communityEscape(entry.author||\'Unknown\')} · v${communityEscape(entry.version)}</div></div><div class="community-downloads"><strong>${downloads(entry.id).toLocaleString()}</strong><span>downloads</span></div></div><p>${communityEscape(entry.description||\'\')}</p><div class="community-chip-row">${caps}${tags}</div><div class="community-card-foot"><span class="muted">${compatible?`SDK ${communityEscape(entry.jacobSdk||\'\')}`:`Requires ${communityEscape(entry.jacobSdk||\'newer JACoB\')}`}${entry.derivedFrom?` · remix of ${communityEscape(entry.derivedFrom.id)}`:\'\'}</span><div class="row community-actions"></div></div>`;\n      const actions=card.querySelector(\'.community-actions\');\n      if(local){const open=document.createElement(\'button\');open.className=\'secondary\';open.textContent=\'Open\';open.onclick=()=>switchTab(navIDForTab(local));actions.appendChild(open);if(hasUpdate){const update=document.createElement(\'button\');update.textContent=`Update to ${entry.version}`;update.disabled=!compatible;update.onclick=()=>communityInstallEntry(entry,local.id);actions.appendChild(update)}else{const badge=document.createElement(\'span\');badge.className=\'status-mark online\';badge.textContent=\'INSTALLED\';actions.appendChild(badge)}}\n      else{const install=document.createElement(\'button\');install.textContent=compatible?\'Install\':\'Needs newer JACoB\';install.disabled=!compatible;install.onclick=()=>communityInstallEntry(entry,\'\');actions.appendChild(install)}\n      host.appendChild(card);\n    }\n  }\n  async function communityDownloadArtifact(entry){\n    let text=\'\';try{text=await communityFetchText(communityReleaseURL(entry))}catch{text=await communityFetchText(communityRawArtifactURL(entry))}\n    const bytes=new TextEncoder().encode(text),expectedSize=Number(entry?.artifact?.sizeBytes||0),expectedHash=String(entry?.artifact?.sha256||\'\').toLowerCase(),actualHash=await communitySHA256(bytes);\n    if(expectedSize&&bytes.length!==expectedSize)throw new Error(`Package size mismatch (${bytes.length} vs ${expectedSize})`);if(!expectedHash||actualHash!==expectedHash)throw new Error(\'Package SHA-256 did not match the registry. Installation was refused.\');return text;\n  }\n  async function communityInstallEntry(entry,existingID=\'\'){\n    if(!privilegedClient()){alert(\'Community tab installation must be done from the browser running on the JACoB host.\');return}\n    const result=$(\'#community-registry-result\');try{\n      if(existingID){const existing=await ensureSavedTabLoaded(existingID),meta=savedTabMeta(existingID),published=meta?.community?.publishedSha256||\'\';if(published){const currentHash=await communitySHA256(new TextEncoder().encode(existing.html||\'\'));if(currentHash!==published&&!confirm(\'This installed tab has local edits. Updating will replace those edits.\\n\\nCancel and use Tab Manager → Community… → Share as a remix if you want to keep them.\'))return}}\n      if(result)result.textContent=`Downloading and verifying ${entry.name} ${entry.version}…`;const html=await communityDownloadArtifact(entry),saved=await request(\'tabs.save\',{id:existingID||\'\',name:entry.name,html});\n      const old=existingID?savedTabMeta(existingID)?.community:null,community={packageId:entry.id,publishedVersion:entry.version,lastSubmittedVersion:\'\',publishedSha256:entry.artifact.sha256,registry:\'official\',author:entry.author||\'\',description:entry.description||\'\',category:entry.category||\'utility\',tags:entry.tags||[],basedOn:entry.derivedFrom?{packageId:entry.derivedFrom.id,version:entry.derivedFrom.version}:null,localAuthor:!!old?.localAuthor,status:\'published\'};\n      await request(\'tabs.community.set\',{id:saved.id,community});state.tabHTMLCache.set(saved.id,{updatedAt:saved.updatedAt||\'\',html});await loadSavedTabs();if(result)result.textContent=`${entry.name} ${entry.version} installed and verified.`;communityRenderRegistry();\n    }catch(e){if(result)result.textContent=`Install failed: ${e?.message||e}`}\n  }\n  function communityWireBrowser(){\n    const refresh=$(\'#community-refresh\'),share=$(\'#community-share-own\');if(refresh)refresh.onclick=()=>communityLoadRegistry(true);if(share)share.onclick=()=>{switchTab(\'tabmanager\');$(\'#tab-manager-result\').textContent=\'Choose a saved tab and click Share to publish it to Community Tabs.\'};\n    for(const id of [\'community-search\',\'community-category-filter\',\'community-capability-filter\',\'community-status-filter\',\'community-sort\']){const el=$(`#${id}`);if(el)el.addEventListener(id===\'community-search\'?\'input\':\'change\',communityRenderRegistry)}\n  }'
          SERVER_CASE = '\tcase "tabs.community.set":\n\t\tif !s.requireLocal(c, req.ID, "community-tab metadata") {\n\t\t\treturn\n\t\t}\n\t\tif s.tabs == nil {\n\t\t\t_ = s.sendError(c, req.ID, "TABS_UNAVAILABLE", "custom tabs are unavailable")\n\t\t\treturn\n\t\t}\n\t\tid, _ := req.Params["id"].(string)\n\t\tvar info *customtabs.CommunityInfo\n\t\tif raw, ok := req.Params["community"]; ok && raw != nil {\n\t\t\tb, err := json.Marshal(raw)\n\t\t\tif err != nil {\n\t\t\t\t_ = s.sendError(c, req.ID, "BAD_PARAMS", "invalid community metadata")\n\t\t\t\treturn\n\t\t\t}\n\t\t\tvar parsed customtabs.CommunityInfo\n\t\t\tif err := json.Unmarshal(b, &parsed); err != nil {\n\t\t\t\t_ = s.sendError(c, req.ID, "BAD_PARAMS", "invalid community metadata")\n\t\t\t\treturn\n\t\t\t}\n\t\t\tinfo = &parsed\n\t\t}\n\t\ttab, err := s.tabs.SetCommunity(id, info)\n\t\tif err != nil {\n\t\t\t_ = s.sendError(c, req.ID, "TAB_COMMUNITY_FAILED", err.Error())\n\t\t\treturn\n\t\t}\n\t\ts.broadcast(envelope{Type: "event", Event: "tabs.changed", Data: map[string]any{"action": "community", "tab": tab}})\n\t\ts.sendResult(c, req.ID, tab)\n'
          COMMUNITY_PAGE = '<section id="community" class="panel-page">\n  <div class="page-head">\n    <div><div class="section-kicker">COMMUNITY TABS</div><h1>Community</h1><p>Find, install, update, remix, and share JACoB tabs without managing package files by hand.</p></div>\n    <div class="row"><button id="community-refresh" class="secondary">Refresh registry</button><button id="community-share-own" class="primary">Share one of my tabs</button></div>\n  </div>\n\n  <div class="grid two community-intro-grid">\n    <article class="card">\n      <div class="section-kicker">FOR USERS</div>\n      <h2>Install community tools</h2>\n      <p>Browse the official registry, filter by category or capability, and install with one click. JACoB verifies the package size and SHA-256 before saving it.</p>\n      <p class="muted">Browsing and installing do not require a GitHub account.</p>\n    </article>\n    <article class="card">\n      <div class="section-kicker">FOR AUTHORS</div>\n      <h2>Sharing is three steps</h2>\n      <ol class="community-steps"><li>Build and test your tab in JACoB.</li><li>In Tab Manager, click <strong>Share</strong> and describe it.</li><li>Upload JACoB\'s generated submission file to GitHub and submit the form.</li></ol>\n      <p class="muted">GitHub sign-in is only required to publish or update a tab. GitHub identifies the maintainer; JACoB never receives the account password or login token.</p>\n    </article>\n  </div>\n\n  <article class="card community-browser-card">\n    <div class="card-head"><div><h2>Browse Community Tabs</h2><p class="muted">Search names, descriptions, authors, categories, tags, capabilities, and package IDs.</p></div></div>\n    <div class="community-toolbar">\n      <input id="community-search" type="search" placeholder="Search Community Tabs…" aria-label="Search Community Tabs">\n      <select id="community-category-filter" aria-label="Community category"><option value="">All categories</option></select>\n      <select id="community-capability-filter" aria-label="Required capability"><option value="">All capabilities</option><option value="clipboard">Clipboard</option><option value="control">Control</option><option value="network">Network</option><option value="recorder">Recorder</option><option value="overlay">Overlay</option><option value="video">Video</option><option value="vision">Vision</option><option value="intertab">Inter-tab</option></select>\n      <select id="community-status-filter" aria-label="Install status"><option value="">All tabs</option><option value="installed">Installed</option><option value="updates">Updates available</option><option value="not-installed">Not installed</option></select>\n      <select id="community-sort" aria-label="Sort Community Tabs"><option value="downloads">Most downloaded</option><option value="newest">Recently updated</option><option value="name">Name A–Z</option></select>\n    </div>\n    <pre id="community-registry-result" class="output small">Loading Community Tabs…</pre>\n    <div id="community-results" class="community-results"><div class="muted empty-state">Loading registry…</div></div>\n    <p class="muted community-privacy-note">Download counts are aggregate GitHub release statistics. JACoB does not send a user ID, account ID, or installation history when you install a tab.</p>\n  </article>\n</section>\n'
          COMMUNITY_STYLES = '/* Community Tabs */\n.community-intro-grid{margin-bottom:16px}\n.community-steps{margin:.7rem 0 0;padding-left:1.25rem;display:grid;gap:.45rem}\n.community-toolbar{display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(130px,1fr));gap:8px;margin:12px 0}\n.community-toolbar input,.community-toolbar select{width:100%;min-width:0}\n.community-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-top:12px}\n.community-tab-card{border:1px solid #33383d;background:#090c0f;padding:14px;display:grid;gap:10px;min-width:0}\n.community-card-head,.community-card-foot{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}\n.community-card-head h2{margin:.1rem 0 .2rem}\n.community-downloads{display:grid;text-align:right;line-height:1.05;white-space:nowrap}.community-downloads strong{font-size:1.35rem}.community-downloads span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#89939b}\n.community-chip-row{display:flex;flex-wrap:wrap;gap:5px}.community-chip{display:inline-block;border:1px solid #73502a;padding:2px 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}.community-chip.subtle{border-color:#343b42;color:#aab2b8;text-transform:none}\n.community-card-foot{align-items:center;margin-top:auto}.community-actions{justify-content:flex-end}.community-privacy-note{margin-top:12px}\n@media(max-width:900px){.community-toolbar{grid-template-columns:1fr 1fr}.community-toolbar input{grid-column:1/-1}}\n@media(max-width:560px){.community-toolbar{grid-template-columns:1fr}.community-toolbar input{grid-column:auto}.community-card-head,.community-card-foot{display:grid}.community-downloads{text-align:left}.community-actions{justify-content:flex-start}}\n'
          UPDATER_CHECK = 'func (c *Client) Check(ctx context.Context) (Info, error) {\n\tcandidates := make([]releaseAPI, 0, 8)\n\tfor page := 1; page <= 20; page++ {\n\t\turl := fmt.Sprintf("https://api.github.com/repos/%s/releases?per_page=100&page=%d", buildinfo.Repository, page)\n\t\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)\n\t\tif err != nil {\n\t\t\treturn Info{}, err\n\t\t}\n\t\treq.Header.Set("Accept", "application/vnd.github+json")\n\t\treq.Header.Set("User-Agent", "JACoB/"+buildinfo.Version)\n\t\treq.Header.Set("X-GitHub-Api-Version", "2022-11-28")\n\t\tresp, err := c.http.Do(req)\n\t\tif err != nil {\n\t\t\treturn Info{}, err\n\t\t}\n\t\tif resp.StatusCode != http.StatusOK {\n\t\t\t_ = resp.Body.Close()\n\t\t\treturn Info{}, fmt.Errorf("GitHub release check returned %s", resp.Status)\n\t\t}\n\t\tvar releases []releaseAPI\n\t\tdecodeErr := json.NewDecoder(io.LimitReader(resp.Body, 4<<20)).Decode(&releases)\n\t\t_ = resp.Body.Close()\n\t\tif decodeErr != nil {\n\t\t\treturn Info{}, decodeErr\n\t\t}\n\t\tfor _, rel := range releases {\n\t\t\tif rel.Draft || !isJACoBReleaseTag(rel.TagName) {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tcandidates = append(candidates, rel)\n\t\t}\n\t\t// Releases are newest-first. Once an actual JACoB application release\n\t\t// appears, older pages cannot contain a newer application build.\n\t\tif len(candidates) > 0 || len(releases) < 100 {\n\t\t\tbreak\n\t\t}\n\t}\n\tif len(candidates) == 0 {\n\t\treturn Info{CurrentVersion: buildinfo.Version, LatestVersion: buildinfo.Version, Available: false, Installable: false, InstallNote: "No published JACoB releases were found."}, nil\n\t}\n\tsort.SliceStable(candidates, func(i, j int) bool {\n\t\treturn buildinfo.CompareVersion(candidates[i].TagName, candidates[j].TagName) > 0\n\t})\n\tlatest := candidates[0]\n\tasset := selectAsset(latest.Assets)\n\tinfo := Info{\n\t\tCurrentVersion: buildinfo.Version,\n\t\tLatestVersion:  strings.TrimPrefix(strings.TrimPrefix(latest.TagName, "v"), "V"),\n\t\tAvailable:      buildinfo.CompareVersion(latest.TagName, buildinfo.Version) > 0,\n\t\tReleaseName:    latest.Name, ReleaseURL: latest.HTMLURL, PublishedAt: latest.PublishedAt,\n\t\tPrerelease: latest.Prerelease, Notes: latest.Body, Asset: asset,\n\t}\n\tif asset == nil {\n\t\tinfo.Installable = false\n\t\tinfo.InstallNote = "No update package matches this operating system and architecture."\n\t} else if strings.TrimSpace(asset.Digest) == "" {\n\t\tinfo.Installable = false\n\t\tinfo.InstallNote = "Automatic installation requires a GitHub-published SHA-256 digest for the release asset."\n\t} else {\n\t\tswitch runtime.GOOS {\n\t\tcase "windows", "linux":\n\t\t\tinfo.Installable = true\n\t\tdefault:\n\t\t\tinfo.Installable = false\n\t\t\tinfo.InstallNote = "Automatic installation is not available on this operating system."\n\t\t}\n\t}\n\treturn info, nil\n}\n\nfunc isJACoBReleaseTag(tag string) bool {\n\ttag = strings.TrimSpace(strings.TrimPrefix(strings.TrimPrefix(tag, "v"), "V"))\n\tif tag == "" {\n\t\treturn false\n\t}\n\treturn tag[0] >= \'0\' && tag[0] <= \'9\'\n}'

          for name, content in FILES.items():
              path=Path(name); path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists() and path.read_text(encoding='utf-8') == content:
                  continue
              path.write_text(content, encoding='utf-8')

          # Preserve any live registry. Only seed these files when they do not exist yet.
          index=Path('registry/index.json'); index.parent.mkdir(parents=True, exist_ok=True)
          if not index.exists(): index.write_text('{"schema": 1, "tabs": []}\n', encoding='utf-8')
          stats=Path('registry/stats.json')
          if not stats.exists(): stats.write_text('{"schema": 1, "generatedAt": "", "downloads": {}}\n', encoding='utf-8')

          store=Path('internal/customtabs/store.go')
          s=store.read_text(encoding='utf-8')
          if 'Community *CommunityInfo `json:"community,omitempty"`' not in s:
              needle='\tUpdatedAt string `json:"updatedAt"`\n'
              if needle not in s: raise SystemExit('store.go Tab anchor not found; aborting without commit')
              s=s.replace(needle, needle+'\tCommunity *CommunityInfo `json:"community,omitempty"`\n',1)
          if '"dashboard", "community", "tabmanager"' not in s:
              old='var defaultNavIDs = []string{"dashboard", "tabmanager", "tutorial", "settings"}'
              new='var defaultNavIDs = []string{"dashboard", "community", "tabmanager", "tutorial", "settings"}'
              if old not in s: raise SystemExit('store.go default navigation anchor not found; aborting without commit')
              s=s.replace(old,new,1)
          store.write_text(s,encoding='utf-8')

          server=Path('internal/core/server.go')
          s=server.read_text(encoding='utf-8')
          if 'case "tabs.community.set":' not in s:
              anchor='\tcase "tabs.save":\n'
              if anchor not in s: raise SystemExit('server.go tabs.save anchor not found; aborting without commit')
              s=s.replace(anchor, SERVER_CASE+anchor,1)
          server.write_text(s,encoding='utf-8')

          # Built-in Community page.
          index_html=Path('internal/webui/assets/index.html')
          s=index_html.read_text(encoding='utf-8')
          if 'id="community" class="panel-page"' not in s:
              anchor='<section id="tabmanager" class="panel-page">'
              if anchor not in s: raise SystemExit('index.html Tab Manager anchor not found; aborting without commit')
              s=s.replace(anchor, COMMUNITY_PAGE+'\n'+anchor,1)
          index_html.write_text(s,encoding='utf-8')

          style_path=Path('internal/webui/assets/styles.css')
          s=style_path.read_text(encoding='utf-8')
          if '/* Community Tabs */' not in s:
              s=s.rstrip()+'\n\n'+COMMUNITY_STYLES.rstrip()+'\n'
          style_path.write_text(s,encoding='utf-8')

          app=Path('internal/webui/assets/app.js')
          s=app.read_text(encoding='utf-8')
          # Replace the v1 author block if present; otherwise insert the full v2 block.
          anchor='  async function deleteSavedTab(id){'
          if anchor not in s: raise SystemExit('app.js deleteSavedTab anchor not found; aborting without commit')
          start=s.find('  const COMMUNITY_SUBMISSION_URL=')
          if start >= 0:
              end=s.find(anchor,start)
              if end < 0: raise SystemExit('app.js Community block end not found')
              s=s[:start]+UI+'\n'+s[end:]
          else:
              s=s.replace(anchor,UI+'\n'+anchor,1)
          # Share/update/remix button in Saved Tabs.
          if "const share=document.createElement('button');share.textContent=" not in s:
              old="edit.onclick=()=>editSavedTab(tab.id);const perms=document.createElement('button');"
              repl="edit.onclick=()=>editSavedTab(tab.id);const share=document.createElement('button');share.textContent=tab.community?.packageId?(tab.community.localAuthor?'Publish update':'Community…'):'Share';share.className='secondary';share.title=tab.community?.packageId?'Publish an update or create a remix':'Prepare this tab for Community Tabs';share.onclick=()=>openCommunityShare(tab.id);const perms=document.createElement('button');"
              if old not in s: raise SystemExit('app.js saved-tab action anchor not found; aborting without commit')
              s=s.replace(old,repl,1)
          if 'actions.append(open,edit,share,perms,del);' not in s:
              old='actions.append(open,edit,perms,del);'
              if old not in s: raise SystemExit('app.js action append anchor not found; aborting without commit')
              s=s.replace(old,'actions.append(open,edit,share,perms,del);',1)
          # Default navigation model.
          old="const defaultNav={dashboard:'Home',tabmanager:'Tab Manager',tutorial:'Tutorial',settings:'Settings'};"
          new="const defaultNav={dashboard:'Home',community:'Community',tabmanager:'Tab Manager',tutorial:'Tutorial',settings:'Settings'};"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('app.js defaultNav anchor not found; aborting without commit')
          old="const expected=['dashboard',...state.savedTabs.map(navIDForTab),'tabmanager','tutorial','settings'];"
          new="const expected=['dashboard','community',...state.savedTabs.map(navIDForTab),'tabmanager','tutorial','settings'];"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('app.js navigationOrder anchor not found; aborting without commit')
          # Wire the Community browser once during normal shell setup.
          wire="  if($('#community-refresh'))communityWireBrowser();\n"
          if 'communityWireBrowser();' not in s:
              old="  if($('#home-add-tab'))$('#home-add-tab').onclick=()=>switchTab('tabmanager');\n"
              if old not in s: raise SystemExit('app.js UI wiring anchor not found; aborting without commit')
              s=s.replace(old,old+wire,1)
          hello="state.core=data;state.updating=false;"
          if "communityRegistryLoadedAt)setTimeout(()=>communityLoadRegistry()" not in s:
              if hello not in s: raise SystemExit('app.js core.hello anchor not found; aborting without commit')
              s=s.replace(hello,hello+"if(!communityRegistryLoadedAt)setTimeout(()=>communityLoadRegistry().catch(()=>{}),50);",1)
          app.write_text(s,encoding='utf-8')

          # Community releases share the repository with JACoB application releases.
          # Make the app updater ignore community tags and page until it finds a real app release.
          updater=Path('internal/updater/updater.go')
          s=updater.read_text(encoding='utf-8')
          if 'func isJACoBReleaseTag(tag string) bool' not in s:
              pattern=r'func \(c \*Client\) Check\(ctx context\.Context\) \(Info, error\) \{.*?\n\}\n\nfunc selectAsset'
              m=re.search(pattern,s,re.S)
              if not m: raise SystemExit('updater.go Check function anchor not found; aborting without commit')
              s=s[:m.start()]+UPDATER_CHECK+'\n\nfunc selectAsset'+s[m.end():]
          updater.write_text(s,encoding='utf-8')
          PY

      - name: Format and validate
        shell: bash
        run: |
          gofmt -w internal/customtabs/store.go internal/customtabs/community.go internal/customtabs/community_test.go internal/core/server.go internal/updater/updater.go
          python3 -m py_compile scripts/process_community_submission.py scripts/validate_community_registry.py scripts/rebuild_community_stats.py
          python3 scripts/validate_community_registry.py --root .
          node --check internal/webui/assets/app.js
          go test ./...

      - name: Commit tested changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Community Tabs v2 is already applied."
            exit 0
          fi
          git config user.name "JACoB Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/customtabs internal/core/server.go internal/updater/updater.go internal/webui/assets/index.html internal/webui/assets/styles.css internal/webui/assets/app.js registry scripts .github/ISSUE_TEMPLATE/community-tab.yml .github/workflows/community-tab-submission.yml .github/workflows/validate-community-registry.yml .github/workflows/publish-community-packages.yml .github/workflows/community-registry-stats.yml
          git commit -m "Add Community Tabs browser and sharing workflow"
          git push origin HEAD:${{ github.event.repository.default_branch }}
