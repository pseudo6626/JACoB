name: Apply Community Tabs v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply Community Tabs v2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          FILES = {'.github/ISSUE_TEMPLATE/community-tab.yml': 'name: Publish or update a JACoB Community Tab\ndescription: Upload the submission file generated by JACoB. No code or registry editing required.\ntitle: "[Community Tab] "\nbody:\n  - type: markdown\n    attributes:\n      value: |\n        ## Submit a Community Tab\n        Use **Tab Manager → Share** in JACoB to prepare your submission first.\n\n        JACoB creates a `.jacobsubmit.json` file containing the tab HTML and all registry metadata. Upload that file below and submit this form. GitHub will use your account as the maintainer identity for new tabs and remixes, and will verify maintainer access for updates.\n\n        **The uploaded tab will be public.** Do not submit passwords, private API keys, personal information, or anything else that should not be published.\n  - type: upload\n    id: submission\n    attributes:\n      label: JACoB submission file\n      description: Upload the `.jacobsubmit.json` file created by JACoB.\n    validations:\n      required: true\n      accept: ".json"\n  - type: checkboxes\n    id: public-confirmation\n    attributes:\n      label: Public submission\n      options:\n        - label: I understand that this tab and its source HTML will be public if accepted into Community Tabs.\n          required: true\n', '.github/workflows/community-tab-submission.yml': 'name: Process Community Tab Submission\n\non:\n  issues:\n    types: [opened, edited, reopened]\n\npermissions:\n  contents: write\n  pull-requests: write\n  issues: write\n\njobs:\n  process:\n    if: startsWith(github.event.issue.title, \'[Community Tab]\')\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - name: Find uploaded submission\n        id: attachment\n        env:\n          ISSUE_BODY: ${{ github.event.issue.body }}\n        run: |\n          python3 - <<\'PY\' >> "$GITHUB_OUTPUT"\n          import os, re\n          body = os.environ.get(\'ISSUE_BODY\', \'\')\n          urls = re.findall(r\'https://github\\.com/user-attachments/files/[^\\s)]+\\.json(?:\\?[^\\s)]*)?\', body)\n          print(\'url=\' + (urls[0] if urls else \'\'))\n          PY\n\n      - name: Ask for a submission file when missing\n        if: steps.attachment.outputs.url == \'\'\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          gh issue comment "${{ github.event.issue.number }}" --body "JACoB could not find a **.json** submission attachment in this issue. Edit the issue and upload the file created by **Tab Manager → Community**, then save the edit."\n\n      - name: Stop when no attachment is present\n        if: steps.attachment.outputs.url == \'\'\n        run: exit 0\n\n      - name: Download submission\n        if: steps.attachment.outputs.url != \'\'\n        run: |\n          curl -fL --retry 3 --max-filesize 10000000 "${{ steps.attachment.outputs.url }}" -o /tmp/jacob-submission.json\n\n      - name: Reset submission branch from current main\n        if: steps.attachment.outputs.url != \'\'\n        run: |\n          branch="community-submission-${{ github.event.issue.number }}"\n          git checkout -B "$branch" "${{ github.event.repository.default_branch }}"\n          echo "BRANCH=$branch" >> "$GITHUB_ENV"\n\n      - name: Validate and write registry changes\n        if: steps.attachment.outputs.url != \'\'\n        id: process\n        env:\n          ACTOR: ${{ github.event.issue.user.login }}\n          ISSUE: ${{ github.event.issue.number }}\n        run: |\n          set +e\n          python3 scripts/process_community_submission.py /tmp/jacob-submission.json \\\n            --actor "$ACTOR" --issue "$ISSUE" --root . --summary /tmp/community-summary.json \\\n            > /tmp/process-out.txt 2> /tmp/process-error.txt\n          status=$?\n          set -e\n          if [ "$status" -ne 0 ]; then\n            echo "failed=true" >> "$GITHUB_OUTPUT"\n            {\n              echo "message<<EOF"\n              cat /tmp/process-error.txt\n              echo "EOF"\n            } >> "$GITHUB_OUTPUT"\n            exit 0\n          fi\n          echo "failed=false" >> "$GITHUB_OUTPUT"\n          python3 scripts/validate_community_registry.py --root .\n          python3 - <<\'PY\' >> "$GITHUB_OUTPUT"\n          import json\n          s=json.load(open(\'/tmp/community-summary.json\'))\n          for key in (\'id\',\'name\',\'version\',\'action\'):\n              print(f"{key}={s[key]}")\n          print(\'capabilities=\' + (\', \'.join(s[\'capabilities\']) if s[\'capabilities\'] else \'none\'))\n          print(\'capability_mismatch=\' + str(bool(s[\'capabilityMismatch\'])).lower())\n          PY\n\n      - name: Comment validation failure\n        if: steps.attachment.outputs.url != \'\' && steps.process.outputs.failed == \'true\'\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          ERROR_TEXT: ${{ steps.process.outputs.message }}\n        run: |\n          gh issue comment "${{ github.event.issue.number }}" --body "### Submission needs attention\n\n          JACoB\'s registry validator rejected this file:\n\n          \\`\\`\\`\n          $ERROR_TEXT\n          \\`\\`\\`\n\n          Fix the tab in JACoB, prepare a new submission file, and replace the attachment in this issue."\n\n      - name: Stop after validation failure\n        if: steps.attachment.outputs.url != \'\' && steps.process.outputs.failed == \'true\'\n        run: exit 0\n\n      - name: Commit registry proposal\n        if: steps.attachment.outputs.url != \'\' && steps.process.outputs.failed == \'false\'\n        run: |\n          git config user.name "JACoB Registry Bot"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add registry\n          git commit -m "Community tab: ${{ steps.process.outputs.name }} ${{ steps.process.outputs.version }} (#${{ github.event.issue.number }})"\n          git push --force origin "HEAD:$BRANCH"\n\n      - name: Create or refresh review PR\n        if: steps.attachment.outputs.url != \'\' && steps.process.outputs.failed == \'false\'\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          existing="$(gh pr list --head "$BRANCH" --state open --json url --jq \'.[0].url // empty\')"\n          body=$(cat <<EOF\n          Automated Community Tabs proposal from #${{ github.event.issue.number }}.\n\n          - **Action:** ${{ steps.process.outputs.action }}\n          - **Package:** \\`${{ steps.process.outputs.id }}\\`\n          - **Version:** ${{ steps.process.outputs.version }}\n          - **Detected capabilities:** ${{ steps.process.outputs.capabilities }}\n\n          JACoB generated the version/hash/package metadata. The workflow independently recomputed the HTML hash, size and capability groups before creating this PR.\n\n          Closes #${{ github.event.issue.number }}\n          EOF\n          )\n          if [ -z "$existing" ]; then\n            existing="$(gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "Community tab: ${{ steps.process.outputs.name }} ${{ steps.process.outputs.version }}" --body "$body")"\n          else\n            gh pr edit "$existing" --title "Community tab: ${{ steps.process.outputs.name }} ${{ steps.process.outputs.version }}" --body "$body"\n          fi\n          gh issue comment "${{ github.event.issue.number }}" --body "### Submission validated\n\n          JACoB checked the package, recomputed its SHA-256 and size, and detected these sensitive capability groups: **${{ steps.process.outputs.capabilities }}**.\n\n          Review PR: $existing"\n', '.github/workflows/validate-community-registry.yml': "name: Validate Community Registry\n\non:\n  pull_request:\n    paths:\n      - 'registry/**'\n      - 'scripts/process_community_submission.py'\n      - 'scripts/validate_community_registry.py'\n      - 'scripts/rebuild_community_stats.py'\n      - '.github/workflows/community-tab-submission.yml'\n      - '.github/ISSUE_TEMPLATE/community-tab.yml'\n\npermissions:\n  contents: read\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Validate registry\n        run: |\n          python3 -m py_compile scripts/process_community_submission.py scripts/validate_community_registry.py scripts/rebuild_community_stats.py\n          python3 scripts/validate_community_registry.py --root .\n", 'scripts/process_community_submission.py': '#!/usr/bin/env python3\nfrom __future__ import annotations\n\nimport argparse\nimport base64\nimport hashlib\nimport json\nimport re\nimport sys\nfrom dataclasses import dataclass\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nMAX_HTML_BYTES = 4 * 1024 * 1024\nPACKAGE_RE = re.compile(r"^community\\.[a-z0-9][a-z0-9-]{0,47}\\.[a-f0-9]{6}$")\nSEMVER_RE = re.compile(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$")\nALLOWED_ACTIONS = {"publish", "update", "remix"}\nALLOWED_CATEGORIES = {"accessibility", "bgs", "combat", "engineering", "exploration", "fleet-carrier", "hud", "mining", "navigation", "racing", "trading", "utility", "other"}\nCAPABILITY_PATTERNS = {\n    "clipboard": (r"\\bElite\\.clipboard\\b",),\n    "control": (r"\\bElite\\.(?:input|bindings|macros)\\b",),\n    "network": (r"\\bElite\\.(?:net|catalog)\\b",),\n    "recorder": (r"\\bElite\\.recorder\\b",),\n    "overlay": (r"\\bElite\\.(?:overlay|hud)\\b",),\n    "video": (r"\\bElite\\.video\\b",),\n    "vision": (r"\\bElite\\.(?:vision|spatial)\\b",),\n    "intertab": (r"\\bElite\\.actions\\.invoke\\b",),\n}\n\nclass SubmissionError(Exception):\n    pass\n\n\ndef load_json(path: Path):\n    try:\n        return json.loads(path.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError) as exc:\n        raise SubmissionError(f"could not read JSON: {exc}") from exc\n\n\ndef semver_tuple(value: str):\n    m = SEMVER_RE.fullmatch(value or "")\n    if not m:\n        raise SubmissionError(f"invalid version: {value!r}")\n    return tuple(int(x) for x in m.groups())\n\n\ndef detect_capabilities(html: str):\n    found = []\n    for capability, patterns in CAPABILITY_PATTERNS.items():\n        if any(re.search(pattern, html) for pattern in patterns):\n            found.append(capability)\n    return sorted(found)\n\n\ndef normalized_tags(raw):\n    if not isinstance(raw, list):\n        return []\n    out = []\n    seen = set()\n    for item in raw:\n        tag = re.sub(r"[^a-z0-9-]+", "-", str(item).strip().lower()).strip("-")[:32]\n        if tag and tag not in seen:\n            out.append(tag)\n            seen.add(tag)\n        if len(out) >= 12:\n            break\n    return out\n\n\ndef decode_html(source):\n    if not isinstance(source, dict) or source.get("encoding") != "base64":\n        raise SubmissionError("source.encoding must be base64")\n    encoded = source.get("html", "")\n    if not isinstance(encoded, str) or not encoded:\n        raise SubmissionError("submission does not contain tab HTML")\n    try:\n        raw = base64.b64decode(encoded, validate=True)\n    except Exception as exc:\n        raise SubmissionError("tab HTML is not valid base64") from exc\n    if not raw or len(raw) > MAX_HTML_BYTES:\n        raise SubmissionError(f"tab HTML must be between 1 byte and {MAX_HTML_BYTES} bytes")\n    try:\n        html = raw.decode("utf-8")\n    except UnicodeDecodeError as exc:\n        raise SubmissionError("tab HTML must be UTF-8") from exc\n    if "\\x00" in html:\n        raise SubmissionError("tab HTML contains NUL bytes")\n    actual_hash = hashlib.sha256(raw).hexdigest()\n    declared_hash = str(source.get("sha256", "")).lower()\n    declared_size = source.get("sizeBytes")\n    if declared_hash != actual_hash:\n        raise SubmissionError("SHA-256 does not match the submitted HTML")\n    if declared_size != len(raw):\n        raise SubmissionError("sizeBytes does not match the submitted HTML")\n    return raw, html, actual_hash\n\n\ndef manifest_path(root: Path, package_id: str):\n    return root / "registry" / "tabs" / f"{package_id}.json"\n\n\ndef read_existing_manifest(root: Path, package_id: str):\n    path = manifest_path(root, package_id)\n    if not path.exists():\n        return None\n    data = load_json(path)\n    if data.get("id") != package_id:\n        raise SubmissionError(f"existing manifest {path} has the wrong id")\n    return data\n\n\ndef validate_submission(data, actor: str, root: Path):\n    if not isinstance(data, dict) or data.get("kind") != "jacob-community-submission" or data.get("schema") != 1:\n        raise SubmissionError("not a JACoB community submission v1 file")\n    action = str(data.get("action", ""))\n    if action not in ALLOWED_ACTIONS:\n        raise SubmissionError("action must be publish, update, or remix")\n\n    tab = data.get("tab")\n    if not isinstance(tab, dict):\n        raise SubmissionError("missing tab metadata")\n    package_id = str(tab.get("packageId", "")).strip().lower()\n    if not PACKAGE_RE.fullmatch(package_id):\n        raise SubmissionError("packageId is invalid")\n    name = str(tab.get("name", "")).strip()\n    description = str(tab.get("description", "")).strip()\n    author = str(tab.get("author", "")).strip()\n    version = str(tab.get("version", "")).strip()\n    if not name or len(name) > 80:\n        raise SubmissionError("tab name must be 1-80 characters")\n    if not description or len(description) > 500:\n        raise SubmissionError("description must be 1-500 characters")\n    if not author or len(author) > 80:\n        raise SubmissionError("author/display name must be 1-80 characters")\n    version_tuple = semver_tuple(version)\n    category = str(tab.get("category", "utility")).strip().lower() or "utility"\n    if category not in ALLOWED_CATEGORIES:\n        raise SubmissionError(f"unknown category: {category}")\n    tags = normalized_tags(tab.get("tags", []))\n    notes = str(tab.get("notes", "")).strip()[:2000]\n    sdk = int(tab.get("sdk", 0) or 0)\n    if sdk < 1 or sdk > 999:\n        raise SubmissionError("sdk must be a positive JACoB SDK version")\n\n    raw, html, sha256 = decode_html(data.get("source"))\n    capabilities = detect_capabilities(html)\n    submitted_caps = sorted(set(str(x) for x in data.get("detectedCapabilities", []) if isinstance(x, str)))\n    capability_mismatch = capabilities != submitted_caps\n\n    existing = read_existing_manifest(root, package_id)\n    based_on = None\n    if action == "publish":\n        if existing is not None:\n            raise SubmissionError("that package ID is already published; use Publish update")\n        if version != "1.0.0":\n            raise SubmissionError("new community tabs must start at version 1.0.0")\n        maintainers = [actor]\n    elif action == "update":\n        if existing is None:\n            raise SubmissionError("cannot update a package that is not in the registry")\n        maintainers = existing.get("maintainers") or []\n        if actor.lower() not in {str(x).lower() for x in maintainers}:\n            raise SubmissionError(f"GitHub user @{actor} is not a maintainer of {package_id}")\n        base_version = str(tab.get("baseVersion", "")).strip()\n        current_version = str(existing.get("version", "")).strip()\n        if base_version != current_version:\n            raise SubmissionError(f"update was based on {base_version or \'an unknown version\'}, but registry currently has {current_version}")\n        if version_tuple <= semver_tuple(current_version):\n            raise SubmissionError("update version must be newer than the published version")\n        based_on = existing.get("derivedFrom")\n    else:  # remix\n        if existing is not None:\n            raise SubmissionError("new remix package ID already exists")\n        if version != "1.0.0":\n            raise SubmissionError("new remixes must start at version 1.0.0")\n        origin = tab.get("basedOn")\n        if not isinstance(origin, dict):\n            raise SubmissionError("remix is missing its upstream package")\n        origin_id = str(origin.get("packageId", "")).strip().lower()\n        origin_version = str(origin.get("version", "")).strip()\n        origin_manifest = read_existing_manifest(root, origin_id)\n        if origin_manifest is None:\n            raise SubmissionError("remix upstream package is not in the registry")\n        if origin_version != str(origin_manifest.get("version", "")):\n            raise SubmissionError("remix must identify the current upstream version")\n        based_on = {"id": origin_id, "version": origin_version}\n        maintainers = [actor]\n\n    return {\n        "action": action,\n        "packageId": package_id,\n        "name": name,\n        "description": description,\n        "author": author,\n        "version": version,\n        "category": category,\n        "tags": tags,\n        "notes": notes,\n        "sdk": sdk,\n        "capabilities": capabilities,\n        "capabilityMismatch": capability_mismatch,\n        "maintainers": maintainers,\n        "derivedFrom": based_on,\n        "raw": raw,\n        "sha256": sha256,\n        "sizeBytes": len(raw),\n    }\n\n\ndef write_registry(root: Path, info, issue_number: int):\n    pkg = info["packageId"]\n    version = info["version"]\n    package_dir = root / "registry" / "packages" / pkg\n    package_dir.mkdir(parents=True, exist_ok=True)\n    artifact_path = package_dir / f"{version}.html"\n    if artifact_path.exists():\n        raise SubmissionError(f"artifact already exists for {pkg} {version}")\n    artifact_path.write_bytes(info["raw"])\n\n    relative_artifact = artifact_path.relative_to(root).as_posix()\n    now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")\n    manifest = {\n        "schema": 1,\n        "id": pkg,\n        "name": info["name"],\n        "description": info["description"],\n        "author": info["author"],\n        "maintainers": info["maintainers"],\n        "version": version,\n        "jacobSdk": f">={info[\'sdk\']}",\n        "capabilities": info["capabilities"],\n        "category": info["category"],\n        "tags": info["tags"],\n        "artifact": {\n            "path": relative_artifact,\n            "sha256": info["sha256"],\n            "sizeBytes": info["sizeBytes"],\n        },\n        "updatedAt": now,\n        "sourceIssue": issue_number,\n    }\n    if info.get("derivedFrom"):\n        manifest["derivedFrom"] = info["derivedFrom"]\n    path = manifest_path(root, pkg)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\\n", encoding="utf-8")\n    rebuild_index(root)\n    return manifest\n\n\ndef rebuild_index(root: Path):\n    tabs_dir = root / "registry" / "tabs"\n    tabs_dir.mkdir(parents=True, exist_ok=True)\n    entries = []\n    for path in sorted(tabs_dir.glob("*.json")):\n        entry = load_json(path)\n        entries.append(entry)\n    index = {"schema": 1, "tabs": entries}\n    index_path = root / "registry" / "index.json"\n    index_path.parent.mkdir(parents=True, exist_ok=True)\n    index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + "\\n", encoding="utf-8")\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument("submission", type=Path)\n    parser.add_argument("--actor", required=True)\n    parser.add_argument("--issue", required=True, type=int)\n    parser.add_argument("--root", type=Path, default=Path("."))\n    parser.add_argument("--summary", type=Path)\n    args = parser.parse_args()\n\n    try:\n        data = load_json(args.submission)\n        info = validate_submission(data, args.actor, args.root)\n        manifest = write_registry(args.root, info, args.issue)\n    except SubmissionError as exc:\n        print(f"ERROR: {exc}", file=sys.stderr)\n        return 2\n\n    summary = {\n        "ok": True,\n        "action": info["action"],\n        "id": info["packageId"],\n        "name": info["name"],\n        "version": info["version"],\n        "capabilities": info["capabilities"],\n        "capabilityMismatch": info["capabilityMismatch"],\n        "sha256": info["sha256"],\n        "sizeBytes": info["sizeBytes"],\n        "manifest": manifest,\n    }\n    text = json.dumps(summary, indent=2)\n    print(text)\n    if args.summary:\n        args.summary.write_text(text + "\\n", encoding="utf-8")\n    return 0\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n', 'scripts/validate_community_registry.py': '#!/usr/bin/env python3\nfrom __future__ import annotations\nimport argparse, hashlib, json, re, sys\nfrom pathlib import Path\n\nMAX_HTML_BYTES=4*1024*1024\nPACKAGE_RE=re.compile(r\'^community\\.[a-z0-9][a-z0-9-]{0,47}\\.[a-f0-9]{6}$\')\nSEMVER_RE=re.compile(r\'^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$\')\nALLOWED_CAPS={\'clipboard\',\'control\',\'network\',\'recorder\',\'overlay\',\'video\',\'vision\',\'intertab\'}\nALLOWED_CATEGORIES={\'accessibility\',\'bgs\',\'combat\',\'engineering\',\'exploration\',\'fleet-carrier\',\'hud\',\'mining\',\'navigation\',\'racing\',\'trading\',\'utility\',\'other\'}\n\n\ndef load(path): return json.loads(path.read_text(encoding=\'utf-8\'))\n\ndef fail(msg): raise ValueError(msg)\n\ndef validate_manifest(root,path):\n    m=load(path)\n    if m.get(\'schema\')!=1: fail(f\'{path}: schema must be 1\')\n    pid=str(m.get(\'id\',\'\'))\n    if not PACKAGE_RE.fullmatch(pid): fail(f\'{path}: invalid id\')\n    if path.name != pid+\'.json\': fail(f\'{path}: filename must match id\')\n    if not str(m.get(\'name\',\'\')).strip(): fail(f\'{path}: missing name\')\n    if not str(m.get(\'description\',\'\')).strip(): fail(f\'{path}: missing description\')\n    if not str(m.get(\'author\',\'\')).strip(): fail(f\'{path}: missing author\')\n    maintainers=m.get(\'maintainers\')\n    if not isinstance(maintainers,list) or not maintainers or any(not str(x).strip() for x in maintainers): fail(f\'{path}: maintainers required\')\n    if not SEMVER_RE.fullmatch(str(m.get(\'version\',\'\'))): fail(f\'{path}: invalid version\')\n    sdk=str(m.get(\'jacobSdk\',\'\'))\n    if not re.fullmatch(r\'>=\\d+\',sdk): fail(f\'{path}: jacobSdk must look like >=15\')\n    category=str(m.get(\'category\',\'utility\')).strip().lower()\n    if category not in ALLOWED_CATEGORIES: fail(f\'{path}: invalid category\')\n    caps=m.get(\'capabilities\',[])\n    if not isinstance(caps,list) or any(c not in ALLOWED_CAPS for c in caps): fail(f\'{path}: unknown capability\')\n    if caps != sorted(set(caps)): fail(f\'{path}: capabilities must be sorted and unique\')\n    art=m.get(\'artifact\')\n    if not isinstance(art,dict): fail(f\'{path}: artifact required\')\n    rel=str(art.get(\'path\',\'\'))\n    expected=f"registry/packages/{pid}/{m[\'version\']}.html"\n    if rel!=expected: fail(f\'{path}: artifact.path must be {expected}\')\n    ap=(root/rel).resolve(); rr=root.resolve()\n    if rr not in ap.parents: fail(f\'{path}: artifact escapes repository\')\n    if not ap.exists(): fail(f\'{path}: artifact is missing\')\n    raw=ap.read_bytes()\n    if not raw or len(raw)>MAX_HTML_BYTES: fail(f\'{path}: artifact size invalid\')\n    if len(raw)!=art.get(\'sizeBytes\'): fail(f\'{path}: artifact sizeBytes mismatch\')\n    sha=hashlib.sha256(raw).hexdigest()\n    if sha!=str(art.get(\'sha256\',\'\')).lower(): fail(f\'{path}: artifact sha256 mismatch\')\n    derived=m.get(\'derivedFrom\')\n    if derived is not None:\n        if not isinstance(derived,dict) or not PACKAGE_RE.fullmatch(str(derived.get(\'id\',\'\'))) or not SEMVER_RE.fullmatch(str(derived.get(\'version\',\'\'))):\n            fail(f\'{path}: invalid derivedFrom\')\n    return m\n\n\ndef main():\n    p=argparse.ArgumentParser();p.add_argument(\'--root\',type=Path,default=Path(\'.\'));a=p.parse_args();root=a.root\n    tabs_dir=root/\'registry\'/\'tabs\'; manifests=[]\n    try:\n        for path in sorted(tabs_dir.glob(\'*.json\')): manifests.append(validate_manifest(root,path))\n        idx_path=root/\'registry\'/\'index.json\';idx=load(idx_path)\n        if idx.get(\'schema\')!=1: fail(\'registry/index.json: schema must be 1\')\n        if idx.get(\'tabs\')!=manifests: fail(\'registry/index.json is stale; rebuild it from registry/tabs\')\n        ids={m[\'id\'] for m in manifests}\n        stats_path=root/\'registry\'/\'stats.json\'\n        if stats_path.exists():\n            stats=load(stats_path)\n            if stats.get(\'schema\')!=1 or not isinstance(stats.get(\'downloads\',{}),dict): fail(\'registry/stats.json: invalid format\')\n            for key,value in stats.get(\'downloads\',{}).items():\n                if key not in ids: fail(f\'registry/stats.json: unknown package {key}\')\n                if not isinstance(value,int) or value<0: fail(f\'registry/stats.json: invalid download count for {key}\')\n        for m in manifests:\n            d=m.get(\'derivedFrom\')\n            if d and d[\'id\'] not in ids: fail(f"{m[\'id\']}: derivedFrom package {d[\'id\']} is missing")\n    except (ValueError,OSError,json.JSONDecodeError) as e:\n        print(\'ERROR:\',e,file=sys.stderr);return 2\n    print(f\'Community registry valid: {len(manifests)} tab(s).\')\n    return 0\nif __name__==\'__main__\': raise SystemExit(main())\n', 'registry/README.md': "# JACoB Community Tabs registry\n\nThe official Community Tabs registry lives in this repository. Tab authors do not edit these files directly.\n\nAuthors build and test a normal self-contained JACoB HTML tab, then use **Tab Manager → Share**. JACoB generates a `.jacobsubmit.json` file. The author signs in to GitHub, uploads that file to the Community Tab issue form, and submits it. GitHub supplies the maintainer identity; JACoB never receives the author's GitHub credentials.\n\nAccepted submissions are stored under:\n\n- `registry/tabs/<package-id>.json` — current searchable metadata\n- `registry/packages/<package-id>/<version>.html` — immutable HTML versions\n- `registry/index.json` — generated browser index\n- `registry/stats.json` — aggregate GitHub release download counts\n\nCurrent categories: accessibility, bgs, combat, engineering, exploration, fleet-carrier, hud, mining, navigation, racing, trading, utility, other.\n\nThe accepted package version is mirrored to a GitHub release asset after merge. Community installs prefer that release asset so GitHub can provide an aggregate download count. JACoB falls back to the repository copy if the release mirror is temporarily unavailable. Download statistics are aggregate counts only; the registry does not receive a JACoB user ID or installation history.\n\nUpdates must be submitted from a GitHub account already listed in the package's `maintainers`. A remix receives a new package ID while retaining its upstream package/version in `derivedFrom`.\n\nRegistry PRs are validated automatically. Submission HTML is treated as untrusted data and is never executed by the registry workflow.\n", 'internal/customtabs/community.go': 'package customtabs\n\nimport (\n\t"errors"\n\t"strings"\n)\n\ntype CommunityOrigin struct {\n\tPackageID string `json:"packageId"`\n\tVersion   string `json:"version"`\n}\n\ntype CommunityInfo struct {\n\tPackageID            string           `json:"packageId"`\n\tPublishedVersion     string           `json:"publishedVersion,omitempty"`\n\tLastSubmittedVersion string           `json:"lastSubmittedVersion,omitempty"`\n\tPublishedSHA256      string           `json:"publishedSha256,omitempty"`\n\tRegistry             string           `json:"registry,omitempty"`\n\tAuthor               string           `json:"author,omitempty"`\n\tDescription          string           `json:"description,omitempty"`\n\tCategory             string           `json:"category,omitempty"`\n\tTags                 []string         `json:"tags,omitempty"`\n\tBasedOn              *CommunityOrigin `json:"basedOn,omitempty"`\n\tLocalAuthor          bool             `json:"localAuthor,omitempty"`\n\tStatus               string           `json:"status,omitempty"`\n}\n\nfunc (s *Store) SetCommunity(id string, info *CommunityInfo) (Tab, error) {\n\tid = strings.TrimSpace(id)\n\tif !validTabID(id) {\n\t\treturn Tab{}, errors.New("invalid saved tab id")\n\t}\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\n\told, ok := s.tabs[id]\n\tif !ok {\n\t\treturn Tab{}, errors.New("saved tab not found")\n\t}\n\tt := old\n\tt.Community = cloneCommunityInfo(info)\n\ts.tabs[id] = t\n\tif err := s.persistLocked(); err != nil {\n\t\ts.tabs[id] = old\n\t\treturn Tab{}, err\n\t}\n\treturn t, nil\n}\n\nfunc cloneCommunityInfo(in *CommunityInfo) *CommunityInfo {\n\tif in == nil {\n\t\treturn nil\n\t}\n\tout := *in\n\tout.Tags = append([]string(nil), in.Tags...)\n\tif in.BasedOn != nil {\n\t\torigin := *in.BasedOn\n\t\tout.BasedOn = &origin\n\t}\n\treturn &out\n}\n', 'internal/customtabs/community_test.go': 'package customtabs\n\nimport "testing"\n\nfunc TestSetCommunityPersistsMetadata(t *testing.T) {\n\ts, err := New(t.TempDir())\n\tif err != nil { t.Fatal(err) }\n\ttab, err := s.Save("", "Example", "<!doctype html><title>Example</title>")\n\tif err != nil { t.Fatal(err) }\n\tmeta := &CommunityInfo{PackageID:"community.example.a1b2c3",LastSubmittedVersion:"1.0.0",Author:"CMDR Example",Tags:[]string{"utility"},LocalAuthor:true,Status:"prepared"}\n\tif _, err := s.SetCommunity(tab.ID, meta); err != nil { t.Fatal(err) }\n\tgot, ok := s.Get(tab.ID)\n\tif !ok || got.Community == nil { t.Fatalf("community metadata missing: %#v", got) }\n\tif got.Community.PackageID != meta.PackageID || got.Community.LastSubmittedVersion != "1.0.0" { t.Fatalf("unexpected metadata: %#v", got.Community) }\n\n\ts2, err := New(s.Directory())\n\tif err != nil { t.Fatal(err) }\n\tgot, ok = s2.Get(tab.ID)\n\tif !ok || got.Community == nil || got.Community.PackageID != meta.PackageID { t.Fatalf("metadata did not persist: %#v", got.Community) }\n}\n', 'scripts/rebuild_community_stats.py': "#!/usr/bin/env python3\nfrom __future__ import annotations\nimport argparse, json, sys\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nPREFIX='community--'\nSEPARATOR='--v'\n\ndef main():\n    p=argparse.ArgumentParser();p.add_argument('--root',type=Path,default=Path('.'));a=p.parse_args()\n    downloads={}\n    for raw in sys.stdin:\n        raw=raw.rstrip('\\n')\n        if not raw: continue\n        try: tag,count=raw.split('\\t',1); count=int(count)\n        except ValueError: continue\n        if not tag.startswith(PREFIX) or SEPARATOR not in tag: continue\n        package=tag[len(PREFIX):].rsplit(SEPARATOR,1)[0]\n        if not package.startswith('community.'): continue\n        downloads[package]=downloads.get(package,0)+max(0,count)\n    path=a.root/'registry'/'stats.json'; path.parent.mkdir(parents=True,exist_ok=True)\n    old={}\n    if path.exists():\n        try: old=json.loads(path.read_text(encoding='utf-8'))\n        except Exception: old={}\n    if old.get('schema')==1 and old.get('downloads')==downloads:\n        print('Community download statistics unchanged.')\n        return 0\n    data={'schema':1,'generatedAt':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'downloads':dict(sorted(downloads.items()))}\n    path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\\n',encoding='utf-8')\n    print(f'Updated download statistics for {len(downloads)} package(s).')\n    return 0\nif __name__=='__main__': raise SystemExit(main())\n", '.github/workflows/publish-community-packages.yml': 'name: Publish Community Tab Packages\n\non:\n  push:\n    branches: [main]\n    paths:\n      - \'registry/tabs/**\'\n      - \'registry/packages/**\'\n\npermissions:\n  contents: write\n\njobs:\n  publish:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - name: Publish current registry versions as GitHub release assets\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        shell: bash\n        run: |\n          python3 - <<\'PY\' > /tmp/community-current.tsv\n          import json\n          from pathlib import Path\n          for path in sorted(Path(\'registry/tabs\').glob(\'*.json\')):\n              m=json.loads(path.read_text(encoding=\'utf-8\'))\n              print(\'\\t\'.join([m[\'id\'],m[\'version\'],m[\'artifact\'][\'path\']]))\n          PY\n          while IFS=$\'\\t\' read -r package version artifact; do\n            [ -n "$package" ] || continue\n            [ -f "$artifact" ] || { echo "Missing $artifact" >&2; exit 1; }\n            tag="community--${package}--v${version}"\n            if gh release view "$tag" >/dev/null 2>&1; then\n              gh release upload "$tag" "$artifact" --clobber\n            else\n              gh release create "$tag" "$artifact" \\\n                --title "Community Tab: ${package} ${version}" \\\n                --notes "JACoB Community Tab package. Install through JACoB\'s Community tab." \\\n                --prerelease --latest=false\n            fi\n          done < /tmp/community-current.tsv\n\n      - name: Refresh aggregate download counts\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        shell: bash\n        run: |\n          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \\\n            --jq \'.[] | [.tag_name, ([.assets[].download_count] | add // 0)] | @tsv\' \\\n            | python3 scripts/rebuild_community_stats.py --root .\n          if git diff --quiet -- registry/stats.json; then\n            exit 0\n          fi\n          git config user.name "JACoB Registry Bot"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add registry/stats.json\n          git commit -m "Update Community Tab download counts [skip ci]"\n          git push\n', '.github/workflows/community-registry-stats.yml': 'name: Refresh Community Tab Statistics\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: \'17 5 * * *\'\n\npermissions:\n  contents: write\n\njobs:\n  stats:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Rebuild aggregate download counts\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        shell: bash\n        run: |\n          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \\\n            --jq \'.[] | [.tag_name, ([.assets[].download_count] | add // 0)] | @tsv\' \\\n            | python3 scripts/rebuild_community_stats.py --root .\n          if git diff --quiet -- registry/stats.json; then\n            exit 0\n          fi\n          git config user.name "JACoB Registry Bot"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add registry/stats.json\n          git commit -m "Update Community Tab download counts [skip ci]"\n          git push\n'}
          UI = '  const COMMUNITY_SUBMISSION_URL=\'https://github.com/pseudo6626/JACoB/issues/new?template=community-tab.yml\';\n  function communitySlug(value){return String(value||\'tab\').toLowerCase().normalize(\'NFKD\').replace(/[^a-z0-9]+/g,\'-\').replace(/^-+|-+$/g,\'\').slice(0,48)||\'tab\'}\n  function communityRandomHex(bytes=3){const buf=new Uint8Array(bytes);crypto.getRandomValues(buf);return [...buf].map(x=>x.toString(16).padStart(2,\'0\')).join(\'\')}\n  function communityPackageID(name){return `community.${communitySlug(name)}.${communityRandomHex(3)}`}\n  function communityVersionTuple(v){const m=String(v||\'\').match(/^(\\d+)\\.(\\d+)\\.(\\d+)$/);return m?m.slice(1).map(Number):[1,0,0]}\n  function communityNextVersion(base,change){let [major,minor,patch]=communityVersionTuple(base);if(change===\'breaking\')return `${major+1}.0.0`;if(change===\'feature\')return `${major}.${minor+1}.0`;return `${major}.${minor}.${patch+1}`}\n  function communityDetectCapabilities(html){const rules={clipboard:/\\bElite\\.clipboard\\b/,control:/\\bElite\\.(?:input|bindings|macros)\\b/,network:/\\bElite\\.(?:net|catalog)\\b/,recorder:/\\bElite\\.recorder\\b/,overlay:/\\bElite\\.(?:overlay|hud)\\b/,video:/\\bElite\\.video\\b/,vision:/\\bElite\\.(?:vision|spatial)\\b/,intertab:/\\bElite\\.actions\\.invoke\\b/};return Object.entries(rules).filter(([,re])=>re.test(html)).map(([name])=>name).sort()}\n  async function communitySHA256(bytes){const digest=await crypto.subtle.digest(\'SHA-256\',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,\'0\')).join(\'\')}\n  function communityBytesToBase64(bytes){let binary=\'\';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+chunk)));return btoa(binary)}\n  function communityDownload(name,text){const blob=new Blob([text],{type:\'application/json;charset=utf-8\'}),url=URL.createObjectURL(blob),a=document.createElement(\'a\');a.href=url;a.download=name;a.style.display=\'none\';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}\n  function communityTags(value){return [...new Set(String(value||\'\').split(\',\').map(x=>communitySlug(x)).filter(Boolean))].slice(0,12)}\n  function communityEscape(value){return escapeHTML(String(value??\'\'))}\n  const COMMUNITY_CATEGORIES=[\'accessibility\',\'bgs\',\'combat\',\'engineering\',\'exploration\',\'fleet-carrier\',\'hud\',\'mining\',\'navigation\',\'racing\',\'trading\',\'utility\',\'other\'];\n  function communityCategoryLabel(value){return String(value||\'other\').split(\'-\').map(x=>x?x[0].toUpperCase()+x.slice(1):\'\').join(\' \')}\n  function communityCurrentBase(meta){return meta?.publishedVersion||meta?.lastSubmittedVersion||\'1.0.0\'}\n  async function communityRegistryLookup(packageId){if(!packageId)return null;try{const url=`https://raw.githubusercontent.com/pseudo6626/JACoB/main/registry/tabs/${encodeURIComponent(packageId)}.json`,res=await request(\'net.fetch\',{url,method:\'GET\'});if(Number(res?.status)!==200)return null;return JSON.parse(res.body||\'null\')}catch{return null}}\n  function communityDialog(){let dlg=document.getElementById(\'community-share-dialog\');if(dlg)return dlg;dlg=document.createElement(\'dialog\');dlg.id=\'community-share-dialog\';dlg.style.cssText=\'width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#090d11;color:#e8edf0;border:1px solid #8a430e;padding:0;box-shadow:0 18px 70px #000a;\';dlg.addEventListener(\'click\',ev=>{if(ev.target===dlg)dlg.close()});document.body.appendChild(dlg);return dlg}\n  async function openCommunityShare(id,forcedMode=\'\'){\n    const meta=savedTabMeta(id);if(!meta)return;let tab;\n    try{tab=await ensureSavedTabLoaded(id)}catch(e){$(\'#tab-manager-result\').textContent=pretty(e);return}\n    const c=meta.community||null,hasCommunity=!!c?.packageId,registryEntry=hasCommunity?await communityRegistryLookup(c.packageId):null;\n    let mode=forcedMode||(hasCommunity?(c.localAuthor?\'update\':\'remix\'):\'publish\');\n    const dlg=communityDialog(),base=registryEntry?.version||communityCurrentBase(c);\n    const modeOptions=hasCommunity?`<option value="update" ${mode===\'update\'?\'selected\':\'\'}>Publish update (GitHub verifies maintainer access)</option><option value="remix" ${mode===\'remix\'?\'selected\':\'\'}>Share as a remix</option>`:`<option value="publish">Publish this tab</option>`;\n    dlg.innerHTML=`<form method="dialog" style="padding:22px;display:grid;gap:14px"><div><div class="eyebrow">Community Tabs</div><h2 style="margin:.2em 0">${hasCommunity?\'Share or update\':\'Share this tab\'}</h2><p class="muted">JACoB prepares the version, hash, package ID, capability list and registry metadata. You only describe the tab.</p></div><label>What are you doing?<select id="community-mode" style="width:100%;margin-top:6px">${modeOptions}</select></label><label>Tab<input id="community-name" value="${communityEscape(tab.name)}" readonly style="width:100%;margin-top:6px"></label><label>Your display name<input id="community-author" value="${communityEscape(c?.author||\'\')}" maxlength="80" placeholder="CMDR name or handle" style="width:100%;margin-top:6px"></label><label>What does it do?<textarea id="community-description" maxlength="500" rows="3" placeholder="A short description for people browsing Community Tabs." style="width:100%;margin-top:6px">${communityEscape(c?.description||\'\')}</textarea></label><label>Category<select id="community-category" style="width:100%;margin-top:6px">${COMMUNITY_CATEGORIES.map(x=>`<option value="${x}" ${(c?.category||\'utility\')===x?\'selected\':\'\'}>${communityCategoryLabel(x)}</option>`).join(\'\')}</select></label><label>Tags <span class="muted">(optional, comma separated)</span><input id="community-tags" value="${communityEscape((c?.tags||[]).join(\', \'))}" placeholder="mining, racing, exploration" style="width:100%;margin-top:6px"></label><label id="community-change-wrap" style="${mode===\'update\'?\'\':\'display:none\'}">Type of update<select id="community-change" style="width:100%;margin-top:6px"><option value="fix">Small fix</option><option value="feature">New features</option><option value="breaking">Major / breaking changes</option></select></label><label id="community-notes-wrap" style="${mode===\'publish\'?\'display:none\':\'\'}">What changed?<textarea id="community-notes" maxlength="2000" rows="3" placeholder="A short note for users." style="width:100%;margin-top:6px"></textarea></label><div style="border:1px solid #644016;padding:10px 12px;background:#171007"><strong>Before you publish</strong><div class="muted" style="margin-top:4px">The submission contains the complete HTML for this tab and will become public. Remove passwords, private API keys, personal data, or anything else that should not be published.</div></div><div id="community-preview" class="muted"></div><div class="row" style="justify-content:flex-end"><button value="cancel" class="secondary">Cancel</button><button type="button" id="community-prepare">Prepare submission</button></div></form>`;\n    const modeEl=dlg.querySelector(\'#community-mode\'),changeWrap=dlg.querySelector(\'#community-change-wrap\'),notesWrap=dlg.querySelector(\'#community-notes-wrap\'),preview=dlg.querySelector(\'#community-preview\');\n    const updatePreview=()=>{mode=modeEl.value;changeWrap.style.display=mode===\'update\'?\'\':\'none\';notesWrap.style.display=mode===\'publish\'?\'none\':\'\';const capabilities=communityDetectCapabilities(tab.html||\'\');let version=\'1.0.0\';if(mode===\'update\')version=communityNextVersion(base,dlg.querySelector(\'#community-change\').value);preview.textContent=`JACoB will prepare ${version}. Detected capabilities: ${capabilities.length?capabilities.join(\', \'):\'none of the sensitive SDK capability groups\'}.`;};\n    modeEl.onchange=updatePreview;dlg.querySelector(\'#community-change\').onchange=updatePreview;updatePreview();\n    dlg.querySelector(\'#community-prepare\').onclick=async()=>{\n      const author=dlg.querySelector(\'#community-author\').value.trim(),description=dlg.querySelector(\'#community-description\').value.trim(),category=dlg.querySelector(\'#community-category\').value,tags=communityTags(dlg.querySelector(\'#community-tags\').value),notes=dlg.querySelector(\'#community-notes\').value.trim();\n      if(!author){dlg.querySelector(\'#community-author\').focus();return}if(!description){dlg.querySelector(\'#community-description\').focus();return}\n      const bytes=new TextEncoder().encode(tab.html||\'\');if(!bytes.length||bytes.length>4*1024*1024){preview.textContent=\'This tab cannot be submitted because its HTML is empty or larger than 4 MiB.\';return}\n      preview.textContent=\'Preparing submission…\';\n      try{\n        let packageId=c?.packageId||communityPackageID(tab.name),basedOn=c?.basedOn||null,version=\'1.0.0\';\n        if(mode===\'update\'){version=communityNextVersion(base,dlg.querySelector(\'#community-change\').value)}\n        if(mode===\'remix\'){basedOn={packageId:c.packageId,version:communityCurrentBase(c)};packageId=communityPackageID(tab.name);version=\'1.0.0\'}\n        const sha256=await communitySHA256(bytes),capabilities=communityDetectCapabilities(tab.html||\'\'),sdk=Number(state.core?.apiVersion||state.core?.sdkVersion||15)||15;\n        const submission={schema:1,kind:\'jacob-community-submission\',action:mode,createdAt:new Date().toISOString(),tab:{packageId,name:tab.name,description,author,version,sdk,category,tags,notes,baseVersion:mode===\'update\'?base:\'\',basedOn:mode===\'remix\'?basedOn:null},source:{encoding:\'base64\',sizeBytes:bytes.length,sha256,html:communityBytesToBase64(bytes)},detectedCapabilities:capabilities};\n        const community={packageId,publishedVersion:c?.publishedVersion||\'\',lastSubmittedVersion:version,publishedSha256:c?.publishedSha256||\'\',registry:\'official\',author,description,category,tags,basedOn:mode===\'remix\'?basedOn:(c?.basedOn||null),localAuthor:true,status:\'prepared\'};\n        const saved=await request(\'tabs.community.set\',{id,community});const local=state.savedTabs.find(x=>x.id===id);if(local)local.community=saved.community||community;\n        const filename=`${communitySlug(tab.name)}-${version}.jacobsubmit.json`,payload=JSON.stringify(submission,null,2)+\'\\n\';\n        dlg.innerHTML=`<div style="padding:22px;display:grid;gap:14px"><div class="eyebrow">Ready</div><h2 style="margin:0">${communityEscape(tab.name)} ${version}</h2><p>JACoB prepared everything needed for the community registry.</p><div class="card"><div><strong>Package</strong> <span class="mono">${communityEscape(packageId)}</span></div><div><strong>Capabilities</strong> ${communityEscape(capabilities.length?capabilities.join(\', \'):\'none\')}</div><div><strong>File</strong> ${communityEscape(filename)}</div></div><ol style="margin:0;padding-left:22px"><li>Download the submission file.</li><li>Open the GitHub form.</li><li>Upload that file and click Submit.</li></ol><div class="row" style="justify-content:flex-end"><button id="community-download">Download submission</button><button id="community-open-github">Open GitHub form</button><button id="community-done" class="secondary">Done</button></div></div>`;\n        dlg.querySelector(\'#community-download\').onclick=()=>communityDownload(filename,payload);dlg.querySelector(\'#community-open-github\').onclick=()=>window.open(`${COMMUNITY_SUBMISSION_URL}&title=${encodeURIComponent(`[Community Tab] ${tab.name} ${version}`)}`,\'_blank\',\'noopener\');dlg.querySelector(\'#community-done\').onclick=()=>dlg.close();\n        await loadSavedTabs();\n      }catch(e){preview.textContent=e?.message||String(e)}\n    };\n    dlg.showModal();\n  }\n  const COMMUNITY_REGISTRY_INDEX=\'https://raw.githubusercontent.com/pseudo6626/JACoB/main/registry/index.json\';\n  const COMMUNITY_REGISTRY_STATS=\'https://raw.githubuse