      - name: Format and validate canonical capture architecture
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          gofmt -w internal/vision internal/platform internal/core/server.go internal/core/video_privacy_test.go internal/buildinfo/version.go cmd/installer/main.go
          go mod tidy
          go test ./...
          go test -tags "norecorder,nocapture" ./...

          if (-not (Select-String -Path internal/platform/capture.go -Pattern "type GameFrame struct" -SimpleMatch)) { throw "Canonical GameFrame contract is missing." }
          if (-not (Select-String -Path internal/platform/wgc_capture_windows.go -Pattern "CreateForWindow" -SimpleMatch)) { throw "Windows backend is not using HWND-specific Windows Graphics Capture." }
          foreach ($bad in @('CreateForMonitor','MonitorFromWindow','GetDesktopWindow','DuplicateOutput','StretchBlt','BitBlt')) { if (Select-String -Path internal/platform/capture_windows.go,internal/platform/wgc_capture_windows.go -Pattern $bad -SimpleMatch) { throw "Unsafe desktop/monitor capture path found: $bad" } }
          if (-not (Select-String -Path internal/platform/wgc_capture_windows.go -Pattern "wgcClientCrop" -SimpleMatch)) { throw "WGC backend is not normalizing to Elite client coordinates." }
          if (-not (Select-String -Path internal/platform/capture.go -Pattern "CaptureIntentCalibration" -SimpleMatch)) { throw "Calibration capture intent is missing." }
          if (-not (Select-String -Path internal/vision/tracker.go -Pattern "CaptureFrame(maxWidth, platform.CaptureIntentLive)" -SimpleMatch)) { throw "vision.sample is not using the canonical frame path." }
          if (-not (Select-String -Path internal/vision/inspect.go -Pattern "CaptureFrame(maxWidth, platform.CaptureIntentLive)" -SimpleMatch)) { throw "vision.inspect is not using the canonical frame path." }
          if (Select-String -Path internal/vision/*.go -Pattern ".CaptureJPEG(" -SimpleMatch) { throw "Vision must not use the JPEG capture compatibility path." }
          if (-not (Select-String -Path internal/platform/calibration_capture_windows.go -Pattern "CaptureIntentCalibration" -SimpleMatch)) { throw "Calibration is not using the canonical calibration intent." }
          if (Select-String -Path internal/platform/calibration_capture_windows.go -Pattern "MonitorFromWindow|GetMonitorInfo|CapturePrivacyMatteJPEG") { throw "Calibration must not use monitor/matte capture." }
          if (-not (Test-Path internal/platform/capture_disabled.go)) { throw "OS-neutral No Capture backend is missing." }
          if (Test-Path internal/platform/capture_windows_disabled.go) { throw "Legacy Windows-only No Capture backend should have been removed." }
          if (-not (Select-String -Path internal/platform/capture_linux.go -Pattern "XDG Desktop Portal/PipeWire window capture" -SimpleMatch)) { throw "Linux safe-window backend slot/documentation is missing." }
          if (-not (Select-String -Path internal/platform/capture_linux.go -Pattern "Available() bool { return false }" -SimpleMatch)) { throw "Linux must remain unavailable until safe window capture is implemented." }
          if (-not (Select-String -Path internal/core/server.go -Pattern '"desktopFallback": false' -SimpleMatch)) { throw "Core capture diagnostics do not advertise the no-desktop-fallback rule." }
          if (Select-String -Path internal/vision/*.go -Pattern "CapturePrivacyMatteJPEG" -SimpleMatch) { throw "Vision must remain independent of the Game View matte." }
          if (-not (Select-String -Path internal/vision/ocr_windows.go -Pattern "CREATE_NO_WINDOW|createNoWindow")) { throw "Windows OCR worker is missing no-window protection." }
          foreach ($f in @('examples/vision-text-recognition.html','examples/vision-color-fill-recognition.html','examples/vision-color-detection.html')) { if (-not (Test-Path $f)) { throw "Missing generic Vision example tab: $f" } }
          node --check internal/webui/assets/app.js
          python -m json.tool docs/schemas/vision-inspect-request.schema.json > $null

      - name: Build candidate artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = "0.2.12-alpha"
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"

          $env:GOOS="linux"
          go build -trimpath -o "dist/JACoB-$v-linux-amd64" ./cmd/jacob
          go build -trimpath -tags "norecorder,nocapture" -o "dist/JACoB-$v-linux-amd64-no-capture" ./cmd/jacob

          $env:GOOS="windows"
          go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-portable.exe" ./cmd/jacob
          go build -trimpath -tags "norecorder,nocapture" -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64-no-capture.exe" ./cmd/jacob

          Copy-Item "dist/JACoB-$v-win-x64-portable.exe" cmd/installer/payload/JACoB.exe
          Copy-Item "dist/JACoB-$v-win-x64-no-capture.exe" cmd/installer/payload/JACoB-no-capture.exe
          try {
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/JACoB-$v-win-x64.exe" ./cmd/installer
          } finally {
            Remove-Item cmd/installer/payload/JACoB.exe,cmd/installer/payload/JACoB-no-capture.exe -Force -ErrorAction SilentlyContinue
          }

      - name: Package exact source diff and checksums
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $v = "0.2.12-alpha"
          git add -N .
          git diff --binary --output="dist/JACoB-$v-SDK10-R6-source.patch"
          $changed = @(git diff --name-only)
          $stage = Join-Path $env:RUNNER_TEMP "jacob-sdk10-r7-source"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($f in $changed) {
            if (-not (Test-Path $f -PathType Leaf)) { continue }
            $dest = Join-Path $stage $f
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item $f $dest
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/JACoB-$v-SDK10-R6-source-update.zip" -Force
          Copy-Item "RELEASE-NOTES-$v.md" "dist/RELEASE-NOTES-$v.md"
          $hashFiles = Get-ChildItem dist -File | Where-Object { $_.Name -notlike '*.sha256' }
          $lines = foreach ($f in $hashFiles) {
            $fh=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$fh  $($f.Name)"
          }
          $lines | Out-File "dist/SHA256SUMS.txt" -Encoding ascii
          git status --short | Out-File "dist/SOURCE-STATUS.txt" -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: JACoB-0.2.12-alpha-SDK10-candidate-R7
          if-no-files-found: error
          path: |
            dist/JACoB-0.2.12-alpha-win-x64.exe
            dist/JACoB-0.2.12-alpha-win-x64-portable.exe
            dist/JACoB-0.2.12-alpha-win-x64-no-capture.exe
            dist/JACoB-0.2.12-alpha-linux-amd64
            dist/JACoB-0.2.12-alpha-linux-amd64-no-capture
            dist/JACoB-0.2.12-alpha-SDK10-R6-source.patch
            dist/JACoB-0.2.12-alpha-SDK10-R6-source-update.zip
            dist/RELEASE-NOTES-0.2.12-alpha.md
            dist/SHA256SUMS.txt
            dist/SOURCE-STATUS.txt

      - name: Commit validated candidate
        if: ${{ inputs.commit_candidate }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r6.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r5.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r4.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r3.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap-r2.yml'
          git rm --ignore-unmatch '.github/workflows/JACoB-SDK10-GitHub-Web-Bootstrap.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-bootstrap.yml'
          git rm --ignore-unmatch '.github/workflows/sdk10-prepare.yml'
          git add -A
          git commit -m "JACoB 0.2.12-alpha SDK 10 canonical Elite frame architecture"
          git push origin "HEAD:${{ github.ref_name }}"
